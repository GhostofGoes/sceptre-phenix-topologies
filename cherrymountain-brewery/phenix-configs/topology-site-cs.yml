# cherrymountain-site-cs: the nodes of the site `cs` (Colorado Springs: brewery and taproom, bought from another company).
# Generated by plantgen from plant/plant.yaml and plant/sites.yaml (site cs),
# with the nodes of topology-core.yml, topology-soc.yml, and
# topology-remote-access.yml as the source of each node. Do not edit.
#
# The firewall rulesets are not here. They are in scenario-site-cs.yml,
# which sync.py writes: the rules of the conduits whose two ends are hosts of
# this site, as netcheck computes them (tools/netcheck).
#
# An injected file that holds a name or an address of the plant is the site's
# own copy, under phenix-injects/fleet/cs/ (plantgen renders it, and sync.py
# puts it there).
#
# This file is not a finished site. It does not have these parts yet:
# - The edge's WAN side: its default route, NAT, and the VPN, which the WAN
#   generator writes (tools/wangen).
# - The conduits between sites, with their rules.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-site-cs
spec:
  nodes:
  - commands:
    - exec sg vyattacfg -c /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
    general:
      description: 'IT/Internet firewall: NAT, WireGuard DNAT, IPsec to util-rtr'
      hostname: cs-fw-edge
    hardware:
      drives:
      - image: vyos.qc2
        inject_partition: 3
      memory: 2048
      os_type: vyos
      vcpus: 1
    injections:
    - description: VyOS logging, Wazuh syslog, IKEv2, and NTP settings the vrouter app cannot render
      dst: /boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/fleet/cs/vrouter/cm-vyos-config.sh
    labels:
      site: cs
      zone: edge
    network:
      interfaces:
      - address: 198.18.103.2
        mask: 30
        name: eth0
        proto: static
        type: ethernet
        vlan: WAN-BC-CS
      - address: 192.168.10.1
        mask: 24
        name: eth1
        proto: static
        type: ethernet
        vlan: CS-OFFICE
      - address: 192.168.20.1
        mask: 24
        name: eth2
        proto: static
        type: ethernet
        vlan: CS-PLANT
      - address: 192.168.30.1
        mask: 24
        name: eth3
        proto: static
        type: ethernet
        vlan: CS-BAS
    type: Firewall
  - general:
      description: NTP (chrony), DNS (dnsmasq), syslog relay, OPS BBMD (BACpypes3)
      hostname: cs-ot-svc
    hardware:
      drives:
      - image: cm-svc.qc2
        inject_partition: 1
      memory: 1024
      os_type: linux
      vcpus: 1
    injections:
    - description: BBMD settings for the OPS BBMD (listens on a /0 prefix for FUXA's limited broadcast)
      dst: /etc/default/cm-bbmd
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/fleet/cs/bbmd/ot-svc.env
    - description: 'dnsmasq: authoritative plant zone, no upstream'
      dst: /etc/dnsmasq.d/10-plant.conf
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/fleet/cs/ot-svc/dnsmasq-plant.conf
    - description: plant host names and addresses
      dst: /etc/cherrymountain/plant.hosts
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/fleet/cs/ot-svc/plant.hosts
    - description: 'rsyslog: receive UDP 514 and relay to Wazuh'
      dst: /etc/rsyslog.d/30-cm-relay.conf
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/ot-svc/rsyslog-relay.conf
    - description: restrict chrony clients, start DNS and syslog
      dst: /etc/phenix/startup/60-ot-svc.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/fleet/cs/ot-svc/60-ot-svc.sh
    - description: BACpypes3 BBMD service
      dst: /usr/local/lib/cm-bbmd/cm_bbmd.py
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/cm_bbmd.py
    - description: BBMD service unit
      dst: /etc/systemd/system/cm-bbmd.service
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/cm-bbmd.service
    - description: start the BBMD service at boot
      dst: /etc/phenix/startup/70-bbmd.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/70-bbmd.sh
    labels:
      site: cs
      zone: plant
    network:
