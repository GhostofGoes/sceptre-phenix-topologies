# cherrymountain-site-cs scenario: the firewall rules of the site `cs`
# and its SoH network tests. Generated by netcheck (tools/netcheck,
# `python -m netcheck --write-sites`) from the conduit matrix
# (netcheck/conduits.py) and plant/sites.yaml. Do not edit.
#
# The rules carry the conduits whose two ends are hosts of this site, and
# nothing else: 22 rules on cs-fw-edge (22).
# This file is not a finished scenario. It does not have these parts yet:
# - The conduits to the internet, the vendor, the utility, and other sites,
#   with the edge's NAT and VPN.
# - The app blocks that plantgen writes for the site
#   (plant/generated/fleet/cs/phenix/), which sync.py does not embed yet.
apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: cherrymountain-site-cs
  annotations:
    topology: cherrymountain-site-cs
spec:
  apps:
  - name: vrouter
    hosts:
    - hostname: cs-fw-edge
      metadata:
        acl:
          egress:
            eth0: FROM-WAN-BC-CS
            eth1: FROM-CS-OFFICE
            eth2: FROM-CS-PLANT
            eth3: FROM-CS-BAS
          rulesets:
          - name: FROM-WAN-BC-CS
            default: drop
            description: 'Traffic entering cs-fw-edge from WAN-BC-CS: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
          - name: FROM-CS-OFFICE
            default: drop
            description: 'Traffic entering cs-fw-edge from CS-OFFICE: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
          - name: FROM-CS-PLANT
            default: drop
            description: 'Traffic entering cs-fw-edge from CS-PLANT: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
            - id: 10
              action: accept
              description: 'hmi-fuxa: cs-hmi-brewhouse to cs-bas-fuxa tcp/1881'
              protocol: tcp
              source:
                address: 192.168.20.30
              destination:
                address: 192.168.30.10
                port: 1881
            - id: 20
              action: accept
              description: 'hmi-fuxa: cs-hmi-packaging to cs-bas-fuxa tcp/1881'
              protocol: tcp
              source:
                address: 192.168.20.31
              destination:
                address: 192.168.30.10
                port: 1881
            - id: 30
              action: accept
              description: 'fuxa-bacnet: cs-scada-fuxa to cs-bas-rtu-taproom udp/47808'
              protocol: udp
              source:
                address: 192.168.20.40
              destination:
                address: 192.168.30.20
                port: 47808
            - id: 40
              action: accept
              description: 'fuxa-bacnet: cs-scada-fuxa to cs-bas-coldroom udp/47808'
              protocol: udp
              source:
                address: 192.168.20.40
