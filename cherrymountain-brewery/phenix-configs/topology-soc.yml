# cherrymountain-soc: the SOC module (DESIGN.md 14 and 15.3): malcolm, wazuh,
# and soc-analyst. The mirror NIC of malcolm is added by the mirror app.
# Included by cherrymountain-full; the lite variant leaves it out.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-soc
spec:
  nodes:
  - annotations:
      phenix/startup-autotunnel:
      - 18444:443
    general:
      description: Wazuh manager, indexer, and dashboard
      hostname: wazuh
    hardware:
      drives:
      - image: cm-wazuh.qc2
        inject_partition: 1
      memory: 8192
      os_type: linux
      vcpus: 4
    labels:
      zone: soc
    network:
      interfaces:
      - address: 10.40.10.11
        dns:
        - 10.20.30.13
        gateway: 10.40.10.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: SOC
    type: VirtualMachine
  - annotations:
      phenix/startup-autotunnel:
      - 18443:443
    general:
      description: 'Malcolm: Zeek and ICSNPP, Suricata, Arkime, OpenSearch (mirror NIC added by the mirror app)'
      hostname: malcolm
    hardware:
      drives:
      - image: cm-malcolm.qc2
        inject_partition: 1
      memory: 24576
      os_type: linux
      vcpus: 8
    injections:
    - description: add the OpenFlow capture flow after the mirror app's OVS setup
      dst: /etc/phenix/startup/99-zz-capture-flow.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/malcolm/99-zz-capture-flow.sh
    labels:
      zone: soc
    network:
      interfaces:
      - address: 10.40.10.10
        dns:
        - 10.20.30.13
        gateway: 10.40.10.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: SOC
    type: VirtualMachine
  - delay:
      c2:
      - hostname: wazuh
        useUUID: false
      - hostname: malcolm
        useUUID: false
    general:
      description: Analyst workstation
      hostname: soc-analyst
    hardware:
      drives:
      - image: cm-desktop.qc2
        inject_partition: 1
      memory: 3072
      os_type: linux
      vcpus: 2
    labels:
      zone: soc
    network:
      interfaces:
      - address: 10.40.10.12
        dns:
        - 10.20.30.13
        gateway: 10.40.10.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: SOC
    type: VirtualMachine
