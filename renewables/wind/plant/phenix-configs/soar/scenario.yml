              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        wtg-04:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        wtg-05:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        rtr-owop:
        - name: acl-rulesets
          testScript: |
            # VyOS renders each firewall ruleset as the nftables chain NAME_<ruleset>,
            # which the forward filter jumps to for the interface the vrouter app binds.
            for _ in $(seq 36); do
              rules=$(nft list ruleset 2>&1)
              missing=""
              for name in owop-in owop-out; do
                if ! grep -qF "chain NAME_$name {" <<<"$rules" || ! grep -qE "jump NAME_$name( |\$)" <<<"$rules"; then
                  missing="$missing $name"
                fi
              done
              [ -z "$missing" ] && break
              sleep 5
            done
            if [ -z "$missing" ]; then echo "ACL rulesets loaded and applied"; else echo "ACL rulesets not loaded or not applied:$missing"; fi
          testStdout: ACL rulesets loaded and applied
        - name: plant-routes
          testScript: |
            nets="10.0.10.0/30 10.0.20.0/30 10.0.30.0/30 10.0.40.0/30 75.75.0.0/16 192.168.10.0/24 192.168.20.0/24 192.168.30.0/24 192.168.40.0/24 192.168.50.0/24 192.168.60.0/24 192.168.100.0/24"
            for _ in $(seq 36); do
              missing=""
              for net in $nets; do [ -n "$(ip -4 route show "$net")" ] || missing="$missing $net"; done
              [ -z "$missing" ] && break
              sleep 5
            done
            if [ -z "$missing" ]; then echo "routes to every plant network"; else echo "no route to:$missing"; fi
          testStdout: routes to every plant network
        - name: ipsec-sas
          testScript: |
            here=10.0.10.2
            peers="10.0.40.2"
            for _ in $(seq 36); do
              sas=$(ip xfrm state | awk '$1 == "src" && $3 == "dst" { print $2 ">" $4 }')
              missing=""
              for peer in $peers; do
                for pair in "$here>$peer" "$peer>$here"; do
                  grep -qxF "$pair" <<<"$sas" || missing="$missing $pair"
                done
              done
              [ -z "$missing" ] && break
              sleep 5
            done
            if [ -z "$missing" ]; then echo "ESP SAs with every IPsec peer"; else echo "no ESP SA for:$missing"; fi
          testStdout: ESP SAs with every IPsec peer
        rtr-isp1:
        - name: plant-routes
          testScript: |
            nets="10.0.10.0/30 10.0.20.0/30 10.0.30.0/30 10.0.40.0/30 75.75.0.0/16 192.168.10.0/24 192.168.20.0/24 192.168.30.0/24 192.168.40.0/24 192.168.50.0/24 192.168.60.0/24 192.168.100.0/24"
            for _ in $(seq 36); do
              missing=""
              for net in $nets; do [ -n "$(ip -4 route show "$net")" ] || missing="$missing $net"; done
              [ -z "$missing" ] && break
              sleep 5
            done
            if [ -z "$missing" ]; then echo "routes to every plant network"; else echo "no route to:$missing"; fi
          testStdout: routes to every plant network
        rtr-grid:
        - name: acl-rulesets
          testScript: |
            for _ in $(seq 36); do
              rules=$(nft list ruleset 2>&1)
              missing=""
              for name in grid-in grid-out; do
                if ! grep -qF "chain NAME_$name {" <<<"$rules" || ! grep -qE "jump NAME_$name( |\$)" <<<"$rules"; then
                  missing="$missing $name"
                fi
              done
              [ -z "$missing" ] && break
              sleep 5
            done
            if [ -z "$missing" ]; then echo "ACL rulesets loaded and applied"; else echo "ACL rulesets not loaded or not applied:$missing"; fi
          testStdout: ACL rulesets loaded and applied
        - name: plant-routes
          testScript: |
            nets="10.0.10.0/30 10.0.20.0/30 10.0.30.0/30 10.0.40.0/30 75.75.0.0/16 192.168.10.0/24 192.168.20.0/24 192.168.30.0/24 192.168.40.0/24 192.168.50.0/24 192.168.60.0/24 192.168.100.0/24"
            for _ in $(seq 36); do
