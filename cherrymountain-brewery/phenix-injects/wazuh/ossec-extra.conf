<!--
  Appended to /var/ossec/etc/ossec.conf by cm-wazuh-provision (Wazuh merges several
  <ossec_config> blocks). DESIGN.md 10.3 and 14.

  Syslog comes from the VyOS firewalls (fw-edge and fw-ot send their logs, drops
  included, straight to the manager) and from the ot-svc relay (the rest of the OT
  zones); all use UDP 514. A VyOS router sends from the address of the interface
  that faces the SOC, so the allowed sources are the DMZ side of fw-edge and fw-ot,
  fw-ot's SOC address, and ot-svc.
-->
<ossec_config>
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.10.20.0/24</allowed-ips>
    <allowed-ips>10.40.10.1</allowed-ips>
    <allowed-ips>10.20.30.13</allowed-ips>
  </remote>
</ossec_config>
