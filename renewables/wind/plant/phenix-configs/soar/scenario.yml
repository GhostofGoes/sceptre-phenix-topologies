            if [ -z "$missing" ]; then echo "ACL rulesets loaded and applied"; else echo "ACL rulesets not loaded or not applied:$missing"; fi
          testStdout: ACL rulesets loaded and applied
        - name: plant-routes
          testScript: |
            nets="10.0.10.0/30 10.0.20.0/30 10.0.30.0/30 10.0.40.0/30 75.75.0.0/16 192.168.10.0/24 192.168.20.0/24 192.168.30.0/24 192.168.40.0/24 192.168.50.0/24 192.168.60.0/24 192.168.100.0/24 10.222.222.0/24"
            for _ in $(seq 36); do
              missing=""
              for net in $nets; do [ -n "$(ip -4 route show "$net")" ] || missing="$missing $net"; done
              [ -z "$missing" ] && break
