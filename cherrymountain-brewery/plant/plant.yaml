    upstream: [relay-main, pv-inverter, bess-pcs]
    interfaces:
      IF0: { vlan: DERLINK, ip: 10.20.15.10/24 }
      IF1: { vlan: FIELD-PWR, ip: 10.20.16.2/24 }
  bas-bbmd:
    role: bbmd
    app: { type: bbmd }
    interfaces:
      IF0: { vlan: BAS, ip: 10.30.10.5/24 }
  bas-fuxa:
    role: scada
    app: { type: fuxa, role: bas }
    fuxa:
      - { host: bas-rtu-taproom }
      - { host: bas-coldroom }
      - { host: bas-vent }
    interfaces:
      IF0: { vlan: BAS, ip: 10.30.10.10/24 }
  bas-rtu-taproom:
    role: bas
    federate: building
    bacnet: { interface: IF0, port: 47808, instance: 3001, name: BAS-RTU-1 }
    interfaces:
      IF0: { vlan: BAS, ip: 10.30.10.20/24 }
      mgmt: { vlan: MGMT, ip: 172.16.20.31/16 }
  bas-coldroom:
    role: bas
    federate: building
    bacnet: { interface: IF0, port: 47808, instance: 3002, name: BAS-COLDROOM-1 }
    interfaces:
      IF0: { vlan: BAS, ip: 10.30.10.21/24 }
      mgmt: { vlan: MGMT, ip: 172.16.20.32/16 }
  bas-vent:
    role: bas
    federate: building
    bacnet: { interface: IF0, port: 47808, instance: 3003, name: BAS-VENT-1 }
    interfaces:
      IF0: { vlan: BAS, ip: 10.30.10.22/24 }
      mgmt: { vlan: MGMT, ip: 172.16.20.33/16 }
  malcolm:
    role: soc
    interfaces:
      IF0: { vlan: SOC, ip: 10.40.10.10/24 }
  wazuh:
    role: soc
    app: { type: wazuh-manager }
    interfaces:
      IF0: { vlan: SOC, ip: 10.40.10.11/24 }
  soc-analyst:
    role: workstation
    interfaces:
      IF0: { vlan: SOC, ip: 10.40.10.12/24 }

# Alarm rationalization library (ISA-18.2, DESIGN.md §6.5). An alarm can
# reference an entry with `rationale:` and override any field inline.
# response_time is the time the operator has to act before the consequence.
alarm_rationale:
  fv-temp-deviation:
    priority: high
    cause: Glycol valve stuck or failed, glycol supply too warm, or chiller fault
    consequence: Off-flavors (esters, fusels) or a stalled fermentation; batch loss
    action: Check the zone glycol valve and the glycol supply temperature; put the zone in manual if needed
    response_time: 30m
  fv-cone-deviation:
    priority: medium
    cause: Cone glycol valve stuck or failed, or yeast cake insulating the cone RTD
    consequence: Poor yeast settling and uneven crash; slower turnaround
    action: Check the cone glycol valve and the cone RTD; compare with the side temperature
    response_time: 60m
  fv-temp-high:
    priority: medium
    cause: Runaway fermentation heat with no cooling, or the setpoint profile entered wrongly
    consequence: Yeast stress, fusel alcohols, and diacetyl; possible blow-off
    action: Open the side glycol valve, verify the setpoint profile, and check glycol supply
    response_time: 20m
  fv-pressure-high:
    priority: high
    cause: Spunding valve stuck closed or setpoint too high during active fermentation
    consequence: Mechanical relief lifts at 15 psig MAWP (27.1 psia); CO2 release into the cellar
    action: Reduce the spunding setpoint or vent manually; check the spunding valve
    response_time: 10m
  fv-pressure-low:
    priority: low
    cause: CO2 reabsorption and gas contraction during cold crash without top pressure
    consequence: Vacuum relief admits air; oxygen pickup and staling
    action: Apply CO2 top pressure through the blow-off arm
    response_time: 60m
  # -- brewhouse ------------------------------------------------------------------
  hlt-level-low:
    priority: low
    cause: CLT transfer stopped or HLT drawn down by strike and sparge
    consequence: Steam jacket heats a low liquid level; next brew starts late
    action: Check the CLT level and the HLT fill valve; refill before the next mash-in
    response_time: 30m
  hlt-temp-high:
    priority: medium
    cause: Steam valve stuck open or HLT temperature loop in manual
    consequence: Liquor too hot for strike and sparge; tannin extraction and scald risk
    action: Close the HLT steam valve and check the temperature loop mode
    response_time: 15m
  mash-temp-deviation:
    priority: medium
    cause: Jacket steam valve fault, poor mixing, or wrong strike temperature
    consequence: Wrong fermentability; beer misses its final gravity
    action: Check the MLT steam valve and rake; adjust the step manually if needed
    response_time: 10m
  lauter-dp-high:
    priority: medium
    cause: Grain bed compacted (stuck mash) or runoff faster than the bed allows
    consequence: Runoff stops; long lauter and poor extract
    action: Reduce runoff, raise the rake and cut the bed, then resume slowly
    response_time: 10m
  kettle-level-high:
    priority: high
    cause: Over-collection during lauter or boil-over at the hot break
    consequence: Hot wort overflows the kettle; scald hazard and product loss
    action: Cut the kettle steam immediately and stop the runoff
    response_time: 2m
  knockout-temp-deviation:
    priority: high
    cause: Glycol trim valve fault, warm glycol, or CLT water too warm at stage 1
    consequence: Yeast pitched at the wrong temperature; off-flavors or slow start
    action: Slow the wort pump, check the stage-2 glycol valve and glycol supply
    response_time: 5m
  knockout-do-low:
    priority: low
    cause: O2 mass-flow controller fault or empty O2 cylinder
    consequence: Under-oxygenated wort; sluggish fermentation
    action: Check the O2 supply and the mass-flow controller
    response_time: 15m
  # -- cellar conditioning --------------------------------------------------------
  bbt-pressure-high:
    priority: high
    cause: Carbonation stone left open or regulator setpoint too high
    consequence: Mechanical relief lifts at 15 psig; CO2 released into the cellar
    action: Close the carbonation valve and vent to the target pressure
    response_time: 10m
  psv-lifted:
    priority: high
    cause: Head pressure reached the 15 psig MAWP; spunding setpoint written too high, spunding valve stuck closed, or a carbonation stone or regulator forced open
    consequence: The relief valve vents CO2 into the cellar until the head blows down 10 %; repeated lifts raise the cellar CO2 toward the life-safety tiers
    action: Find the gas source (spunding setpoint, stone, regulator) and stop it; check cellar CO2 and the purge fans
    response_time: 5m
  bbt-temp-deviation:
    priority: medium
    cause: Jacket valve fault or warm glycol supply
    consequence: Carbonation drifts off target and the beer warms
    action: Check the BBT jacket valve and the glycol supply temperature
    response_time: 30m
  vessel-entry-violation:
    priority: critical
    cause: "A write (HMI, EWS, or an attacker) or a phase start tried to drive a valve, steam, or motor output of a vessel locked out for confined-space entry"
    consequence: CO2, glycol, steam, hot water, or CIP chemical into a vessel with a person inside (29 CFR 1910.146)
    action: Confirm with the attendant that the entrant is out or safe, keep the lockout, and find who or what wrote the output
    response_time: 1m
  carbonation-inhibited:
    priority: medium
    cause: Cellar CO2 at or above 15,000 ppm (bas-vent tier 2)
    consequence: BBT carbonation is held until the room is safe
    action: Confirm the purge fans are running and find the CO2 source before re-entry
    response_time: 15m
  # -- packaging ------------------------------------------------------------------
  line-held:
    priority: low
    cause: An upstream or downstream machine held the line (jam, starved, or blocked)
    consequence: Lost production and warm product in the filler bowl
    action: Check the PackML stop reason and clear the holding machine
    response_time: 15m
  filler-bowl-low:
    priority: medium
    cause: BBT pressure or level low, or the product valve closed
    consequence: Short fills and foaming; rejects at fill-level inspection
    action: Check BBT-202 pressure and level and the filler product valve
    response_time: 5m
  machine-jam:
    priority: low
    cause: Fallen bottle, broken glass, or label stock fault at the machine
    consequence: The machine stops; the line blocks or starves
    action: Clear the jam with the machine in Maintenance mode, then reset
    response_time: 10m
  # -- utilities ------------------------------------------------------------------
  glycol-supply-high:
    priority: high
    cause: Chiller compressor fault, high load (crash plus knockout), or high ambient
    consequence: Fermenters lose temperature control; batches at risk
    action: Check the chiller stages and faults; defer cold crashes and knockout
    response_time: 15m
  chiller-fault:
    priority: high
    cause: Compressor trip (high head pressure, low suction, or overload)
    consequence: Glycol capacity drops; supply temperature rises
    action: Reset the chiller at its controller; call for service if it repeats
    response_time: 15m
  glycol-reservoir-low:
    priority: medium
    cause: Glycol leak at a jacket, hose, or pump seal
    consequence: Pump cavitation and loss of cooling
    action: Find and isolate the leak; top up the reservoir with 35% propylene glycol
    response_time: 30m
  boiler-low-water:
    priority: high
    cause: Feedwater pump failure or a leak; the hardwired low-water cutoff tripped
    consequence: Boiler off; no steam for mash, boil, or CIP
    action: Check the feedwater supply and the cutoff; reset at the boiler
    response_time: 10m
  steam-pressure-low:
    priority: medium
    cause: Boiler disabled, feeder open, or demand above 200 kW
    consequence: Slow heating; the boil may not reach vigor
    action: Check the boiler enable, its feeder breaker, and the steam demand
    response_time: 10m
  air-pressure-low:
    priority: medium
    cause: Compressor off or failed, or a large leak
    consequence: Pneumatic valves and the bottling line stop
    action: Check the compressor and the dryer; look for leaks
    response_time: 10m
  co2-supply-low:
    priority: medium
    cause: Bulk tank low or vaporizer frozen
    consequence: No CO2 for purging, carbonation, or counterpressure filling
    action: Check the bulk tank level and the vaporizer; order a delivery
    response_time: 30m
  co2-supply-shutoff:
    priority: high
    cause: "CO2 at 30,000 ppm in an area (cellar, bulk tank, filler, or cold room), or the gas detection lost power or failed; the bas-vent shutoff relay dropped"
    consequence: The bulk CO2 supply is closed (fail closed, latched); no carbonation, purging, or counterpressure filling until it is reset
    action: Evacuate per tier 3, find and stop the release, restore detection, then reset the shutoff from the HMI once every area is clear
    response_time: 5m
  co2-tank-low:
    priority: low
    cause: Normal consumption since the last delivery
    consequence: Supply runs out in a few days
    action: Schedule a bulk CO2 delivery
    response_time: 24h
  refrigerant-leak:
    priority: high
    cause: Refrigerant leak at the glycol chiller (a fitting, brazed joint, or compressor seal)
    consequence: R-410A above its 1,000 ppm exposure limit displaces oxygen near the unit; the charge falls, capacity drops, and the leak rate may pass the 30 %/yr repair trigger of 40 CFR 84 Subpart C
    action: Ventilate and keep people away from the unit; have a certified technician find the leak, record the top-off and leak rate, and repair within 30 days
    response_time: 15m
  ro-conductivity-high:
    priority: low
    cause: RO membrane fouling or a failed carbon prefilter
    consequence: Brewing liquor out of specification
    action: Check the membranes and the carbon filter; switch to the backup supply
    response_time: 4h
  wastewater-ph:
    priority: low
    cause: Caustic or acid CIP dump faster than the dosing can neutralize
    consequence: Discharge inhibited until pH returns to 6.0-9.0
    action: Check the dosing pumps and chemical levels; hold CIP dumps
    response_time: 1h
  discharge-inhibited:
    priority: medium
    cause: Neutralization tank pH outside 6.0-9.0
    consequence: Tank fills; CIP and brewhouse drains must stop when it is full
    action: Check the neutralization and dosing; do not override the discharge permit
    response_time: 30m
  wastewater-level-high:
    priority: medium
    cause: Discharge inhibited for a long time, or a large dump
    consequence: Tank overflow to the floor drain (permit violation)
    action: Stop CIP and brewhouse drains until the tank is neutralized and discharged
    response_time: 15m
  cip-temp-deviation:
    priority: low
    cause: Steam valve fault or low steam pressure
    consequence: Caustic below 175 degF cleans poorly; the cycle must be repeated
    action: Check the CIP steam valve and the steam header pressure
    response_time: 15m
  # -- electrical -----------------------------------------------------------------
  utility-outage:
    priority: high
    cause: Utility feeder lost (Summit Valley Power) or the main breaker opened
    consequence: Brewhouse and packaging stop; EP-1 runs on the genset
    action: Confirm the genset carries EP-1; hold the large feeders open until the utility returns
    response_time: 5m
  main-breaker-trip:
    priority: high
    cause: Overcurrent or ground fault on the 480 V service
    consequence: The whole site is on the genset (EP-1 only)
    action: Do not reclose before the fault is found; call the electrical contractor
    response_time: 10m
  demand-high:
    priority: medium
    cause: Coincident boiler, chiller, and packaging load above the demand target
    consequence: A new monthly demand peak costs about $37 per kW in summer
    action: Defer the next boil step or packaging start; check the BESS dispatch
    response_time: 15m
  voltage-low:
    priority: medium
    cause: Utility voltage sag or heavy motor starting
    consequence: Below ANSI C84.1 Range A; motors run hot and drives may trip
    action: Check the utility service and the load; stagger motor starts
    response_time: 15m
  bess-fault:
    priority: medium
    cause: PCS fault, battery temperature, or a communication loss
    consequence: No peak shaving; the monthly demand peak may rise
    action: Check the PCS fault code and reset it from its panel
    response_time: 1h
  bess-cell-temp-high:
    priority: medium
    cause: Cooling fault, high ambient, or a failing cell heating in the BESS enclosure
    consequence: Accelerated aging; a cell near its limit can go into thermal runaway
    action: Check the enclosure HVAC and the BMS cell report; reduce the dispatch or disable the BESS
    response_time: 30m
  bess-cell-temp-critical:
    priority: high
    cause: A cell well above its limit (internal short, overcharge, or cooling lost)
    consequence: Thermal runaway is near (UL 9540A); the PCS trips the battery off line
    action: Disable the BESS, keep people away from the enclosure, and follow the emergency response plan (NFPA 855)
    response_time: 5m
  bess-offgas:
    priority: critical
    cause: A battery cell is venting electrolyte vapor, the first stage of thermal runaway (UL 9540A)
    consequence: Fire and a flammable-gas deflagration in the BESS enclosure; propagation to the next modules
    action: Evacuate the area around the BESS, keep it isolated and the enclosure closed, and call the fire department per the emergency response plan
    response_time: 1m
  bess-soc-low:
    priority: low
    cause: Discharge for peak shaving or energy shift without enough recharge
    consequence: Too little energy to cap the next brew-day peak
    action: Check the overnight recharge schedule and the dispatch settings
    response_time: 4h
  power-clock-untrusted:
    priority: medium
    cause: The ATS controller clock stopped, jumped, or reads out of range, or the power federate is not publishing it
    consequence: "plc-power falls back to demand-cap dispatch only: no on-peak shift, no overnight or brew-day recharge, no monthly demand reset, no weekly genset exercise (NFPA 110 test records fall behind)"
    action: Check the sim-power federate and the gen-ats clock registers (PWR.GEN.KI01 to KI03); the schedule resumes after two minutes of a steady clock
    response_time: 1h
  # -- facilities (BACnet, evaluated by FUXA) -----------------------------------
  cellar-co2-purge:
    priority: low
    cause: Fermentation venting or a small CO2 leak raised the cellar above 5,000 ppm
    consequence: The OSHA PEL (5,000 ppm, 8 h TWA) is exceeded; the purge fans are running
    action: Confirm both purge fans run (FAN01 and FAN02) and limit time in the cellar until it clears
    response_time: 30m
  cellar-co2-high:
    priority: high
    cause: Fermentation venting, a CO2 leak, or the purge fans not running
    consequence: CO2 above the NIOSH short-term limit (30,000 ppm) is near
    action: Keep staff out of the cellar, confirm the purge fans, and find the source
    response_time: 5m
  cellar-co2-critical:
    priority: critical
    cause: Large CO2 release (blow-off, relief valve, or line break)
    consequence: Life safety; CO2 at the NIOSH STEL and approaching IDLH (40,000 ppm)
    action: Evacuate the cellar; enter only with SCBA; ventilate before re-entry
    response_time: 1m
  co2-area-pel:
    priority: low
    cause: CO2 above 5,000 ppm at the bulk tank, the filler, or the cold room and draft system (a leaking fitting, the filler's snift exhaust, or a draft line)
    consequence: The OSHA PEL (5,000 ppm, 8 h TWA) is exceeded in that area; its exhaust fans are running
    action: Confirm the area exhaust (FAN03) runs, limit time in the area, and check the CO2 fittings there
    response_time: 30m
  co2-area-high:
    priority: high
    cause: A CO2 leak at the bulk tank, the vaporizer, the filler, or the draft system, or the area exhaust not running
    consequence: CO2 approaching the NIOSH short-term limit (30,000 ppm) in a point-of-use or supply area
    action: Keep staff out of the area, confirm the exhaust, and find the source
    response_time: 5m
  co2-area-critical:
    priority: critical
    cause: Large CO2 release at the bulk tank, the vaporizer, the filler, or the draft system
    consequence: Life safety; the horns and strobes run and the CO2 supply shutoff closes the bulk tank valve
    action: Evacuate the area; enter only with SCBA; ventilate before re-entry and before resetting the shutoff
    response_time: 1m
  coldroom-temp-high:
    priority: medium
    cause: Door left open, defrost stuck, or condensing unit fault
    consequence: Kegs warm; foaming at the taps and product quality loss
    action: Close the door, check the defrost and the compressor
    response_time: 30m
  taproom-temp-high:
    priority: low
    cause: RTU-1 cooling stage fault or an economizer stuck open on a hot day
    consequence: Uncomfortable taproom; guests leave
    action: Check RTU-1 cooling stages and the economizer damper
    response_time: 1h

areas:
  - id: BH
    name: Raw materials and brewhouse
    plc: plc-brewhouse
    rio: rio-brewhouse
    federate: brewhouse
    units:
      - id: MILL
        name: Grain silo, auger, and roller mill
        model: mill
        devices:
          - { name: mill, type: mill }
        tags:
          - { id: LT01.PV, desc: Grain silo level, io: mill.silo_level_pct, units: "%", range: [0, 100] }
          - { id: SI01.PV, desc: Mill VFD speed, io: mill.speed_hz, units: Hz, range: [0, 60] }
          - { id: YS01.PV, desc: Mill running, io: mill.running }
          - { id: HS01.CMD, desc: Mill run command, io: mill.run }
          - { id: HS02.CMD, desc: Grain auger run command, io: mill.auger_run }
          - { id: SC01.SP, desc: Mill VFD speed reference, io: mill.speed_sp_hz, units: Hz, range: [0, 60] }

      - id: CLT
        name: Cold liquor tank
        model: liquor-tank
        devices:
          - { name: clt, type: liquor-tank }
        tags:
          - { id: LT01.PV, desc: CLT level, io: clt.level_pct, units: "%", range: [0, 100] }
          - { id: TT01.PV, desc: CLT temperature, io: clt.temp_f, units: degF, range: [32, 212] }
          - { id: LSH01.PV, desc: CLT high-level switch, io: clt.high_level }
          - { id: XV01.CMD, desc: CLT fill valve (RO permeate), io: clt.fill_valve }

      - id: HLT
        name: Hot liquor tank
        model: hot-liquor-tank
        devices:
          - { name: hlt, type: hot-liquor-tank }
        tags:
          - id: LT01.PV
            desc: HLT level
            io: hlt.level_pct
            units: "%"
            range: [0, 100]
            alarms:
              - { kind: low, limit: 20.0, delay: 1m, rationale: hlt-level-low }
          - id: TT01.PV
            desc: HLT temperature
            io: hlt.temp_f
            units: degF
            range: [32, 212]
            alarms:
              - { kind: high, limit: 190.0, delay: 2m, rationale: hlt-temp-high }
          - { id: LSL01.PV, desc: "HLT low-level switch (made while the steam jacket is covered; drops below 15 %)", io: hlt.low_level }
          - { id: XV01.CMD, desc: HLT fill valve (from the CLT), io: hlt.fill_valve }
          - { id: TV01.OUT, desc: HLT steam valve position, io: hlt.steam_valve_pct, units: "%", range: [0, 100] }
          - { id: TT01.SP, desc: HLT temperature setpoint, type: analog-read-write, units: degF, range: [32, 212], scaling: 1 }

      - id: MLT
        name: Mash/lauter tun
        model: mash-tun
        devices:
          - { name: mlt, type: mash-tun }
        tags:
          - id: TT01.PV
            desc: MLT mash temperature
            io: mlt.temp_f
            units: degF
            range: [32, 212]
            alarms:
              - { kind: deviation, setpoint: TT01.SP, limit: 2.0, delay: 10m, rationale: mash-temp-deviation, suppress: XS01.ACTIVE }
          - { id: LT01.PV, desc: MLT level, io: mlt.level_pct, units: "%", range: [0, 100] }
          - id: PDT01.PV
            desc: MLT false-bottom differential pressure
            io: mlt.bed_dp_psi
            units: psi
            range: [0, 10]
            alarms:
              - { kind: high, limit: 1.5, delay: 2m, rationale: lauter-dp-high }
          - { id: FT01.PV, desc: Lauter runoff flow, io: mlt.runoff_gpm, units: gal/min, range: [0, 100] }
          - { id: FT02.PV, desc: Sparge flow, io: mlt.sparge_gpm, units: gal/min, range: [0, 100] }
          - { id: ZT01.PV, desc: Rake height above the false bottom, io: mlt.rake_height_in, units: in, range: [0, 40] }
          - { id: YS01.PV, desc: Rake running, io: mlt.rake_running }
          - { id: XV01.CMD, desc: Strike water valve (from the HLT), io: mlt.strike_valve }
          - { id: HS01.CMD, desc: Rake run command, io: mlt.rake_run }
          - { id: TV01.OUT, desc: MLT jacket steam valve position, io: mlt.steam_valve_pct, units: "%", range: [0, 100] }
          - { id: FV01.OUT, desc: Runoff valve position, io: mlt.runoff_valve_pct, units: "%", range: [0, 100] }
          - { id: FV02.OUT, desc: Sparge valve position, io: mlt.sparge_valve_pct, units: "%", range: [0, 100] }
          - { id: SC01.OUT, desc: Rake speed reference, io: mlt.rake_speed_pct, units: "%", range: [0, 100] }
          - { id: TT01.SP, desc: Mash step temperature setpoint, type: analog-read-write, units: degF, range: [32, 212], scaling: 1 }
          - { id: XS01.ACTIVE, desc: Mash step holding (deviation alarm enabled), type: binary-read }

      - id: KTL
        name: Kettle/whirlpool
        model: kettle
        devices:
          - { name: kettle, type: kettle }
        tags:
          - { id: TT01.PV, desc: Kettle temperature, io: kettle.temp_f, units: degF, range: [32, 230] }
          - id: LT01.PV
            desc: Kettle level
            io: kettle.level_pct
            units: "%"
            range: [0, 100]
            alarms:
              - { kind: high, limit: 92.0, delay: 10s, rationale: kettle-level-high }
          - { id: PT01.PV, desc: Ambient (barometric) pressure for boil detection, io: kettle.ambient_psia, units: psia, range: [0, 20] }
          - { id: LSH01.PV, desc: Kettle high-level switch (boil-over), io: kettle.high_level }
          - { id: XV01.CMD, desc: Whirlpool tangential inlet valve, io: kettle.whirlpool_valve }
          - { id: XV02.CMD, desc: Whirlpool hop doser, io: kettle.hop_doser }
          - { id: TV01.OUT, desc: Kettle jacket steam valve position, io: kettle.steam_valve_pct, units: "%", range: [0, 100] }
          - { id: TB01.PV, desc: Computed local wort boiling point, type: analog-read, units: degF, range: [180, 230], scaling: 1 }
          - { id: KI01.PV, desc: Boil time elapsed, type: analog-read, units: min, range: [0, 600], scaling: 1 }
          - { id: XS01.BOIL, desc: Boil detected (within 0.5 degF of the boiling point), type: binary-read }

      - id: KO
        name: Knockout (wort pump, two-stage HX, inline O2)
        model: knockout
        devices:
          - { name: knockout, type: knockout }
        tags:
          - { id: FT01.PV, desc: Wort flow to the fermenter, io: knockout.wort_gpm, units: gal/min, range: [0, 100] }
          - { id: TT01.PV, desc: HX stage-1 wort outlet temperature (CLT water side), io: knockout.stage1_out_f, units: degF, range: [32, 230] }
          - id: TT02.PV
            desc: Knockout wort temperature (after stage 2)
            io: knockout.wort_out_f
            units: degF
            range: [32, 230]
            alarms:
              - { kind: deviation, setpoint: TT02.SP, limit: 3.0, delay: 2m, rationale: knockout-temp-deviation, suppress: YS01.PV }
          - { id: FT02.PV, desc: Inline O2 flow, io: knockout.o2_slpm, units: L/min, range: [0, 20] }
          - id: AT01.PV
            desc: Wort dissolved oxygen
            io: knockout.do_ppm
            units: ppm
            range: [0, 20]
            alarms:
              - { kind: low, limit: 6.0, delay: 5m, rationale: knockout-do-low, suppress: YS01.PV }
          - { id: YS01.PV, desc: Wort pump running, io: knockout.pump_running }
          - { id: HS01.CMD, desc: Wort pump run command, io: knockout.pump_run }
          - { id: XV01.CMD, desc: Knockout valve to the fermenter header, io: knockout.to_fv_valve }
          - { id: SC01.OUT, desc: Wort pump VFD speed reference, io: knockout.pump_speed_pct, units: "%", range: [0, 100] }
          - { id: TV01.OUT, desc: HX stage-2 glycol valve position, io: knockout.glycol_valve_pct, units: "%", range: [0, 100] }
          - { id: FC01.SP, desc: Inline O2 mass-flow setpoint, io: knockout.o2_sp_slpm, units: L/min, range: [0, 20] }
          - { id: TT02.SP, desc: Knockout temperature setpoint, type: analog-read-write, units: degF, range: [32, 100], scaling: 1 }

      - id: BATCH
        name: ISA-88 phase interface (FUXA batch engine)
        model: phases
        devices:
          - { name: panel, type: batch-panel }
        tags:
          # Phase numbers: 1 MILL, 2 HLT_HEAT, 3 MASH_IN, 4 MASH_STEP, 5 VORLAUF,
          # 6 LAUTER, 7 BOIL, 8 WHIRLPOOL, 9 KNOCKOUT, 10 CIP_READY. Commands
          # and states follow ISA-88 (1 Start, 2 Hold, 3 Restart, 4 Abort, 5 Reset;
          # states 0 Idle, 1 Running, 2 Holding, 3 Held, 4 Restarting, 5 Complete,
          # 6 Aborted).
          - { id: XC01.PHASE, desc: Phase selected by the batch engine, type: analog-read-write, range: [0, 10], scaling: 0 }
          - { id: XC01.CMD, desc: Phase command, type: analog-read-write, range: [0, 5], scaling: 0 }
          - { id: XS01.STATE, desc: Phase state, type: analog-read, range: [0, 6], scaling: 0 }
          - { id: XS01.STEP, desc: Phase step number, type: analog-read, range: [0, 100], scaling: 0 }
          - { id: XI01.BATCH, desc: Batch number (low 16 bits), type: analog-read-write, range: [0, 65535], scaling: 0 }
          # The phase parameter of the next Start, latched at the Start: MILL the
          # grain bill in kg, MASH_STEP the hold in minutes, BOIL the boil in
          # minutes, WHIRLPOOL the stand in minutes. 0 keeps the program's default.
          - { id: XC03.PARAM, desc: "Phase parameter (MILL kg, MASH_STEP, BOIL, and WHIRLPOOL minutes; 0 = program default)", type: analog-read-write, range: [0, 65535], scaling: 0 }
          # Batch requests from the brewhouse panel (the batch-panel device). The
          # engine reads the request counter, queues the brews, and writes its
          # accepted count to XC02; the program forwards it to the panel as XI03.
          - { id: XI02.REQUESTS, desc: "Brews requested at the brewhouse panel since the start (16-bit counter)", io: panel.requests, range: [0, 65535] }
          - { id: XC02.ACCEPTED, desc: "Brew requests the batch engine has accepted (16-bit counter; the engine writes it)", type: analog-read-write, range: [0, 65535], scaling: 0 }
          - { id: XI03.ACCEPTED, desc: "Accepted-request counter sent to the panel (the program forwards XC02)", io: panel.accepted, range: [0, 65535] }

      # Confined-space entry of the mash/lauter tun and the kettle (29 CFR
      # 1910.146, DESIGN.md 6.3): the permit bit locks out the vessel's steam,
      # water, rake, and whirlpool outputs, holds any phase that uses it, and
      # XAnn alarms when a write or a phase start tries to drive one.
      - id: ENTRY
        name: Confined-space entry lockout (mash/lauter tun and kettle)
        model: entry
