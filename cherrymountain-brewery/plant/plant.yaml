        tags:
          - { id: PACKML.STATE, desc: Filler PackML state (StateCurrent), io: filler.state, range: [0, 17] }
          - { id: PACKML.MODE, desc: Filler PackML mode (UnitModeCurrent), io: filler.mode, range: [0, 3] }
          - { id: PACKML.SPEED, desc: Filler current speed (CurMachSpeed), io: filler.speed_bpm, units: bottles/min, range: [0, 60] }
          - { id: PACKML.PROCESSED, desc: Filler ProdProcessedCount (wraps at 65535), io: filler.processed, range: [0, 65535] }
          - { id: PACKML.DEFECTIVE, desc: Fill-level inspection rejects (wraps at 65535), io: filler.defective, range: [0, 65535] }
          - { id: PACKML.STOP_REASON, desc: Filler stop reason (StopReason.ID), io: filler.stop_reason, range: [0, 99] }
          - { id: PT01.PV, desc: Filler bowl pressure (absolute), io: filler.bowl_psia, units: psia, range: [0, 60] }
          - id: YA01.PV
            desc: Filler jammed
            io: filler.jammed
            alarms:
              - { kind: state, limit: 1, delay: 30s, rationale: machine-jam, suppress: LINE.XS01.RUN }
          - id: LSL01.PV
            desc: Filler bowl low (product supply)
            io: filler.low_bowl
            alarms:
              - { kind: state, limit: 1, delay: 1m, rationale: filler-bowl-low, suppress: LINE.XS01.RUN }
          - { id: XV01.CMD, desc: Filler product valve (from BBT-202), io: filler.product_valve }
          - { id: PACKML.CMD, desc: Filler PackML command (CntrlCmd), io: filler.cmd, range: [0, 9] }
          - { id: PACKML.MODE_CMD, desc: Filler PackML mode command (UnitMode), io: filler.mode_cmd, range: [0, 3] }
          - { id: PACKML.SPEED_SP, desc: Filler speed setpoint (MachSpeed), io: filler.speed_sp_bpm, units: bottles/min, range: [0, 60] }

      - id: RINSER
        name: Rinser
        model: packml-machine
        devices:
          - { name: rinser, type: packml-machine }
        tags:
          - { id: PACKML.STATE, desc: Rinser PackML state (StateCurrent), io: rinser.state, range: [0, 17] }
          - { id: PACKML.MODE, desc: Rinser PackML mode (UnitModeCurrent), io: rinser.mode, range: [0, 3] }
          - { id: PACKML.SPEED, desc: Rinser current speed (CurMachSpeed), io: rinser.speed_bpm, units: bottles/min, range: [0, 60] }
          - { id: PACKML.PROCESSED, desc: Rinser ProdProcessedCount (wraps at 65535), io: rinser.processed, range: [0, 65535] }
          - { id: PACKML.DEFECTIVE, desc: Rinser ProdDefectiveCount (wraps at 65535), io: rinser.defective, range: [0, 65535] }
          - { id: PACKML.STOP_REASON, desc: Rinser stop reason (StopReason.ID), io: rinser.stop_reason, range: [0, 99] }
          - id: YA01.PV
            desc: Rinser jammed
            io: rinser.jammed
            alarms:
              - { kind: state, limit: 1, delay: 30s, rationale: machine-jam, suppress: LINE.XS01.RUN }
          - { id: PACKML.CMD, desc: Rinser PackML command (CntrlCmd), io: rinser.cmd, range: [0, 9] }
          - { id: PACKML.MODE_CMD, desc: Rinser PackML mode command (UnitMode), io: rinser.mode_cmd, range: [0, 3] }
          - { id: PACKML.SPEED_SP, desc: Rinser speed setpoint (MachSpeed), io: rinser.speed_sp_bpm, units: bottles/min, range: [0, 60] }

      - id: CODER
        name: Date coder
        model: packml-machine
        devices:
          - { name: coder, type: packml-machine }
        tags:
          - { id: PACKML.STATE, desc: Date coder PackML state (StateCurrent), io: coder.state, range: [0, 17] }
          - { id: PACKML.MODE, desc: Date coder PackML mode (UnitModeCurrent), io: coder.mode, range: [0, 3] }
          - { id: PACKML.SPEED, desc: Date coder current speed (CurMachSpeed), io: coder.speed_bpm, units: bottles/min, range: [0, 60] }
          - { id: PACKML.PROCESSED, desc: Date coder ProdProcessedCount (wraps at 65535), io: coder.processed, range: [0, 65535] }
          - { id: PACKML.DEFECTIVE, desc: Date coder ProdDefectiveCount (wraps at 65535), io: coder.defective, range: [0, 65535] }
          - { id: PACKML.STOP_REASON, desc: Date coder stop reason (StopReason.ID), io: coder.stop_reason, range: [0, 99] }
          - id: YA01.PV
            desc: Date coder jammed
            io: coder.jammed
            alarms:
              - { kind: state, limit: 1, delay: 30s, rationale: machine-jam, suppress: LINE.XS01.RUN }
          - { id: PACKML.CMD, desc: Date coder PackML command (CntrlCmd), io: coder.cmd, range: [0, 9] }
          - { id: PACKML.MODE_CMD, desc: Date coder PackML mode command (UnitMode), io: coder.mode_cmd, range: [0, 3] }
          - { id: PACKML.SPEED_SP, desc: Date coder speed setpoint (MachSpeed), io: coder.speed_sp_bpm, units: bottles/min, range: [0, 60] }

      - id: LABELER
        name: Labeler
        model: packml-machine
        devices:
          - { name: labeler, type: packml-machine }
        tags:
          - { id: PACKML.STATE, desc: Labeler PackML state (StateCurrent), io: labeler.state, range: [0, 17] }
          - { id: PACKML.MODE, desc: Labeler PackML mode (UnitModeCurrent), io: labeler.mode, range: [0, 3] }
          - { id: PACKML.SPEED, desc: Labeler current speed (CurMachSpeed), io: labeler.speed_bpm, units: bottles/min, range: [0, 60] }
          - { id: PACKML.PROCESSED, desc: Labeler ProdProcessedCount (wraps at 65535), io: labeler.processed, range: [0, 65535] }
          - { id: PACKML.DEFECTIVE, desc: Labeler ProdDefectiveCount (wraps at 65535), io: labeler.defective, range: [0, 65535] }
          - { id: PACKML.STOP_REASON, desc: Labeler stop reason (StopReason.ID), io: labeler.stop_reason, range: [0, 99] }
          - id: YA01.PV
            desc: Labeler jammed
            io: labeler.jammed
            alarms:
              - { kind: state, limit: 1, delay: 30s, rationale: machine-jam, suppress: LINE.XS01.RUN }
          - { id: PACKML.CMD, desc: Labeler PackML command (CntrlCmd), io: labeler.cmd, range: [0, 9] }
          - { id: PACKML.MODE_CMD, desc: Labeler PackML mode command (UnitMode), io: labeler.mode_cmd, range: [0, 3] }
          - { id: PACKML.SPEED_SP, desc: Labeler speed setpoint (MachSpeed), io: labeler.speed_sp_bpm, units: bottles/min, range: [0, 60] }

      - id: PACKER
        name: Case packer
        model: packml-machine
        devices:
          - { name: packer, type: packml-machine }
        tags:
          - { id: PACKML.STATE, desc: Case packer PackML state (StateCurrent), io: packer.state, range: [0, 17] }
          - { id: PACKML.MODE, desc: Case packer PackML mode (UnitModeCurrent), io: packer.mode, range: [0, 3] }
          - { id: PACKML.SPEED, desc: Case packer current speed (CurMachSpeed), io: packer.speed_bpm, units: bottles/min, range: [0, 60] }
          - { id: PACKML.PROCESSED, desc: Case packer ProdProcessedCount (wraps at 65535), io: packer.processed, range: [0, 65535] }
          - { id: PACKML.DEFECTIVE, desc: Case packer ProdDefectiveCount (wraps at 65535), io: packer.defective, range: [0, 65535] }
          - { id: PACKML.STOP_REASON, desc: Case packer stop reason (StopReason.ID), io: packer.stop_reason, range: [0, 99] }
          - id: YA01.PV
            desc: Case packer jammed
            io: packer.jammed
            alarms:
              - { kind: state, limit: 1, delay: 30s, rationale: machine-jam, suppress: LINE.XS01.RUN }
          - { id: PACKML.CMD, desc: Case packer PackML command (CntrlCmd), io: packer.cmd, range: [0, 9] }
          - { id: PACKML.MODE_CMD, desc: Case packer PackML mode command (UnitMode), io: packer.mode_cmd, range: [0, 3] }
          - { id: PACKML.SPEED_SP, desc: Case packer speed setpoint (MachSpeed), io: packer.speed_sp_bpm, units: bottles/min, range: [0, 60] }

      - id: KEG
        name: Keg washer/filler
        model: keg-machine
        devices:
          - { name: kegger, type: keg-machine }
        tags:
          - { id: PACKML.STATE, desc: Keg washer/filler PackML state (StateCurrent), io: kegger.state, range: [0, 17] }
          - { id: PACKML.MODE, desc: Keg washer/filler PackML mode (UnitModeCurrent), io: kegger.mode, range: [0, 3] }
          - { id: PACKML.PROCESSED, desc: Kegs filled (wraps at 65535), io: kegger.processed, range: [0, 65535] }
          - { id: PACKML.DEFECTIVE, desc: Kegs rejected (wraps at 65535), io: kegger.defective, range: [0, 65535] }
          - { id: PACKML.STOP_REASON, desc: Keg washer/filler stop reason, io: kegger.stop_reason, range: [0, 99] }
          - { id: TT01.PV, desc: Keg wash water temperature, io: kegger.wash_temp_f, units: degF, range: [32, 212] }
          - { id: YA01.PV, desc: Keg washer/filler jammed, io: kegger.jammed }
          - { id: HS01.CMD, desc: Keg wash heater command, io: kegger.heater }
          - { id: PACKML.CMD, desc: Keg washer/filler PackML command (CntrlCmd), io: kegger.cmd, range: [0, 9] }
          - { id: PACKML.MODE_CMD, desc: Keg washer/filler mode command, io: kegger.mode_cmd, range: [0, 3] }

      - id: CONV
        name: Conveyors (depalletizer sweep through the case packer)
        model: conveyors
        devices:
          - { name: conv1, type: conveyor, zone: depal-rinser }
          - { name: conv2, type: conveyor, zone: filler-coder }
          - { name: conv3, type: conveyor, zone: labeler-packer }
          - { name: conv4, type: conveyor, zone: packer-pallet }
        tags:
          - { id: LS01.PV, desc: Conveyor 1 (depalletizer to rinser) accumulation eye, io: conv1.accum_eye }
          - { id: YA01.PV, desc: Conveyor 1 jam eye, io: conv1.jam_eye }
          - { id: HS01.CMD, desc: Conveyor 1 run command, io: conv1.run }
          - { id: LS02.PV, desc: Conveyor 2 (filler to coder) accumulation eye, io: conv2.accum_eye }
          - { id: YA02.PV, desc: Conveyor 2 jam eye, io: conv2.jam_eye }
          - { id: HS02.CMD, desc: Conveyor 2 run command, io: conv2.run }
          - { id: LS03.PV, desc: Conveyor 3 (labeler to packer) accumulation eye, io: conv3.accum_eye }
          - { id: YA03.PV, desc: Conveyor 3 jam eye, io: conv3.jam_eye }
          - { id: HS03.CMD, desc: Conveyor 3 run command, io: conv3.run }
          - { id: LS04.PV, desc: Conveyor 4 (packer to palletizing) accumulation eye, io: conv4.accum_eye }
          - { id: YA04.PV, desc: Conveyor 4 jam eye, io: conv4.jam_eye }
          - { id: HS04.CMD, desc: Conveyor 4 run command, io: conv4.run }

      # Last in the area, so the panel's register follows the machines' and
      # none of theirs moved when it was added.
      - id: PANEL
        name: Line operator panel at the filler
        model: line-panel
        devices:
          - { name: linepanel, type: line-panel }
        tags:
          - { id: HS01.PV, desc: "Line command at the operator panel (CntrlCmd while a button is pressed, else 0)", io: linepanel.cmd, range: [0, 9] }

  - id: UTL
    name: Utilities
    plc: plc-utilities
    rio: rio-utilities
    federate: utilities
    units:
      - id: CHL
        name: Glycol chiller (OEM controller)
        model: chiller
        rio: glycol-chiller
        devices:
          - { name: chiller, type: chiller }
        tags:
          - id: TT01.PV
            desc: Glycol supply temperature
            io: chiller.supply_f
            units: degF
            range: [0, 100]
            alarms:
              - { kind: high, limit: 34.0, delay: 5m, rationale: glycol-supply-high }
          - { id: TT02.PV, desc: Glycol return temperature, io: chiller.return_f, units: degF, range: [0, 100] }
          - { id: JT01.PV, desc: Chiller electrical input, io: chiller.power_kw, units: kW, range: [0, 100] }
          - { id: YS01.PV, desc: Compressor stage 1 running, io: chiller.stage1_on }
          - { id: YS02.PV, desc: Compressor stage 2 running, io: chiller.stage2_on }
          - id: YA01.PV
            desc: Chiller compressor fault
            io: chiller.fault
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: chiller-fault }
          - { id: HS01.CMD, desc: Chiller enable, io: chiller.enable }
          - { id: TIC01.SP, desc: Chiller supply setpoint (written to the OEM controller), io: chiller.supply_sp_f, units: degF, range: [0, 100] }
          - id: AT01.PV
            desc: "Refrigerant detector at the chiller (R-410A, 45 lb charge; ASHRAE 15)"
            io: chiller.refrig_ppm
            units: ppm
            range: [0, 10000]
            alarms:
              - { kind: high, limit: 1000.0, delay: 30s, rationale: refrigerant-leak }
          - { id: TT01.SP, desc: Glycol supply setpoint (operator), type: analog-read-write, units: degF, range: [0, 100], scaling: 1 }

      - id: GLY
        name: Glycol reservoir and supply pumps
        model: glycol-loop
        devices:
          - { name: glycol, type: glycol-loop }
        tags:
          - id: LT01.PV
            desc: Glycol reservoir level
            io: glycol.reservoir_pct
            units: "%"
            range: [0, 100]
            alarms:
              - { kind: low, limit: 40.0, delay: 5m, rationale: glycol-reservoir-low }
          - { id: PT01.PV, desc: Glycol supply pressure, io: glycol.pump_psig, units: psig, range: [0, 100] }
          - { id: YS01.PV, desc: Glycol pump running, io: glycol.pump_running }
          - { id: HS01.CMD, desc: Glycol pump run command, io: glycol.pump_run }
          - { id: SC01.OUT, desc: Glycol pump VFD speed reference (pressure control), io: glycol.pump_speed_pct, units: "%", range: [0, 100] }
          - { id: PT01.SP, desc: Glycol supply pressure setpoint, type: analog-read-write, units: psig, range: [0, 100], scaling: 1 }

      - id: STM
        name: "Electric steam boiler (200 kW, ASME Section IV low-pressure steam, 15 psig MAWP, safety valve set at 15 psig, operated at 12 psig; 7 CCR 1101-5)"
        model: boiler
        devices:
          - { name: boiler, type: boiler }
        tags:
          - id: PT01.PV
            desc: Steam header pressure
            io: boiler.pressure_psig
            units: psig
            range: [0, 30]
            alarms:
              - { kind: low, limit: 10.0, delay: 5m, rationale: steam-pressure-low, suppress: HS01.CMD }
          - { id: JT01.PV, desc: Boiler electrical input, io: boiler.power_kw, units: kW, range: [0, 250] }
          - { id: YS01.PV, desc: Boiler firing, io: boiler.running }
          - id: LSL01.PV
            desc: Boiler low-water cutoff tripped (hardwired)
            io: boiler.low_water
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: boiler-low-water }
          - { id: HS01.CMD, desc: Boiler enable, io: boiler.enable }
          - { id: PC01.SP, desc: "Boiler pressure setpoint (12 psig; below the 15 psig safety valve)", io: boiler.pressure_sp_psig, units: psig, range: [0, 30] }

      - id: AIR
        name: Air compressor and dryer
        model: air-compressor
        devices:
          - { name: aircomp, type: air-compressor }
        tags:
          - id: PT01.PV
            desc: Compressed-air header pressure
            io: aircomp.header_psig
            units: psig
            range: [0, 150]
            alarms:
              - { kind: low, limit: 80.0, delay: 1m, rationale: air-pressure-low, suppress: HS01.CMD }
          - { id: YS01.PV, desc: Air compressor running, io: aircomp.running }
          - { id: YA01.PV, desc: Air dryer fault, io: aircomp.dryer_fault }
          - { id: HS01.CMD, desc: Air compressor enable, io: aircomp.enable }

      - id: CO2
        name: Bulk CO2 tank and vaporizer
        model: co2-supply
        devices:
          - { name: co2, type: co2-supply }
          - { name: co2relay, type: gas-relay }
        tags:
          - { id: PT01.PV, desc: Bulk CO2 tank pressure, io: co2.tank_psig, units: psig, range: [0, 400] }
          - id: LT01.PV
            desc: Bulk CO2 tank level
            io: co2.tank_level_pct
            units: "%"
            range: [0, 100]
            alarms:
              - { kind: low, limit: 20.0, delay: 10m, rationale: co2-tank-low }
          - id: PT02.PV
            desc: CO2 supply header pressure
            io: co2.supply_psig
            units: psig
            range: [0, 150]
            alarms:
              - { kind: low, limit: 40.0, delay: 1m, rationale: co2-supply-low, suppress: XV01.CMD }
          - { id: XV01.CMD, desc: "CO2 main supply valve (fail closed; its solenoid is wired through the shutoff relay)", io: co2.main_valve }
          - { id: ZSO01.PV, desc: CO2 main supply valve open (limit switch), io: co2.valve_open }
          # The bas-vent CO2 supply shutoff relay, hardwired into rio-utilities
          # (DESIGN.md 6.7): energized (TRUE) while every area is below tier 3
          # and detection is powered and healthy. De-energize to trip.
          - { id: XS01.CO2_OK, desc: "CO2 shutoff relay healthy (every area below 30,000 ppm, detection powered)", io: co2relay.co2_ok }
          - id: XS02.SHUTOFF
            desc: "CO2 supply shut off (tier 3 or loss of detection; latched until reset)"
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: co2-supply-shutoff }
          - { id: XC01.RESET, desc: "CO2 supply shutoff reset (operator; accepted once the relay has been healthy for 60 s)", type: binary-read-write }

      - id: RO
        name: RO skid and carbon filter
        model: ro-skid
        devices:
          - { name: ro, type: ro-skid }
        tags:
          - { id: FT01.PV, desc: RO permeate flow, io: ro.permeate_gpm, units: gal/min, range: [0, 50] }
          - id: AT01.PV
            desc: RO permeate conductivity
            io: ro.conductivity_us
            units: uS/cm
            range: [0, 1000]
            alarms:
              - { kind: high, limit: 50.0, delay: 10m, rationale: ro-conductivity-high, suppress: YS01.PV }
          - { id: YS01.PV, desc: RO skid running, io: ro.running }
          - { id: HS01.CMD, desc: RO skid run command, io: ro.run }

      - id: WWN
        name: Wastewater neutralization
        model: wastewater
        devices:
          - { name: wwn, type: wastewater }
        tags:
          - id: LT01.PV
            desc: Neutralization tank level
            io: wwn.level_pct
            units: "%"
            range: [0, 100]
            alarms:
              - { kind: high, limit: 85.0, delay: 1m, rationale: wastewater-level-high }
          - id: AT01.PV
            desc: Neutralization tank pH
            io: wwn.ph
            units: pH
            range: [0, 14]
            alarms:
              - { kind: high, limit: 9.0, delay: 15m, rationale: wastewater-ph }
              - { kind: low, limit: 6.0, delay: 15m, rationale: wastewater-ph }
          - { id: LSH01.PV, desc: Neutralization tank high-level switch, io: wwn.high_level }
          - { id: XV01.CMD, desc: Caustic dosing pump, io: wwn.caustic_pump }
          - { id: XV02.CMD, desc: Acid dosing pump, io: wwn.acid_pump }
          - { id: XV03.CMD, desc: Discharge valve to the sewer (permitted at pH 6.0-9.0), io: wwn.discharge_valve }
          - id: XS01.INHIBIT
            desc: Discharge inhibited (pH outside 6.0-9.0)
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 5m, rationale: discharge-inhibited }

      - id: CIP
        name: CIP skid
        model: cip-skid
        devices:
          - { name: cip, type: cip-skid }
          - { name: cippanel, type: cip-panel }
        tags:
          - id: TT01.PV
            desc: CIP supply temperature
            io: cip.supply_f
            units: degF
            range: [32, 212]
            alarms:
              - { kind: deviation, setpoint: TT01.SP, limit: 5.0, delay: 5m, rationale: cip-temp-deviation, suppress: HS01.CMD }
          - { id: AT01.PV, desc: CIP return conductivity, io: cip.return_cond_ms, units: mS/cm, range: [0, 200] }
          - { id: FT01.PV, desc: CIP return flow, io: cip.return_gpm, units: gal/min, range: [0, 100] }
          - { id: LT01.PV, desc: Caustic tank level, io: cip.caustic_level_pct, units: "%", range: [0, 100] }
          - { id: LT02.PV, desc: Acid/sanitizer tank level, io: cip.acid_level_pct, units: "%", range: [0, 100] }
          - { id: FS01.PV, desc: CIP return flow proven (flow switch), io: cip.return_flow }
          - { id: HS01.CMD, desc: CIP supply pump run command, io: cip.supply_pump }
          - { id: HS02.CMD, desc: CIP return pump run command, io: cip.return_pump }
          - { id: XV01.CMD, desc: Caustic dosing, io: cip.caustic_dose }
          - { id: XV02.CMD, desc: Acid/sanitizer dosing, io: cip.acid_dose }
          - { id: TV01.OUT, desc: CIP heater steam valve position, io: cip.steam_valve_pct, units: "%", range: [0, 100] }
          - { id: ZS01.PV, desc: Swing panel on the brewhouse circuit, io: cippanel.route_bh }
          - { id: ZS02.PV, desc: Swing panel on FV-101, io: cippanel.route_fv101 }
          - { id: ZS03.PV, desc: Swing panel on FV-102, io: cippanel.route_fv102 }
          - { id: ZS04.PV, desc: Swing panel on FV-103, io: cippanel.route_fv103 }
          - { id: ZS05.PV, desc: Swing panel on FV-104, io: cippanel.route_fv104 }
          - { id: ZS06.PV, desc: Swing panel on BBT-201, io: cippanel.route_bbt201 }
          - { id: ZS07.PV, desc: Swing panel on BBT-202, io: cippanel.route_bbt202 }
          - { id: TT01.SP, desc: CIP supply temperature setpoint, type: analog-read-write, units: degF, range: [32, 212], scaling: 1 }
          # Circuits: 1 brewhouse, 2-5 FV-101..104, 6-7 BBT-201/202, 8 transfer
          # lines. Steps: 0 idle, 1 pre-rinse, 2 caustic, 3 rinse, 4 acid,
          # 5 rinse, 6 sanitize, 7 done.
          - { id: XC01.CIRCUIT, desc: CIP circuit selected, type: analog-read-write, range: [0, 8], scaling: 0 }
          - { id: XC01.CMD, desc: "CIP sequence command (1 start, 2 hold, 3 abort)", type: analog-read-write, range: [0, 3], scaling: 0 }
          - { id: XS01.STEP, desc: CIP sequence step, type: analog-read, range: [0, 7], scaling: 0 }
          - { id: XS02.ROUTE_OK, desc: CIP route verified and return flow proven, type: binary-read }
          # Peer reads of plc-cellar's coils (DESIGN.md 6.6 #4), FC1 over CTRL into %IX120.0 up;
          # a lost peer reads 0, so the CIP permit fails safe.
          - { id: XS03.PV, desc: Cellar transfer in progress (peer read from plc-cellar), peer: CEL.XFER.XS01.ACTIVE }
          - { id: XS04.PV, desc: Cellar circuits permit CIP (peer read from plc-cellar), peer: CEL.XFER.XS02.CIP_PERMIT }
          # Per vessel: not locked out for confined-space entry (DESIGN.md 6.3).
          # A lost peer reads 0, so CIP into that vessel fails safe.
          - { id: XS05.PV, desc: FV-101 not in entry (peer read from plc-cellar), peer: CEL.ENTRY.XS11.CIP_OK }
          - { id: XS06.PV, desc: FV-102 not in entry (peer read from plc-cellar), peer: CEL.ENTRY.XS12.CIP_OK }
          - { id: XS07.PV, desc: FV-103 not in entry (peer read from plc-cellar), peer: CEL.ENTRY.XS13.CIP_OK }
          - { id: XS08.PV, desc: FV-104 not in entry (peer read from plc-cellar), peer: CEL.ENTRY.XS14.CIP_OK }
          - { id: XS09.PV, desc: BBT-201 not in entry (peer read from plc-cellar), peer: CEL.ENTRY.XS15.CIP_OK }
          - { id: XS10.PV, desc: BBT-202 not in entry (peer read from plc-cellar), peer: CEL.ENTRY.XS16.CIP_OK }

  - id: PWR
    name: Electrical
    plc: plc-power
    federate: power
    units:
      - id: MAIN
        name: 52-M main breaker relay and meter, MSB feeders
        model: relay
        rio: relay-main
        devices:
          - { name: relay-main, type: relay-meter }
          - { name: msb, type: msb-feeders }
        tags:
          - id: JT01.PV
            desc: Service real power (import positive)
            io: relay-main.p_kw
            units: kW
            range: [-500, 1000]
            alarms:
              - { kind: high, limit: 250.0, delay: 5m, rationale: demand-high }
          - { id: JT02.PV, desc: Service reactive power, io: relay-main.q_kvar, units: kvar, range: [-500, 500] }
          - id: ET01.PV
            desc: Service voltage, line to line
            io: relay-main.v_ll
            units: V
            range: [0, 600]
            alarms:
              - { kind: low, limit: 456.0, delay: 1m, rationale: voltage-low, suppress: ZS01.PV }
          - { id: IT01.PV, desc: "Service current, phase A", io: relay-main.i_a, units: A, range: [0, 1200] }
          - { id: ST01.PV, desc: Service frequency, io: relay-main.freq_hz, units: Hz, range: [0, 70] }
          - { id: JQ01.PV, desc: 15-minute demand (meter), io: relay-main.demand_kw, units: kW, range: [0, 1000] }
          - { id: ZS01.PV, desc: 52-M main breaker closed, io: relay-main.breaker_closed }
          - id: YA01.PV
            desc: 52-M tripped on overcurrent
            io: relay-main.tripped
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: main-breaker-trip }
          - { id: HS01.CMD, desc: 52-M close command (0 opens), io: relay-main.close }
          - { id: ZS02.PV, desc: Boiler feeder closed, io: msb.boiler_closed }
          - { id: ZS03.PV, desc: Packaging feeder (PP-PKG) closed, io: msb.pkg_closed }
          - { id: ZS04.PV, desc: RTU-1 feeder closed, io: msb.rtu_closed }
          - { id: HS02.CMD, desc: Boiler feeder close command, io: msb.boiler_close }
          - { id: HS03.CMD, desc: Packaging feeder close command, io: msb.pkg_close }
          - { id: HS04.CMD, desc: RTU-1 feeder close command, io: msb.rtu_close }

      - id: PV
        name: Rooftop PV (100 kWac)
        model: pv
        rio: pv-inverter
