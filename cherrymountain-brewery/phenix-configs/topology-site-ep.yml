# cherrymountain-site-ep: the nodes of the site `ep` (Eastern Plains: production brewery).
# Generated by plantgen from plant/plant.yaml and plant/sites.yaml (site ep),
# with the nodes of topology-core.yml, topology-soc.yml, and
# topology-remote-access.yml as the source of each node. Do not edit.
#
# The firewall rulesets are not here. They are in scenario-site-ep.yml,
# which sync.py writes: the rules of the conduits whose two ends are hosts of
# this site, as netcheck computes them (tools/netcheck).
#
# An injected file that holds a name or an address of the plant is the site's
# own copy, under phenix-injects/fleet/ep/ (plantgen renders it, and sync.py
# puts it there).
#
# This file is not a finished site. It does not have these parts yet:
# - The edge's WAN side: its default route, NAT, and the VPN, which the WAN
#   generator writes (tools/wangen).
# - The conduits between sites, with their rules.
# - The accounts of the site's own jump host. The vendor's accounts are not
#   injected here: the vendor reaches the head office and no other site. The
#   company's own accounts are still to be designed.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-site-ep
spec:
  nodes:
  - commands:
    - exec sg vyattacfg -c /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
