      # Confined-space entry (29 CFR 1910.146, DESIGN.md 6.3). The entry
      # supervisor sets a vessel's permit bit (HSnn.ENTRY) from the HMI when the
      # permit is issued; plc-cellar then locks out the vessel's glycol, CO2,
      # and outlet valves, vents its head to atmosphere, withdraws its CIP
      # permit (XS1n.CIP_OK, read by plc-utilities), and raises XAnn when a
      # write sets a locked-out output. Vessels in PSV order; ci does not list it.
      - id: ENTRY
        name: Confined-space entry lockout (cellar vessels)
        model: entry
        tags:
          - { id: HS01.ENTRY, desc: "FV-101 entry permit issued (entry supervisor; locks the vessel out)", type: binary-read-write }
          - { id: HS02.ENTRY, desc: "FV-102 entry permit issued (entry supervisor; locks the vessel out)", type: binary-read-write }
          - { id: HS03.ENTRY, desc: "FV-103 entry permit issued (entry supervisor; locks the vessel out)", type: binary-read-write }
          - { id: HS04.ENTRY, desc: "FV-104 entry permit issued (entry supervisor; locks the vessel out)", type: binary-read-write }
          - { id: HS05.ENTRY, desc: "BBT-201 entry permit issued (entry supervisor; locks the vessel out)", type: binary-read-write }
          - { id: HS06.ENTRY, desc: "BBT-202 entry permit issued (entry supervisor; locks the vessel out)", type: binary-read-write }
          - { id: XS01.LOCKED, desc: "FV-101 locked out for entry (glycol, CO2, outlet, and CIP)", type: binary-read }
          - { id: XS02.LOCKED, desc: "FV-102 locked out for entry (glycol, CO2, outlet, and CIP)", type: binary-read }
          - { id: XS03.LOCKED, desc: "FV-103 locked out for entry (glycol, CO2, outlet, and CIP)", type: binary-read }
          - { id: XS04.LOCKED, desc: "FV-104 locked out for entry (glycol, CO2, outlet, and CIP)", type: binary-read }
          - { id: XS05.LOCKED, desc: "BBT-201 locked out for entry (glycol, CO2, outlet, and CIP)", type: binary-read }
          - { id: XS06.LOCKED, desc: "BBT-202 locked out for entry (glycol, CO2, outlet, and CIP)", type: binary-read }
          - { id: XS11.CIP_OK, desc: "FV-101 CIP permitted, not in entry (peer status for plc-utilities)", type: binary-read }
          - { id: XS12.CIP_OK, desc: "FV-102 CIP permitted, not in entry (peer status for plc-utilities)", type: binary-read }
          - { id: XS13.CIP_OK, desc: "FV-103 CIP permitted, not in entry (peer status for plc-utilities)", type: binary-read }
          - { id: XS14.CIP_OK, desc: "FV-104 CIP permitted, not in entry (peer status for plc-utilities)", type: binary-read }
          - { id: XS15.CIP_OK, desc: "BBT-201 CIP permitted, not in entry (peer status for plc-utilities)", type: binary-read }
          - { id: XS16.CIP_OK, desc: "BBT-202 CIP permitted, not in entry (peer status for plc-utilities)", type: binary-read }
          - id: XA01.PV
            desc: FV-101 write to a locked-out valve during entry
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: vessel-entry-violation }
          - id: XA02.PV
            desc: FV-102 write to a locked-out valve during entry
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: vessel-entry-violation }
          - id: XA03.PV
            desc: FV-103 write to a locked-out valve during entry
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: vessel-entry-violation }
          - id: XA04.PV
            desc: FV-104 write to a locked-out valve during entry
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: vessel-entry-violation }
          - id: XA05.PV
            desc: BBT-201 write to a locked-out valve during entry
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: vessel-entry-violation }
          - id: XA06.PV
            desc: BBT-202 write to a locked-out valve during entry
            type: binary-read
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: vessel-entry-violation }

      # The fermentation profile plc-cellar runs for each fermenter (DESIGN.md
      # §6.3): 66 degF while the beer ferments, a diacetyl rest at 70 degF from
      # 5 degP for KC01 minutes, then a crash to 34 degF. HSnn.AUTO puts a
      # fermenter on it; with it off the setpoints are the operator's. The four
      # recipe values are the operator's too. Last in the area, so no register of
      # the other units moved when it was added; ci does not list it.
      - id: PROFILE
        name: Fermentation profile (plc-cellar)
        model: ferment-profile
        tags:
          - { id: HS01.AUTO, desc: "FV-101 fermentation profile on (plc-cellar sets its temperature setpoints)", type: binary-read-write }
          - { id: HS02.AUTO, desc: "FV-102 fermentation profile on (plc-cellar sets its temperature setpoints)", type: binary-read-write }
          - { id: HS03.AUTO, desc: "FV-103 fermentation profile on (plc-cellar sets its temperature setpoints)", type: binary-read-write }
          - { id: HS04.AUTO, desc: "FV-104 fermentation profile on (plc-cellar sets its temperature setpoints)", type: binary-read-write }
          - { id: KS01.STAGE, desc: "FV-101 profile stage (0 empty, 1 fermenting, 2 diacetyl rest, 3 crash)", type: analog-read, range: [0, 3], scaling: 0 }
          - { id: KS02.STAGE, desc: "FV-102 profile stage (0 empty, 1 fermenting, 2 diacetyl rest, 3 crash)", type: analog-read, range: [0, 3], scaling: 0 }
          - { id: KS03.STAGE, desc: "FV-103 profile stage (0 empty, 1 fermenting, 2 diacetyl rest, 3 crash)", type: analog-read, range: [0, 3], scaling: 0 }
          - { id: KS04.STAGE, desc: "FV-104 profile stage (0 empty, 1 fermenting, 2 diacetyl rest, 3 crash)", type: analog-read, range: [0, 3], scaling: 0 }
          - { id: TC01.SP, desc: Profile temperature while the beer ferments, type: analog-read-write, units: degF, range: [20, 90], scaling: 2 }
          - { id: TC02.SP, desc: Profile temperature of the diacetyl rest, type: analog-read-write, units: degF, range: [20, 90], scaling: 2 }
          - { id: TC03.SP, desc: Profile temperature of the crash, type: analog-read-write, units: degF, range: [20, 90], scaling: 2 }
          - { id: KC01.SP, desc: "Diacetyl rest length in plant minutes (180 is 144 h of fermentation on the range's 48x clock)", type: analog-read-write, units: min, range: [0, 6000], scaling: 0 }

  - id: PKG
    name: Packaging
    plc: plc-packaging
    rio: rio-packaging
    federate: packaging
    units:
