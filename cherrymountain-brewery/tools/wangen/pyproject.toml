[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cherrymountain-wangen"
version = "0.1.0"
description = "Generate the CherryMountain Brewery WAN (the mock internet and the site-to-site VPN) from wan/wan.yaml"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wangen = "wangen.cli:main"

[tool.setuptools]
packages = ["wangen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
