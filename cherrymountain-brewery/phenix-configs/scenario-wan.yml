  - name: soh
    metadata:
      startupDelay: 5m
      c2Timeout: 15m
      testReachability: 'off'
      skipHosts:
      - cb-west
      - cb-south
      - shadecast
      - tumbleweed
      - marmot
      - bristlecone
      - fr-fw-edge
      - fc-fw-edge
      - ep-fw-edge
      - cs-fw-edge
      hostCustomTests:
        fr-historian:
        - name: vpn-to-fc-historian
          executor: bash
          testScript: "if ping -c 3 -W 2 10.21.10.11 >/dev/null 2>&1; then\n  echo REACHED\nelse\n  echo UNREACHED\nfi\n"
          testStdout: REACHED
        - name: vpn-to-ep-historian
          executor: bash
          testScript: "if ping -c 3 -W 2 10.22.30.11 >/dev/null 2>&1; then\n  echo REACHED\nelse\n  echo UNREACHED\nfi\n"
          testStdout: REACHED
        - name: vpn-to-cs-historian
          executor: bash
          testScript: "if ping -c 3 -W 2 192.168.20.11 >/dev/null 2>&1; then\n  echo REACHED\nelse\n  echo UNREACHED\nfi\n"
          testStdout: REACHED
        - name: internet-to-inet
          executor: bash
          testScript: "if ping -c 3 -W 2 198.18.110.11 >/dev/null 2>&1; then\n  echo REACHED\nelse\n  echo UNREACHED\nfi\n"
          testStdout: REACHED
        fc-historian:
