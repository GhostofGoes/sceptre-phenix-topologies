# rsyslog on dmz-jump: Docker's syslog log driver sends the containers' output to
# /dev/log with the container name as the program name. Keep the Guacamole
# stack's lines out of /var/log/syslog and in one file that the Wazuh agent of the
# dmz group reads (cm-guacamole decoder, DESIGN.md 14).
if ($programname == 'guacamole' or $programname == 'guacd' or $programname == 'guac-proxy' or $programname == 'postgres') then {
  action(type="omfile" file="/var/log/cm-guacamole/containers.log" dirCreateMode="0755" fileCreateMode="0640" createDirs="on")
  stop
}
