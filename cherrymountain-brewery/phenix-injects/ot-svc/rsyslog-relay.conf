# ot-svc: receive syslog from the routed OT zones on UDP 514 and relay all of
# it, including its own messages, to Wazuh in the SOC (DESIGN.md 10.3). The
# forward is UDP, which reports no failure: what is relayed before Wazuh listens
# is lost, not delivered late (the lite variant has no Wazuh at all). The queue
# only holds messages while ot-svc itself has no route yet, early in its boot.
module(load="imudp")
input(type="imudp" port="514")

action(
  type="omfwd"
  target="10.40.10.11"
  port="514"
  protocol="udp"
  queue.type="LinkedList"
  queue.size="5000"
  action.resumeRetryCount="-1"
)
