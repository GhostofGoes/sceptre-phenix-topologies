# cherrymountain-core: the 37 core nodes of the CherryMountain Brewery topology
# (DESIGN.md 10.2, 11, and 15.3): the four VyOS routers and firewalls, the
# services (ot-svc, inet-nuke, bas-bbmd), the simulation plane, field devices,
# PLCs, SCADA and BAS servers, HMIs, the corporate workstation, and the utility
# DERMS. Addresses, VLANs, routes, resources, zone labels, autotunnel entries,
# and boot order come from DESIGN.md; tools/netcheck checks this file against
# them and against the conduit matrix.
#
# Node order is boot order: routers first, then ot-svc, sim-ctl, the federates,
# field devices (delay on sim-ctl), PLCs (delay on their I/O devices), FUXA
# (delay on the PLCs), and the HMIs (delay on scada-fuxa). Router interfaces
# are named eth0, eth1, ... like the VyOS NICs, because the vrouter app writes
# netem policies with the interface name; hosts use IF0, IF1, ... and mgmt.
# The plant-specific injections (OpenPLC, FUXA, HELICS, ot-sim) are added by
# the cherrymountain app. Inject paths use /phenix/injects/${BRANCH_NAME}/.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-core
spec:
  nodes:
  - commands:
    - exec sg vyattacfg -c /config/scripts/custom/cm-vyos-config.sh
    general:
      description: ShadeCast Cable edge router (the internet); netem on the WAN legs
      hostname: isp-rtr
    hardware:
      drives:
      - image: vyos.qc2
        inject_partition: 3
      memory: 2048
      os_type: vyos
      vcpus: 1
    injections:
    - description: VyOS logging, Wazuh syslog, IKEv2, and NTP settings the vrouter app cannot render
      dst: /boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/vrouter/cm-vyos-config.sh
    labels:
      zone: inet
    network:
      interfaces:
      - address: 203.0.113.1
        mask: 24
        name: eth0
        proto: static
        type: ethernet
        vlan: INET
      - address: 198.51.100.1
        mask: 24
        name: eth1
        proto: static
        type: ethernet
        vlan: VENDOR
    type: Router
  - commands:
    - exec sg vyattacfg -c /config/scripts/custom/cm-vyos-config.sh
    general:
      description: Summit Valley Power router, IPsec peer of fw-edge
