<!--
  Spike fragment appended to ossec.conf on the Wazuh manager (spikes/thehive/README.md).
  The integration sends CherryMountain alerts of level 7 and up to the case tool; the
  localfile is only for the Docker proof (run_poc.sh writes sample lines into it).
  @HOOK_URL@, @API_KEY@, and @BACKEND@ are replaced by run_poc.sh. In the range the
  cherrymountain app would render them, with the key from secrets.json.
-->
<ossec_config>
  <integration>
    <name>custom-cm-case</name>
    <hook_url>@HOOK_URL@</hook_url>
    <api_key>@API_KEY@</api_key>
    <level>7</level>
    <group>cherrymountain</group>
    <alert_format>json</alert_format>
    <options>{"backend": "@BACKEND@", "customer_id": 1}</options>
  </integration>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cm-poc.log</location>
  </localfile>
</ossec_config>
