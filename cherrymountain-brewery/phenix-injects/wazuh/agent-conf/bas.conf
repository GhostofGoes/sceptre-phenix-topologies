<!--
  Shared agent settings for the BAS group (bas-fuxa), DESIGN.md 14. The
  cherrymountain app enrolls each agent into the group named like its node's zone
  label, and the manager copies this file to /var/ossec/etc/shared/bas/agent.conf.
-->
<!-- Every agent of the group: who signed in and who used sudo (sshd, PAM), which
     Wazuh's own rules read. The packaged agent configuration collects neither this
     file nor the journal. -->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>
