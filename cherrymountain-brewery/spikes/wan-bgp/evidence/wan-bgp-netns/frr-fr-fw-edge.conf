frr defaults traditional
hostname fr-fw-edge
log file /var/run/frr/fr-fw-edge/frr.log
ip forwarding
!
ip prefix-list OWN seq 5 permit 198.18.105.0/24
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list SITE-FR seq 5 permit 10.10.0.0/16 le 24
ip prefix-list SITE-NETS seq 5 permit 10.10.0.0/16 le 24
ip prefix-list SITE-FR seq 10 permit 10.20.0.0/16 le 24
ip prefix-list SITE-NETS seq 10 permit 10.20.0.0/16 le 24
ip prefix-list SITE-FR seq 15 permit 10.30.0.0/16 le 24
ip prefix-list SITE-NETS seq 15 permit 10.30.0.0/16 le 24
ip prefix-list SITE-FR seq 20 permit 10.40.0.0/16 le 24
ip prefix-list SITE-NETS seq 20 permit 10.40.0.0/16 le 24
ip prefix-list SITE-FC seq 5 permit 10.11.0.0/16 le 24
ip prefix-list SITE-NETS seq 25 permit 10.11.0.0/16 le 24
ip prefix-list SITE-FC seq 10 permit 10.21.0.0/16 le 24
ip prefix-list SITE-NETS seq 30 permit 10.21.0.0/16 le 24
ip prefix-list SITE-EP seq 5 permit 10.12.0.0/16 le 24
ip prefix-list SITE-NETS seq 35 permit 10.12.0.0/16 le 24
ip prefix-list SITE-EP seq 10 permit 10.22.0.0/16 le 24
ip prefix-list SITE-NETS seq 40 permit 10.22.0.0/16 le 24
ip prefix-list SITE-EP seq 15 permit 10.32.0.0/16 le 24
ip prefix-list SITE-NETS seq 45 permit 10.32.0.0/16 le 24
ip prefix-list SITE-EP seq 20 permit 10.42.0.0/16 le 24
ip prefix-list SITE-NETS seq 50 permit 10.42.0.0/16 le 24
ip prefix-list SITE-CS seq 5 permit 192.168.10.0/24
ip prefix-list SITE-NETS seq 55 permit 192.168.10.0/24
ip prefix-list SITE-CS seq 10 permit 192.168.20.0/24
ip prefix-list SITE-NETS seq 60 permit 192.168.20.0/24
ip prefix-list SITE-CS seq 15 permit 192.168.30.0/24
ip prefix-list SITE-NETS seq 65 permit 192.168.30.0/24
ip prefix-list PUBLIC seq 1 deny 10.0.0.0/8 le 32
ip prefix-list PUBLIC seq 2 deny 172.16.0.0/12 le 32
ip prefix-list PUBLIC seq 3 deny 192.168.0.0/16 le 32
ip prefix-list PUBLIC seq 10 deny 0.0.0.0/0
ip prefix-list PUBLIC seq 15 permit 0.0.0.0/0 le 24
bgp community-list standard FROM-CUSTOMERS permit 64505:1
!
route-map FROM-CUSTOMER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 200
 set community 64505:1
!
route-map FROM-PEER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 150
 set community 64505:2
!
route-map FROM-PROVIDER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 100
 set community 64505:3
!
route-map TO-UPSTREAM permit 10
 match community FROM-CUSTOMERS
route-map TO-UPSTREAM permit 20
 match ip address prefix-list OWN
!
route-map TO-CUSTOMER permit 10
!
route-map DEFAULT-ONLY permit 10
 match ip address prefix-list DEFAULT
!
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
!
route-map OVERLAY-PRIMARY permit 10
 match ip address prefix-list SITE-NETS
 set local-preference 200
!
route-map OVERLAY-BACKUP permit 10
 match ip address prefix-list SITE-NETS
 set local-preference 100
!
route-map OVERLAY-PRIMARY-FC permit 10
 match ip address prefix-list SITE-FC
 set local-preference 200
!
route-map OVERLAY-BACKUP-FC permit 10
 match ip address prefix-list SITE-FC
 set local-preference 100
!
route-map OVERLAY-PRIMARY-EP permit 10
 match ip address prefix-list SITE-EP
 set local-preference 200
!
route-map OVERLAY-BACKUP-EP permit 10
 match ip address prefix-list SITE-EP
 set local-preference 100
!
route-map OVERLAY-PRIMARY-CS permit 10
 match ip address prefix-list SITE-CS
 set local-preference 200
!
route-map OVERLAY-BACKUP-CS permit 10
 match ip address prefix-list SITE-CS
 set local-preference 100
!
route-map OVERLAY-OUT permit 10
 match ip address prefix-list SITE-NETS
!
route-map SET-SOURCE permit 10
 match ip address prefix-list DEFAULT
 set src 198.18.105.1
route-map SET-SOURCE permit 20
!
ip protocol bgp route-map SET-SOURCE
!
ip route 198.18.105.0/24 blackhole 250
ip route 10.10.0.0/16 blackhole 250
ip route 10.20.0.0/16 blackhole 250
ip route 10.30.0.0/16 blackhole 250
ip route 10.40.0.0/16 blackhole 250
ip route 10.0.0.0/8 blackhole 254
ip route 172.16.0.0/12 blackhole 254
ip route 192.168.0.0/16 blackhole 254
!
router bgp 64505
 bgp router-id 198.18.105.1
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 neighbor 203.0.113.1 remote-as 64500
 neighbor 203.0.113.1 description shadecast
 neighbor 203.0.113.1 timers 3 9
 neighbor 203.0.113.1 timers connect 5
 neighbor 203.0.113.1 bfd
 neighbor 198.18.101.1 remote-as 64501
 neighbor 198.18.101.1 description tumbleweed
 neighbor 198.18.101.1 timers 3 9
 neighbor 198.18.101.1 timers connect 5
 neighbor 198.18.101.1 bfd
 neighbor 10.255.0.1 remote-as 65020
 neighbor 10.255.0.1 description overlay-fc-a
 neighbor 10.255.0.1 timers 3 9
 neighbor 10.255.0.1 timers connect 5
 neighbor 10.255.0.1 bfd
 neighbor 10.255.0.3 remote-as 65020
 neighbor 10.255.0.3 description overlay-fc-b
 neighbor 10.255.0.3 timers 3 9
 neighbor 10.255.0.3 timers connect 5
 neighbor 10.255.0.3 bfd
 neighbor 10.255.0.5 remote-as 65030
 neighbor 10.255.0.5 description overlay-ep-a
 neighbor 10.255.0.5 timers 3 9
 neighbor 10.255.0.5 timers connect 5
 neighbor 10.255.0.5 bfd
 neighbor 10.255.0.7 remote-as 65030
 neighbor 10.255.0.7 description overlay-ep-b
 neighbor 10.255.0.7 timers 3 9
 neighbor 10.255.0.7 timers connect 5
 neighbor 10.255.0.7 bfd
 neighbor 10.255.0.9 remote-as 65040
 neighbor 10.255.0.9 description overlay-cs-a
 neighbor 10.255.0.9 timers 3 9
 neighbor 10.255.0.9 timers connect 5
 neighbor 10.255.0.9 bfd
 address-family ipv4 unicast
  network 198.18.105.0/24
  network 10.20.30.0/24
  maximum-paths 2
  neighbor 203.0.113.1 activate
  neighbor 198.18.101.1 activate
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.9 activate
  neighbor 203.0.113.1 route-map DEFAULT-ONLY in
  neighbor 203.0.113.1 route-map OWN-ONLY out
  neighbor 203.0.113.1 soft-reconfiguration inbound
  neighbor 198.18.101.1 route-map DEFAULT-ONLY in
  neighbor 198.18.101.1 route-map OWN-ONLY out
  neighbor 198.18.101.1 soft-reconfiguration inbound
  neighbor 10.255.0.1 route-map OVERLAY-PRIMARY-FC in
  neighbor 10.255.0.1 route-map OVERLAY-OUT out
  neighbor 10.255.0.3 route-map OVERLAY-BACKUP-FC in
  neighbor 10.255.0.3 route-map OVERLAY-OUT out
  neighbor 10.255.0.5 route-map OVERLAY-PRIMARY-EP in
  neighbor 10.255.0.5 route-map OVERLAY-OUT out
  neighbor 10.255.0.7 route-map OVERLAY-BACKUP-EP in
  neighbor 10.255.0.7 route-map OVERLAY-OUT out
  neighbor 10.255.0.9 route-map OVERLAY-PRIMARY-CS in
  neighbor 10.255.0.9 route-map OVERLAY-OUT out
 exit-address-family
!
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
 peer 203.0.113.1
  profile fast
 !
 peer 198.18.101.1
  profile fast
 !
 peer 10.255.0.1
  profile fast
 !
 peer 10.255.0.3
  profile fast
 !
 peer 10.255.0.5
  profile fast
 !
 peer 10.255.0.7
  profile fast
 !
 peer 10.255.0.9
  profile fast
 !
!
end
