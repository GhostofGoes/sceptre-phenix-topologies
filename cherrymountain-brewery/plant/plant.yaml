          - { name: pv-inverter, type: pv-inverter }
        tags:
          - { id: JT01.PV, desc: PV inverter output, io: pv-inverter.p_kw, units: kW, range: [0, 150] }
          - { id: JY01.PV, desc: PV active power limit in effect (min of site and utility), io: pv-inverter.limit_pct, units: "%", range: [0, 100] }
          - { id: ZS01.PV, desc: PV inverter connected (IEEE 1547), io: pv-inverter.connected }
          - { id: HS01.CMD, desc: PV inverter enable, io: pv-inverter.enable }
          - { id: JC01.SP, desc: PV site limit (plc-power), io: pv-inverter.site_limit_pct, units: "%", range: [0, 100] }
          - { id: JC02.SP, desc: PV utility limit (DERMS through rtu-der; read only here), io: pv-inverter.utility_limit_pct, units: "%", range: [0, 100] }

      - id: BESS
        name: Battery storage (100 kW / 200 kWh)
        model: bess
        rio: bess-pcs
        devices:
          - { name: bess-pcs, type: bess-pcs }
        tags:
          - { id: JT01.PV, desc: BESS power (discharge positive), io: bess-pcs.p_kw, units: kW, range: [-150, 150] }
          - id: EY01.PV
            desc: BESS state of charge
            io: bess-pcs.soc_pct
            units: "%"
            range: [0, 100]
            alarms:
              - { kind: low, limit: 50.0, delay: 15m, rationale: bess-soc-low }
          - { id: ZS01.PV, desc: BESS connected (IEEE 1547), io: bess-pcs.connected }
          - id: YA01.PV
            desc: BESS PCS fault
            io: bess-pcs.fault
            alarms:
              - { kind: state, limit: 1, delay: 1m, rationale: bess-fault }
          - { id: HS01.CMD, desc: BESS enable, io: bess-pcs.enable }
          - { id: JC01.SP, desc: BESS power setpoint (plc-power dispatch), io: bess-pcs.p_sp_kw, units: kW, range: [-100, 100] }
          - { id: JC02.SP, desc: BESS utility dispatch (DERMS through rtu-der; read only here), io: bess-pcs.utility_p_sp_kw, units: kW, range: [-100, 100] }
          - id: TT01.PV
            desc: BESS hottest cell temperature (BMS)
            io: bess-pcs.cell_temp_f
