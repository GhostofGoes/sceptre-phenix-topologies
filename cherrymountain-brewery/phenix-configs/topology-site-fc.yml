# cherrymountain-site-fc: the nodes of the site `fc` (Fort Collins: brewpub).
# Generated by plantgen from plant/plant.yaml and plant/sites.yaml (site fc),
# with the nodes of topology-core.yml, topology-soc.yml, and
# topology-remote-access.yml as the source of each node. Do not edit.
#
# The firewall rulesets are not here. They are in scenario-site-fc.yml,
# which netcheck writes (tools/netcheck): the rules of the conduits whose two
# ends are hosts of this site.
#
# This file is not a finished site. It does not have these parts yet:
# - The edge's WAN side: its default route, NAT, and the VPN, which the WAN
#   generator writes (tools/wangen).
# - The conduits between sites, with their rules, and a whole scenario. The
#   injected files still hold the names and addresses of the single site.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-site-fc
spec:
  nodes:
  - commands:
    - exec sg vyattacfg -c /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
    general:
      description: 'IT/Internet firewall: NAT, WireGuard DNAT, IPsec to util-rtr'
      hostname: fc-fw-edge
    hardware:
      drives:
      - image: vyos.qc2
        inject_partition: 3
      memory: 2048
      os_type: vyos
      vcpus: 1
    injections:
    - description: VyOS logging, Wazuh syslog, IKEv2, and NTP settings the vrouter app cannot render
      dst: /boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/vrouter/cm-vyos-config.sh
    labels:
      site: fc
      zone: edge
    network:
      interfaces:
      - address: 203.0.113.10
        mask: 30
        name: eth0
        proto: static
        type: ethernet
        vlan: WAN-SC-FC
      - address: 198.18.102.2
        mask: 30
        name: eth1
        proto: static
        type: ethernet
        vlan: WAN-MM-FC
      - address: 10.11.10.1
        mask: 24
        name: eth2
        proto: static
        type: ethernet
        vlan: FC-OFFICE
      - address: 10.21.10.1
        mask: 24
        name: eth3
        proto: static
        type: ethernet
        vlan: FC-PLANT
    type: Firewall
  - annotations:
      phenix/startup-autotunnel:
      - 13101:3000
      - 18180:8080
      - 18190:8090
      - 19300:9200
    general:
      description: HELICS root broker, weather, event API, ground-truth OpenSearch and Grafana, cm-viz 3D view, chronyd for MGMT
      hostname: fc-sim-ctl
    hardware:
      drives:
      - image: cm-sim.qc2
        inject_partition: 1
      memory: 6144
      os_type: linux
      vcpus: 2
    labels:
      site: fc
      zone: mgmt
    network:
      interfaces:
      - address: 172.17.10.1
        mask: 16
        name: mgmt
        proto: static
        type: ethernet
        vlan: FC-MGMT
    type: VirtualMachine
