# dnsmasq on ot-svc: the plant's resolver (DESIGN.md 10.3 and 11).
# It answers for the plant's names only. The plant has no upstream DNS, and the
# internet side uses inet-nuke's resolver. Query logs go to syslog, which
# rsyslog relays to Wazuh.
listen-address=10.20.30.13
bind-interfaces
no-resolv
no-hosts
addn-hosts=/etc/cherrymountain/plant.hosts
domain=cherrymountain.test
local=/cherrymountain.test/
expand-hosts
domain-needed
bogus-priv
log-queries
