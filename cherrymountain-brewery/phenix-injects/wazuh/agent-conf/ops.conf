<!--
  Shared agent settings for the OPS group (scada-fuxa, historian, ews, ot-svc),
  DESIGN.md 14. The EWS is the choke point of the vendor path: its authentication
  log shows the vendor's SSH and RDP logins, and cm-plc-tool (the engineer's
  OpenPLC REST helper) writes its actions to syslog, which only the EWS sends.
-->
<!-- Every agent of the group: who signed in and who used sudo (sshd, PAM), which
     Wazuh's own rules read. The packaged agent configuration collects neither this
     file nor the journal. -->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>

<agent_config name="ews">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
</agent_config>
