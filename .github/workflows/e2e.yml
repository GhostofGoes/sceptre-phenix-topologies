# Runs every experiment of this repository under a real phenix and minimega
# with QEMU/KVM guests, and records how far each gets: configs, create, start,
# guests running, guests on C2, and stop. Nodes whose disk image no recipe in
# sceptre-phenix-images can build stay off, and the booted guests' memory is
# scaled to the runner; .github/e2e/run_topology.py records every such
# adaptation with the results.
name: E2E

on:
  push:
    branches: ['ci-e2e-minimega']
  workflow_dispatch:
    inputs:
      topologies:
        description: Topologies to run (space-separated names from .github/e2e/topologies.json; empty runs all)
        type: string
        default: ''

permissions:
  contents: read

# A push cancels the branch's older push run; each dispatch runs on its own.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

env:
  PHENIX_REPOSITORY: GhostofGoes/sceptre-phenix
  PHENIX_REF: ci-e2e-minimega
  APPS_REPOSITORY: GhostofGoes/sceptre-phenix-apps
  APPS_REF: ci-e2e-minimega
  IMAGES_REPOSITORY: GhostofGoes/sceptre-phenix-images
  IMAGES_REF: ci-e2e-minimega

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      topologies: ${{ steps.plan.outputs.topologies }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select topologies and images
        id: plan
        env:
          WANT: ${{ inputs.topologies }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = json.load(open(".github/e2e/topologies.json"))
          want = os.environ.get("WANT", "").split() or list(cfg)
          unknown = [n for n in want if n not in cfg]
          if unknown:
              raise SystemExit(f"unknown topologies: {unknown}")
          tops = [{"name": n, **{k: cfg[n].get(k) for k in ("images", "apps", "lfs", "stage", "extra_apps")}} for n in want]
          images = sorted({i for t in tops for i in t["images"] or []})
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"topologies={json.dumps(tops)}\n")
              f.write(f"images={json.dumps(images)}\n")
          print(json.dumps(tops, indent=1), images)
          EOF

  images:
    name: Image ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Check out phenix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PHENIX_REPOSITORY }}
          ref: ${{ env.PHENIX_REF }}
          path: phenix
          persist-credentials: false

      - name: Check out the image recipes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.IMAGES_REPOSITORY }}
          ref: ${{ env.IMAGES_REF }}
          path: images
          persist-credentials: false

      # The month rebuilds every image monthly against current packages.
      - name: Compute the cache key
        id: key
        env:
          IMAGE: ${{ matrix.image }}
          RECIPES: ${{ hashFiles('images/Makefile', 'images/overlays/**', 'images/scripts/**') }}
          # The same builder inputs as phenix's own image cache key.
          BUILDER: ${{ hashFiles('phenix/src/go/api/image/**', 'phenix/src/go/cmd/image.go', 'phenix/src/go/types/version/v1/image.go', 'phenix/src/go/tmpl/templates/vmdb.tmpl', 'phenix/src/go/tmpl/templates/miniccc/**', 'phenix/src/go/tmpl/templates/minirouter/**', 'phenix/src/go/tmpl/templates/protonuke/**', 'phenix/src/go/tmpl/tmpl.go', 'phenix/src/go/util/mm/mmcli/**', 'phenix/src/go/util/shell/**', 'phenix/.github/e2e/minimega.ref', 'phenix/.github/e2e/vmdb2.ref', 'phenix/.github/actions/minimega/action.yml', 'phenix/.github/actions/e2e-setup/action.yml', '!phenix/src/go/**/*_test.go') }}
        run: echo "key=topo-image-$IMAGE-$(date -u +%Y-%m)-${RECIPES:0:16}-${BUILDER:0:16}" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the image
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: e2e-images/${{ matrix.image }}.qc2
          key: ${{ steps.key.outputs.key }}

      - name: Set up phenix and minimega, and the image builder
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./phenix/.github/actions/e2e-setup
        with:
          image-builder: 'true'
          kali-keyring: ${{ startsWith(matrix.image, 'kali') }}

      - name: Free disk space for the build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h / /mnt

      - name: Build ${{ matrix.image }} with the images Makefile
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: images
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          cp /usr/local/bin/miniccc /usr/local/bin/minirouter .
          start=$(date +%s)
          if [ "$IMAGE" = vyos ]; then
            sudo -E env VYOSTMP=/mnt/vyostmp \
              INJECT_BASE_IMAGE=mcr.microsoft.com/mirror/docker/library/ubuntu:24.04 \
              make vyos
          else
            make "$IMAGE" PHENIX="sudo /usr/local/bin/phenix --store.endpoint bolt:///etc/phenix/store.bdb"
          fi
          echo "built $IMAGE in $(( $(date +%s) - start )) s"
          mkdir -p ../e2e-images
          sudo mv "$IMAGE.qc2" "../e2e-images/$IMAGE.qc2"
          sudo chown "$(id -u):$(id -g)" "../e2e-images/$IMAGE.qc2"
          qemu-img info "../e2e-images/$IMAGE.qc2"

      - name: Save the image
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: e2e-images/${{ matrix.image }}.qc2
          key: ${{ steps.key.outputs.key }}

      - name: Hand the image to the topology jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topo-image-${{ matrix.image }}
          path: e2e-images/${{ matrix.image }}.qc2
          compression-level: 0
          retention-days: 3

  topology:
    name: Topology ${{ matrix.topology.name }}
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        topology: ${{ fromJSON(needs.plan.outputs.topologies) }}
    steps:
      - name: Check out the topologies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: topologies
          persist-credentials: false

      # Only the Git LFS files this topology injects; a failure is recorded by
      # the run as an LFS pointer where the file should be.
      - name: Fetch its Git LFS files
        if: matrix.topology.lfs
        continue-on-error: true
        working-directory: topologies
        env:
          LFS: ${{ matrix.topology.lfs }}
        run: git lfs pull --include "$LFS"

      - name: Check out phenix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PHENIX_REPOSITORY }}
          ref: ${{ env.PHENIX_REF }}
          path: phenix
          persist-credentials: false

      - name: Check out the phenix apps
        if: matrix.topology.apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APPS_REPOSITORY }}
          ref: ${{ env.APPS_REF }}
          path: apps
          persist-credentials: false

      - name: Set up phenix and minimega
        id: setup
        uses: ./phenix/.github/actions/e2e-setup

      - name: Free disk space for the images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get install -y -q python3-yaml
          df -h / /mnt

      - name: Install the phenix apps
        if: matrix.topology.apps
        env:
          MM_PYTHON: ${{ steps.setup.outputs.minimega-python }}
          EXTRA_APPS: ${{ join(matrix.topology.extra_apps, ' ') }}
        run: |
          set -euo pipefail
          sudo python3 -m venv /opt/phenix-apps
          sudo /opt/phenix-apps/bin/pip install --quiet "$MM_PYTHON" ./apps/src/python
          for extra in $EXTRA_APPS; do
            # Apps this repository ships; a broken one is part of the results.
            # --no-deps keeps their phenix-apps requirement, a Git URL, from
            # replacing the apps under test when the two versions differ.
            if ! sudo /opt/phenix-apps/bin/pip install --quiet --no-deps "./topologies/$extra"; then
              echo "::warning::installing $extra failed"
              echo "$extra" >> "$RUNNER_TEMP/apps-failed"
            fi
          done
          for s in /opt/phenix-apps/bin/phenix-app-* /opt/phenix-apps/bin/phenix-scorch-* /opt/phenix-apps/bin/phenix-scheduler-*; do
            [ -e "$s" ] || continue
            sudo ln -sf "$s" "/usr/local/bin/$(basename "$s")"
          done
          (cd apps/src/go && ./build.sh)
          for b in apps/src/go/bin/phenix-app-*; do
            sudo install -m 0755 "$b" "/usr/local/bin/$(basename "$b")"
          done
          sudo phenix --store.endpoint bolt:///etc/phenix/store.bdb experiment apps

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: topo-image-@(${{ join(matrix.topology.images, '|') }})
          path: e2e-images
          merge-multiple: true

      - name: Install the images and stage the topology's files
        env:
          STAGE: ${{ toJSON(matrix.topology.stage) }}
        run: |
          set -euo pipefail
          for f in e2e-images/*.qc2; do
            [ -e "$f" ] || continue
            sudo mv "$f" /phenix/images/
          done
          ls -lh /phenix/images
          # The scenarios name their files under /phenix/topologies/<name>.
          sudo ln -sfn "$GITHUB_WORKSPACE/topologies" /phenix/topologies
          python3 -c 'import json, os; [print(s, d) for s, d in (json.loads(os.environ["STAGE"]) or [])]' |
          while read -r src dst; do
            sudo mkdir -p "$(dirname "$dst")"
            sudo cp -r "topologies/$src" "$dst"
          done

      - name: Run ${{ matrix.topology.name }}
        env:
          NAME: ${{ matrix.topology.name }}
          APPS_FAILED: ${{ runner.temp }}/apps-failed
        # exec: the runner signals only the step's shell on a cancel, and sudo
        # passes that on to the driver.
        run: exec sudo -E python3 topologies/.github/e2e/run_topology.py "$NAME" "$RUNNER_TEMP/result.json"

      - name: Summarize
        if: always()
        env:
          NAME: ${{ matrix.topology.name }}
        run: |
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/result.json" 2>/dev/null || true
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "result.json")
          try:
              r = json.load(open(path))
          except (OSError, ValueError):
              print(f"### {os.environ['NAME']}: no results"); raise SystemExit
          fixed = f" ({r['result_with_fixes']} with fixes)" if r.get("result_with_fixes") else ""
          print(f"### {r['name']}: {r['result']}{fixed}")
          for a in r["attempts"]:
              print(f"\n**{a['label']}**: {a['result']}\n")
              for x in a["adaptations"]:
                  print(f"- adaptation: {x}")
              for x in a["findings"]:
                  print(f"- finding: {x}")
              print("\n| stage | ok | seconds | detail |\n|---|---|---|---|")
              for s in a["stages"]:
                  d = s["detail"].replace("\n", " ").replace("|", "/")[:300]
                  print(f"| {s['stage']} | {'yes' if s['ok'] else 'NO'} | {s['seconds']} | {d} |")
          EOF

      - name: Collect logs
        if: always()
        env:
          NAME: ${{ matrix.topology.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sudo cp "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          sudo cp -r /tmp/topo-ci "$RUNNER_TEMP/logs/configs" 2>/dev/null || true
          sudo cp -r /phenix/experiments "$RUNNER_TEMP/logs/experiments" 2>/dev/null || true
          sudo cp /tmp/minimega/minimega.log /tmp/minimega/minimega.stdout "$RUNNER_TEMP/logs/" 2>/dev/null || true
          sudo cp -r /var/log/phenix "$RUNNER_TEMP/logs/phenix" 2>/dev/null || true
          sudo find "$RUNNER_TEMP/logs" \( -name '*.qc2' -o -name '*.qcow2' -o -name '*.iso' \) -delete || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/logs"

      - name: Upload the results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topo-result-${{ matrix.topology.name }}
          path: ${{ runner.temp }}/logs
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
