              protocol: all
              source:
                address: 192.168.100.100
              destination:
                address: 10.222.222.0/24
            - action: accept
              description: HIDS agent out
              id: 146
              protocol: all
              source:
                address: 192.168.100.100
              destination:
                address: 192.168.60.55
            - action: accept
