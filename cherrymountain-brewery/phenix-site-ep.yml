# Workflow for the site `ep` alone: Eastern Plains: production brewery.
# It has the site's topology file and its scenario, with no internet and no
# other site. Apply it with its own branch, so that it maps to its own
# experiment (DESIGN.md 15.1):
#   docker exec phenix phenix workflow apply \
#     -b cherrymountain-site-ep -c phenix-site-ep.yml \
#     /phenix/topologies/cherrymountain-brewery
# The VLAN IDs are the fleet's (docs/multisite/PLANS.md, section 3): the site
# has the IDs from 301 to 399, and its access links to the ISPs take
# 500 and up. The bridge is the site's own, because phenix lets only one
# stored experiment use a bridge other than `phenix`.
#
# Generated by plantgen from plant/sites.yaml, wan/wan.yaml, and the VLAN IDs
# of phenix.yml. Do not edit: run `python -m plantgen` in tools/plantgen.
apiVersion: phenix.sandia.gov/v0
kind: Workflow
metadata: {}
spec:
  auto:
    create: ${BRANCH_NAME}
    update: true
    restart: true
  topology: cherrymountain-site-ep
  scenario: cherrymountain-site-ep
  vlans:
    EP-CORP: 304
    EP-DMZ: 305
    EP-OPS: 306
    EP-HMI: 307
    EP-FIELD-BH: 309
    EP-FIELD-CEL: 310
    EP-FIELD-PKG: 311
    EP-FIELD-UTL: 312
    EP-DERLINK: 313
    EP-FIELD-PWR: 314
    EP-BAS: 315
    EP-SOC: 316
    EP-MGMT: 317
    EP-CTRL-BH: 320
    EP-CTRL-CEL: 321
    EP-CTRL-PKG: 322
    EP-CTRL-PWR: 323
    EP-CTRL-UTL: 324
    WAN-TW-EP: 504
    WAN-SC-EP: 505
  vlanRange:
    min: 100
    max: 599
  defaultBridge: cherrymtn-ep
