  - name: wireguard
    hosts:
    - hostname: guard-jh
      metadata:
        boot: true
        interface:
          private_key: UJtXcIoNKQaXtOpxK7e9Kmgadxg1DhGQNAR0/SdSvGc=
          address: 10.222.222.1/24
          listen_port: 51820
        peers:
        - public_key: aUT/gilnN33HrhKNZ0xfPmTwwQ5/jlVj1mS6yq+YFD4=
          allowed_ips: 10.222.222.45/32
          keepalive: 21
    - hostname: guard-cli
      metadata:
        interface:
          private_key: sEPxCZZoPfFBP3n2ctG9hOjchSqJtx2/NNI8BJH+pFg=
          address: 10.222.222.45/32
        peers:
        - public_key: xsDGqVEWYUOAK/XLvN5/zgtPcD1dVQjbPgQAMxbw0XU=
          server_endpoint: 192.168.60.100:51820
          allowed_ips: 10.222.222.0/24, 192.168.100.0/24
          keepalive: 21
  - name: soh
    metadata:
      # CI runs that booted 10 guests saw them register with C2 up to about 11
      # minutes after launch; with every Linux image built, 15 guests boot
      # there. The checks start 10 minutes after launch and wait up to 15
      # minutes more for each guest's C2.
      startupDelay: 10m
      c2Timeout: 15m
      # The routers' ACLs and IPsec policies allow only the plant's own flows,
      # so pings between every pair of hosts would fail by design; the flows
      # are tested under testCustomReachability. Keep the quotes: YAML 1.1
      # parsers read a bare off as false.
      testReachability: "off"
      testCustomReachability:
      # Each site workstation reaches a WTG through its site router, the IPsec
      # tunnel and rtr-site; ws-ot is on the WTGs' VLAN.
      - src: ws-owop
        dst: wtg-01|IF0
        proto: tcp
        port: 80
        wait: 1m
      - src: ws-grid
        dst: wtg-02|IF0
        proto: tcp
        port: 80
        wait: 1m
      - src: ws-oem
        dst: wtg-03|IF0
        proto: tcp
        port: 80
        wait: 1m
      - src: ws-ot
        dst: wtg-04|IF0
        proto: tcp
        port: 80
        wait: 1m
      - src: ws-ot
        dst: wtg-05|IF0
        proto: tcp
        port: 80
        wait: 1m
      # The protonuke clients reach the Internet server through rtr-site and rtr-isp4.
      - src: nuke-pnc1
        dst: nuke-pns|IF0
        proto: tcp
        port: 80
        wait: 1m
      - src: nuke-pnc2
        dst: nuke-pns|IF0
        proto: tcp
        port: 80
        wait: 1m
      # RDP to ws-ot from the jump host through rtr-site, and from kali-ot on the ot VLAN.
      - src: guard-jh
        dst: ws-ot|IF0
        proto: tcp
        port: 3389
        wait: 1m
      - src: kali-ot
        dst: ws-ot|IF0
        proto: tcp
        port: 3389
        wait: 1m
      hostFiles:
        ws-owop:
        - 'C:/phenix/startup/90-protonuke.ps1'
        - 'C:/minimega/protonuke.log'
        ws-grid:
        - 'C:/phenix/startup/90-protonuke.ps1'
        - 'C:/minimega/protonuke.log'
        ws-oem:
        - 'C:/phenix/startup/90-protonuke.ps1'
        - 'C:/minimega/protonuke.log'
        nuke-pns:
        - /etc/default/protonuke
        kali-inet:
        - /root/wind-test-harness/main.sh
        - /root/wind-test-harness/tests.csv
        guard-cli:
        - /etc/wireguard/wg0.conf
        nuke-pnc1:
        - /etc/default/protonuke
        nuke-pnc2:
        - /etc/default/protonuke
        guard-jh:
        - /etc/wireguard/wg0.conf
        - /etc/phenix/startup/wireguard-enable.sh
        ws-ot:
        - 'C:/phenix/startup/90-protonuke.ps1'
        - 'C:/minimega/protonuke.log'
        kali-ot:
        - /root/wind-test-harness/main.sh
        - /root/wind-test-harness/tests.csv
        wtg-01:
        - /etc/default/protonuke
        wtg-02:
        - /etc/default/protonuke
        wtg-03:
        - /etc/default/protonuke
        wtg-04:
        - /etc/default/protonuke
        wtg-05:
        - /etc/default/protonuke
        rtr-owop:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-isp1:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-grid:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-isp2:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-oem:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-isp3:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-site:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
        rtr-isp4:
        - /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/phenix-run-flag
      hostServices:
        nuke-pns:
        - phenix.service
        - protonuke.service
        kali-inet:
        - phenix.service
        guard-cli:
        - phenix.service
        nuke-pnc1:
        - phenix.service
        - protonuke.service
        nuke-pnc2:
        - phenix.service
        - protonuke.service
        guard-jh:
        - phenix.service
        - wg-quick@wg0.service
        kali-ot:
        - phenix.service
        wtg-01:
        - phenix.service
        - protonuke.service
        wtg-02:
        - phenix.service
        - protonuke.service
        wtg-03:
        - phenix.service
        - protonuke.service
        wtg-04:
        - phenix.service
        - protonuke.service
        wtg-05:
        - phenix.service
        - protonuke.service
        rtr-owop:
        - strongswan.service
        rtr-grid:
        - strongswan.service
        rtr-oem:
        - strongswan.service
        rtr-site:
        - strongswan.service
      hostProcesses:
        ws-owop:
        - protonuke
        ws-grid:
        - protonuke
        ws-oem:
        - protonuke
        ws-ot:
        - protonuke
      hostListeners:
        nuke-pns:
        - ':80'
        - ':443'
        - ':25'
        guard-jh:
        - ':51820'
        wtg-01:
        - ':80'
        wtg-02:
        - ':80'
        wtg-03:
        - ':80'
        wtg-04:
        - ':80'
        wtg-05:
        - ':80'
      # Custom tests run once, and one at a time on each guest. Each waits at
      # most 3 minutes for its condition, so the tests of a guest end within
      # c2Timeout. phenix replaces every dollar-brace reference when it loads
      # this file, so the scripts must not use one.
      hostCustomTests:
        nuke-pns:
        - name: serves-plant-clients
          testScript: |
            # protonuke logs each HTTP and HTTPS request it serves as "<proto> <client
            # address>:<port>". It logs SMTP only when a client sends QUIT, which its
            # own client never does, so SMTP comes from the counters it prints.
            for _ in $(seq 36); do
              seen=$(grep -oE ' (http|https) 192\.168\.(40|50)\.100:' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              mails=$(journalctl -u protonuke -o cat 2>/dev/null | grep -cE '^smtp[[:space:]]+[1-9]')
              [ "$seen" -eq 4 ] && [ "$mails" -gt 0 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ] && [ "$mails" -gt 0 ]; then echo "http and https from both clients, smtp served"; else echo "$seen of 4 client protocols in protonuke.log, $mails smtp reports"; fi
          testStdout: http and https from both clients, smtp served
        guard-jh:
        - name: vpn-gateway
          testScript: |
            for _ in $(seq 36); do
              addr=$(ip -4 -o addr show dev wg0 2>&1)
              fwd=$(cat /proc/sys/net/ipv4/ip_forward)
              ok=""
              grep -q 'inet 10.222.222.1/24' <<<"$addr" && [ "$fwd" = 1 ] && ok=1
              [ -n "$ok" ] && break
              sleep 5
            done
            [ -n "$addr" ] || addr=none
            if [ -n "$ok" ]; then echo "wg0 up as the VPN gateway, forwarding on"; else echo "wg0: $addr; ip_forward=$fwd"; fi
          testStdout: wg0 up as the VPN gateway, forwarding on
        wtg-01:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        wtg-02:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        wtg-03:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        wtg-04:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        wtg-05:
        - name: serves-workstations
          testScript: |
            for _ in $(seq 36); do
              seen=$(grep -oE ' http 192\.168\.(10\.10|20\.10|30\.10|100\.100):' /var/log/protonuke.log 2>/dev/null | sort -u | wc -l)
              [ "$seen" -eq 4 ] && break
              sleep 5
            done
            if [ "$seen" -eq 4 ]; then echo "http from all four workstations"; else echo "$seen of 4 workstations in protonuke.log"; fi
          testStdout: http from all four workstations
        rtr-owop:
        - name: acl-rulesets
          testScript: |
            # VyOS renders each firewall ruleset as the nftables chain NAME_<ruleset>,
            # which the forward filter jumps to for the interface the vrouter app binds.
            for _ in $(seq 36); do
              rules=$(nft list ruleset 2>&1)
              missing=""
              for name in owop-in owop-out; do
                if ! grep -qF "chain NAME_$name {" <<<"$rules" || ! grep -qE "jump NAME_$name( |\$)" <<<"$rules"; then
                  missing="$missing $name"
                fi
              done
              [ -z "$missing" ] && break
              sleep 5
            done
            if [ -z "$missing" ]; then echo "ACL rulesets loaded and applied"; else echo "ACL rulesets not loaded or not applied:$missing"; fi
          testStdout: ACL rulesets loaded and applied
        - name: plant-routes
          testScript: |
