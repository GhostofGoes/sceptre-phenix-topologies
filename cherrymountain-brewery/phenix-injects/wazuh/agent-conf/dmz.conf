<!--
  Shared agent settings for the DMZ group (dmz-vpn and dmz-jump), DESIGN.md 13 and 14.
  The manager copies this file to /var/ossec/etc/shared/dmz/agent.conf, and the
  agents of the group pick it up. A host that lacks a file below only logs a
  warning, so the two hosts share one group and filter by agent name.
-->
<!-- Every agent of the group: who signed in and who used sudo (sshd, PAM), which
     Wazuh's own rules read. The packaged agent configuration collects neither this
     file nor the journal. -->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>

<agent_config name="dmz-vpn">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cm-wireguard/events.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>
</agent_config>

<agent_config name="dmz-jump">
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cm-guacamole/containers.log</location>
  </localfile>
  <!-- Session recordings are evidence: a new file is a new session, and a change is tampering. -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/var/lib/cm-guacamole/recordings</directories>
  </syscheck>
</agent_config>
