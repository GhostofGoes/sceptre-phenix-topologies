# Mirror app block from DESIGN §14, reduced to the fixture VLANs.
apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: spike-malcolm
  annotations:
    topology: spike-malcolm
spec:
  apps:
    - name: mirror
      metadata:
        version: v1
        mirrorNet: 172.30.0.0/16
        mirrorVLAN: MIRROR
        mirrorBridge: cherrymtn
      hosts:
        - hostname: malcolm
          metadata:
            interface: IFM
            setupOVS: true
            vlans: [OPS]
