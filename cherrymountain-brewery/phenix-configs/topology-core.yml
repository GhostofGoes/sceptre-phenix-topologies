  - general:
      description: NTP (chrony), DNS (dnsmasq), syslog relay, OPS BBMD (BACpypes3)
      hostname: ot-svc
    hardware:
      drives:
      - image: cm-svc.qc2
        inject_partition: 1
      memory: 1024
      os_type: linux
      vcpus: 1
    injections:
    - description: BBMD settings for the OPS BBMD (listens on a /0 prefix for FUXA's limited broadcast)
      dst: /etc/default/cm-bbmd
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/ot-svc.env
    - description: 'dnsmasq: authoritative plant zone, no upstream'
      dst: /etc/dnsmasq.d/10-plant.conf
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/ot-svc/dnsmasq-plant.conf
    - description: plant host names and addresses
      dst: /etc/cherrymountain/plant.hosts
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/ot-svc/plant.hosts
    - description: 'rsyslog: receive UDP 514 and relay to Wazuh'
      dst: /etc/rsyslog.d/30-cm-relay.conf
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/ot-svc/rsyslog-relay.conf
    - description: restrict chrony clients, start DNS and syslog
      dst: /etc/phenix/startup/60-ot-svc.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/ot-svc/60-ot-svc.sh
    - description: BACpypes3 BBMD service
      dst: /usr/local/lib/cm-bbmd/cm_bbmd.py
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/cm_bbmd.py
    - description: BBMD service unit
      dst: /etc/systemd/system/cm-bbmd.service
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/cm-bbmd.service
    - description: start the BBMD service at boot
      dst: /etc/phenix/startup/70-bbmd.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/bbmd/70-bbmd.sh
    labels:
      zone: ops
    network:
