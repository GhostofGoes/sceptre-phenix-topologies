# dnsmasq on inet-traffic: the "internet" name service (DESIGN.md 10.3 and 11).
# CORP and VENDOR resolve these names through it. They resolve to inet-traffic,
# the only server on the internet side.
listen-address=203.0.113.10
bind-interfaces
no-resolv
no-hosts
domain-needed
bogus-priv
address=/www.shadecast-cable.test/203.0.113.10
address=/mail.shadecast-cable.test/203.0.113.10
address=/ntp.shadecast-cable.test/203.0.113.10
address=/dns.shadecast-cable.test/203.0.113.10
