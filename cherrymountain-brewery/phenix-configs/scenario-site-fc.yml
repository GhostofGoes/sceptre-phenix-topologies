# cherrymountain-site-fc scenario: the firewall rules of the site `fc`
# and its SoH network tests. Generated by netcheck (tools/netcheck,
# `python -m netcheck --write-sites`) from the conduit matrix
# (netcheck/conduits.py) and plant/sites.yaml. Do not edit.
#
# The rules carry the conduits whose two ends are hosts of this site, and
# nothing else: 0 rules on fc-fw-edge (0).
# This file is not a finished scenario. It does not have these parts yet:
# - The conduits to the internet, the vendor, the utility, and other sites,
#   with the edge's NAT and VPN.
# - The app blocks that plantgen writes for the site
#   (plant/generated/fleet/fc/phenix/), which sync.py does not embed yet.
apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: cherrymountain-site-fc
  annotations:
    topology: cherrymountain-site-fc
spec:
  apps:
  - name: vrouter
    hosts:
    - hostname: fc-fw-edge
      metadata:
        acl:
          egress:
            eth0: FROM-WAN-SC-FC
            eth1: FROM-WAN-MM-FC
            eth2: FROM-FC-OFFICE
            eth3: FROM-FC-PLANT
          rulesets:
          - name: FROM-WAN-SC-FC
            default: drop
            description: 'Traffic entering fc-fw-edge from WAN-SC-FC: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
          - name: FROM-WAN-MM-FC
            default: drop
            description: 'Traffic entering fc-fw-edge from WAN-MM-FC: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
          - name: FROM-FC-OFFICE
            default: drop
            description: 'Traffic entering fc-fw-edge from FC-OFFICE: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
          - name: FROM-FC-PLANT
            default: drop
            description: 'Traffic entering fc-fw-edge from FC-PLANT: stateful, default deny'
            rules:
            - id: 5
              action: accept
              description: Established and related connections
              protocol: all
              stateful: true
  - name: soh
    metadata:
      startupDelay: 10m
      c2Timeout: 15m
      testReachability: 'off'
      skipHosts:
      - fc-fw-edge
      testCustomReachability:
      - src: fc-hmi-brewhouse
        dst: fc-scada-fuxa|IF0
        proto: tcp
        port: 1881
        wait: 5m
      - src: fc-hmi-brewhouse
        dst: fc-historian|IF0
        proto: tcp
        port: 3000
        wait: 5m
      - src: fc-scada-fuxa
        dst: fc-plc-brewhouse|IF0
        proto: tcp
        port: 4840
        wait: 5m
      - src: fc-scada-fuxa
        dst: fc-plc-cellar|IF0
        proto: tcp
        port: 502
        wait: 5m
      - src: fc-scada-fuxa
        dst: fc-plc-utilities|IF0
        proto: tcp
        port: 502
        wait: 5m
      - src: fc-scada-fuxa
        dst: fc-bas-rtu-taproom|IF0
        proto: udp
        port: 47808
        wait: 5m
        udpPacketBase64: gQoAEQEEAAUBDAwCAAu5GU0=
      - src: fc-scada-fuxa
        dst: fc-bas-coldroom|IF0
        proto: udp
        port: 47808
        wait: 5m
        udpPacketBase64: gQoAEQEEAAUBDAwCAAu6GU0=
      - src: fc-scada-fuxa
        dst: fc-bas-vent|IF0
        proto: udp
        port: 47808
        wait: 5m
        udpPacketBase64: gQoAEQEEAAUBDAwCAAu7GU0=
      - src: fc-plc-utilities
        dst: fc-plc-cellar|IF0
        proto: tcp
        port: 502
        wait: 5m
      hostCustomTests:
        fc-corp-ws:
        - name: blocked-fc-scada-fuxa-1881
          executor: bash
          testScript: |
            err=$(timeout 5 bash -c 'exec 3<>/dev/tcp/10.21.10.40/1881' 2>&1); rc=$?
            if [ "$rc" -eq 124 ] || printf '%s' "$err" | grep -qiE 'unreachable|no route'; then
              echo DROPPED
            else
              echo "ALLOWED rc=$rc $err"
            fi
          testStdout: DROPPED
        - name: blocked-fc-plc-cellar-502
          executor: bash
          testScript: |
            err=$(timeout 5 bash -c 'exec 3<>/dev/tcp/10.21.10.12/502' 2>&1); rc=$?
            if [ "$rc" -eq 124 ] || printf '%s' "$err" | grep -qiE 'unreachable|no route'; then
              echo DROPPED
            else
              echo "ALLOWED rc=$rc $err"
            fi
          testStdout: DROPPED
        fc-scada-fuxa:
        - name: blocked-fc-rio-cellar-502
          executor: bash
          testScript: |
            err=$(timeout 5 bash -c 'exec 3<>/dev/tcp/10.21.12.10/502' 2>&1); rc=$?
            if [ "$rc" -eq 124 ] || printf '%s' "$err" | grep -qiE 'unreachable|no route'; then
              echo DROPPED
            else
              echo "ALLOWED rc=$rc $err"
            fi
          testStdout: DROPPED
