frr defaults traditional
hostname ws-fw-edge
log file /var/run/frr/ws-fw-edge/frr.log
ip forwarding
!
ip prefix-list OWN seq 5 deny 0.0.0.0/0 le 32
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list SITE-NETS seq 5 permit 10.0.0.0/8 ge 16 le 24
ip prefix-list PUBLIC seq 5 deny 10.0.0.0/8 le 32
ip prefix-list PUBLIC seq 10 deny 0.0.0.0/0
ip prefix-list PUBLIC seq 15 permit 0.0.0.0/0 le 24
bgp community-list standard FROM-CUSTOMERS permit 65030:1
!
route-map FROM-CUSTOMER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 200
 set community 65030:1
!
route-map FROM-PEER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 150
 set community 65030:2
!
route-map FROM-PROVIDER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 100
 set community 65030:3
!
route-map TO-UPSTREAM permit 10
 match community FROM-CUSTOMERS
route-map TO-UPSTREAM permit 20
 match ip address prefix-list OWN
!
route-map TO-CUSTOMER permit 10
!
route-map DEFAULT-ONLY permit 10
 match ip address prefix-list DEFAULT
!
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
!
route-map OVERLAY-PRIMARY permit 10
 match ip address prefix-list SITE-NETS
 set local-preference 200
!
route-map OVERLAY-BACKUP permit 10
 match ip address prefix-list SITE-NETS
 set local-preference 100
!
route-map OVERLAY-OUT permit 10
 match ip address prefix-list SITE-NETS
!
ip route 0.0.0.0/0 198.18.101.9 10
ip route 0.0.0.0/0 203.0.113.17 20
!
router bgp 65030
 bgp router-id 10.255.3.1
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 10.255.0.4 remote-as 64505
 neighbor 10.255.0.4 description overlay-ws-a
 neighbor 10.255.0.4 timers 3 9
 neighbor 10.255.0.4 timers connect 5
 neighbor 10.255.0.4 bfd
 neighbor 10.255.0.6 remote-as 64505
 neighbor 10.255.0.6 description overlay-ws-b
 neighbor 10.255.0.6 timers 3 9
 neighbor 10.255.0.6 timers connect 5
 neighbor 10.255.0.6 bfd
 address-family ipv4 unicast
  network 10.22.30.0/24
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.6 activate
  neighbor 10.255.0.4 route-map OVERLAY-PRIMARY in
  neighbor 10.255.0.4 route-map OVERLAY-OUT out
  neighbor 10.255.0.6 route-map OVERLAY-BACKUP in
  neighbor 10.255.0.6 route-map OVERLAY-OUT out
 exit-address-family
!
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
 peer 10.255.0.4
  profile fast
 !
 peer 10.255.0.6
  profile fast
 !
!
end
