# cherrymountain-site-fr: the nodes of the site `fr` (Front Range: flagship brewery, taproom, head office).
# Generated by plantgen from plant/plant.yaml and plant/sites.yaml (site fr),
# with the nodes of topology-core.yml, topology-soc.yml, and
# topology-remote-access.yml as the source of each node. Do not edit.
#
# The firewall rulesets are not here. They are in scenario-site-fr.yml,
# which sync.py writes: the rules of the conduits whose two ends are hosts of
# this site, as netcheck computes them (tools/netcheck).
#
# An injected file that holds a name or an address of the plant is the site's
# own copy, under phenix-injects/fleet/fr/ (plantgen renders it, and sync.py
# puts it there).
#
# This file is not a finished site. It does not have these parts yet:
# - The edge's WAN side: its default route, NAT, and the VPN, which the WAN
#   generator writes (tools/wangen).
# - The conduits between sites, with their rules.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-site-fr
spec:
  nodes:
  - commands:
    - exec sg vyattacfg -c /usr/lib/live/mount/persistence/boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
    general:
      description: 'IT/Internet firewall: NAT, WireGuard DNAT, IPsec to util-rtr'
      hostname: fr-fw-edge
    hardware:
      drives:
      - image: vyos.qc2
        inject_partition: 3
      memory: 2048
      os_type: vyos
      vcpus: 1
    injections:
    - description: VyOS logging, Wazuh syslog, IKEv2, and NTP settings the vrouter app cannot render
      dst: /boot/vyos/rw/config/scripts/custom/cm-vyos-config.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/fleet/fr/vrouter/cm-vyos-config.sh
    labels:
      site: fr
      zone: edge
    network:
      interfaces:
      - address: 203.0.113.2
        mask: 30
        name: eth0
        proto: static
        type: ethernet
        vlan: WAN-SC-FR
      - address: 198.18.101.2
        mask: 30
        name: eth1
        proto: static
        type: ethernet
        vlan: WAN-TW-FR
      - address: 10.10.10.1
        mask: 24
        name: eth2
        proto: static
        type: ethernet
        vlan: FR-CORP
      - address: 10.10.20.1
        mask: 24
        name: eth3
        proto: static
        type: ethernet
        vlan: FR-DMZ
      routes:
      - destination: 10.20.10.0/24
        next: 10.10.20.2
      - destination: 10.20.15.0/24
        next: 10.10.20.2
      - destination: 10.20.20.0/24
        next: 10.10.20.2
      - destination: 10.20.30.0/24
        next: 10.10.20.2
      - destination: 10.30.10.0/24
        next: 10.10.20.2
      - destination: 10.40.10.0/24
        next: 10.10.20.2
    type: Firewall
  - commands:
