          - { id: XA01.CMD, desc: "CO2 horns and strobes (tier 3 in any area)", io: bas-vent.horn_strobe }
          - { id: FAN03.CMD, desc: "CO2 area exhaust fans (bulk tank, filler, cold room)", io: bas-vent.area_exhaust }

# State of health (DESIGN.md §15.4). plantgen derives the PLC-to-field,
# FUXA-to-PLC/BACnet, FEP, and DNP3 flows; the conduits below are the other
# testable TCP flows of §10.3 (flows with no reply, such as syslog, IKE, and
# WireGuard, are checked with cc scripts instead). Flows whose hosts are not
# in a variant are dropped.
soh:
  startup_delay: 10m
  c2_timeout: 15m
  wait: 5m
  skip_hosts: [isp-rtr, util-rtr, fw-edge, fw-ot]
  profiles:
    rio: { processes: [ot-sim-cpu-module, ot-sim-modbus-module, ot-sim-io-module], listeners: [":502"] }
    field: { processes: [ot-sim-cpu-module, ot-sim-modbus-module, ot-sim-io-module], listeners: [":502"] }
    bas: { processes: [ot-sim-cpu-module, ot-sim-bacnet-module, ot-sim-io-module] }
    fep: { processes: [ot-sim-cpu-module, ot-sim-dnp3-module, ot-sim-modbus-module], listeners: [":20000"] }
    dnp3-master: { processes: [ot-sim-cpu-module, ot-sim-dnp3-module] }
    plc: { listeners: [":8443"] }
    scada: { processes: [/opt/fuxa/server/main.js], listeners: [":1881"] }
    historian: { listeners: [":8086", ":3000", ":1883"] }
    sim: { processes: [cherrymountain_sim] }
    ews: { listeners: [":3389", ":22"] }
    jump: { listeners: [":443"], containers: [guacamole, guacd, postgres] }
    bbmd: { processes: [cm-bbmd] }
    hmi: { processes: [chromium] }
  host_profiles:
    sim-ctl: { processes: [helics_broker], listeners: [":8080", ":8090", ":9200", ":3000"] }
    ot-svc: { processes: [chronyd, dnsmasq, rsyslogd, cm-bbmd], listeners: [":53"] }
    inet-nuke: { processes: [protonuke, chronyd, dnsmasq], listeners: [":80", ":443"] }
    plc-brewhouse: { listeners: [":4840"] }
    plc-cellar: { listeners: [":502"] }
    plc-packaging: { listeners: [":102"] }
    plc-utilities: { listeners: [":502"] }
    plc-power: { listeners: [":502"] }
    wazuh: { listeners: [":443", ":1514", ":1515"] }
    malcolm: { listeners: [":443"] }
  conduits:
    - { src: hmi-brewhouse, dst: scada-fuxa, port: 1881, desc: Operator HMI }
    - { src: hmi-packaging, dst: scada-fuxa, port: 1881, desc: Operator HMI }
    - { src: hmi-brewhouse, dst: bas-fuxa, port: 1881, desc: BAS HMI }
    - { src: hmi-packaging, dst: bas-fuxa, port: 1881, desc: BAS HMI }
    - { src: hmi-brewhouse, dst: historian, port: 3000, desc: Read-only Grafana }
    - { src: hmi-packaging, dst: historian, port: 3000, desc: Read-only Grafana }
    - { src: scada-fuxa, dst: historian, port: 8086, desc: SCADA DAQ (intra-zone) }
    - { src: scada-fuxa, dst: historian, port: 1883, desc: PackTags/OEE MQTT (intra-zone) }
    - { src: bas-fuxa, dst: historian, port: 8086, desc: BAS DAQ }
    - { src: plc-utilities, dst: plc-cellar, port: 502, desc: Peer interlock reads (east-west) }
    - { src: ews, dst: plc-brewhouse, port: 8443, desc: OpenPLC REST }
    - { src: ews, dst: plc-cellar, port: 8443, desc: OpenPLC REST }
    - { src: ews, dst: plc-packaging, port: 8443, desc: OpenPLC REST }
    - { src: ews, dst: plc-utilities, port: 8443, desc: OpenPLC REST }
    - { src: ews, dst: plc-power, port: 8443, desc: OpenPLC REST }
    - { src: ews, dst: bas-fuxa, port: 1881, desc: BAS engineering }
    - { src: dmz-jump, dst: ews, port: 3389, desc: Vendor RDP through Guacamole }
    - { src: dmz-jump, dst: ews, port: 22, desc: Vendor SSH through Guacamole }
    - { src: vendor-ws, dst: dmz-jump, port: 443, desc: Guacamole login through the WireGuard tunnel }
    - { src: dmz-jump, dst: ot-svc, port: 53, desc: DNS for DMZ hosts }
    - { src: dmz-vpn, dst: ot-svc, port: 53, desc: DNS for DMZ hosts }
    - { src: corp-ws, dst: inet-nuke, port: 443, desc: Office web (SNAT) }
    - { src: corp-ws, dst: inet-nuke, port: 80, desc: Office web (SNAT) }
    - { src: scada-fuxa, dst: wazuh, port: 1514, desc: Wazuh agent }
    - { src: historian, dst: wazuh, port: 1514, desc: Wazuh agent }
    - { src: ews, dst: wazuh, port: 1514, desc: Wazuh agent }
    - { src: hmi-brewhouse, dst: wazuh, port: 1514, desc: Wazuh agent }
    - { src: bas-fuxa, dst: wazuh, port: 1514, desc: Wazuh agent }
    - { src: dmz-jump, dst: wazuh, port: 1514, desc: Wazuh agent }
    - { src: dmz-vpn, dst: wazuh, port: 1515, desc: Wazuh agent enrollment }
    - { src: soc-analyst, dst: malcolm, port: 443, desc: Malcolm UI }
    - { src: soc-analyst, dst: wazuh, port: 443, desc: Wazuh UI }

# Vendor WireGuard tunnel (DESIGN.md §13). The keys are derived from the seed
# (tools/plantgen/plantgen/wgkeys.py), so they are public, range-only
# throwaway secrets. vendor-ws routes only dmz-jump into the tunnel.
wireguard:
  server: dmz-vpn
  client: vendor-ws
  server_address: 10.99.0.1/24
  client_address: 10.99.0.2/24
  listen_port: 51820
  endpoint: 203.0.113.2:51820
  client_allowed_ips: [10.10.20.11/32]
  keepalive: 25
  seed: cherrymountain-range-only-wireguard-v1

# SCORCH pcap capture lists per run (DESIGN.md §15.6): host|interface.
scorch:
  captures:
    baseline-brew-day: [scada-fuxa|IF0, plc-brewhouse|IF0, plc-brewhouse|IF1, rio-brewhouse|IF0]
    utility-outage: [rtu-der|IF0, rtu-der|IF1, plc-power|IF1, gen-ats|IF0]
    cellar-co2-leak: [bas-fuxa|IF0, bas-vent|IF0]
    packaging-shift: [plc-packaging|IF1, rio-packaging|IF0]

# Ground-truth snapshot for the white cell's 3D view (DESIGN.md §15.10). The
# weather federate on sim-ctl subscribes to every publication these patterns
# match (fnmatch, against the variant's federates) and serves the values as
# GET /api/v1/state on the event API; the KPI keys make GET /api/v1/kpis real.
# cm-viz on sim-ctl reads that snapshot. A variant without the weather
# federate (ci) has no snapshot.
snapshot:
  federate: weather
  keys:
    # The cellar: vessels, relief valves, shared equipment, CO2 into the room.
    - "cellar/fv*"
    - "cellar/bbt*"
    - cellar/gasrelay.co2_ok
    - cellar/co2.vent_gps
    - cellar/clock.sim_hours
    # Cellar air, purge fans, and the gas-detection relay.
    - "building/bas-vent.*"
    - "building/cellar.*"
    - building/vent.co2_relay_ok
    # Glycol supply (jacket colors).
    - utilities/glycol.supply_f
    # Plant power: every power point, bus, and load.
    - "power/*"
    - "*/load.*.kw"
    # KPIs (GET /api/v1/kpis).
    - brewhouse/batch.completed
    - brewhouse/batch.active
    - packaging/bottles.total
    - packaging/kegs.total
    - packaging/ttb.bbl
    - "packaging/fill.*"
    - utilities/wastewater.inhibit_events
    - "utilities/cip.*"

# Variants (DESIGN.md §11, §15.3). Each variant lists the areas, federates,
# and hosts it contains; plantgen emits per-variant outputs.
variants:
  ci:
    description: >-
      Cellar slice for e2e CI: sim-ctl, sim-process, rio-cellar, plc-cellar,
      scada-fuxa. scada-fuxa and plc-cellar share one flat CTRL VLAN with no
      firewall; there is no ot-svc, weather, utilities, or building federate.
    areas: [CEL]
    # The fermentation cell only; BBTs and shared cellar equipment are full
    # plant (and would move the ci register map and the PLC program).
    units:
      CEL: [CLK, FV101, FV102, FV103, FV104]
    federates: [cellar]
    hosts: [sim-ctl, sim-process, rio-cellar, plc-cellar, scada-fuxa]
    host_overrides:
      scada-fuxa:
        interfaces:
          IF0: { vlan: CTRL, ip: 10.20.10.10/24 }
    helics:
      broker: { hostname: sim-ctl, interface: mgmt }
      end_time_s: 86400
    ground_truth: false
    # Cellar federate settings (DESIGN.md §9.4). FV-101 starts mid-
    # fermentation here, rather than empty as in the full plant, so its
    # temperature and gravity move during a short CI run.
    sim:
      compression: 48
      noise: true
      seed: 101
      initial_state:
        FV101: { phase: fermenting, sim_hours: 20, temp_f: 66, spund_sp_psig: 1.0 }
        FV102: { phase: fermenting, sim_hours: 48, temp_f: 66, spund_sp_psig: 1.0 }
        FV103: { phase: fermenting, sim_hours: 120, temp_f: 68, dry_hop_lb_per_bbl: 2.0, spund_sp_psig: 12.0 }
        FV104: { phase: fermenting, sim_hours: 264, temp_f: 50, spund_sp_psig: 12.0 }
    # ntp app in app mode, every host listed (DESIGN.md §15.2). ci has no
    # ot-svc, so sim-ctl serves MGMT and scada-fuxa serves the CTRL VLAN.
    ntp:
      default_source: { hostname: sim-ctl, interface: mgmt }
      hosts:
        sim-ctl: { server: chronyd }
        scada-fuxa: { server: chronyd }
        sim-process: { client: chrony }
        rio-cellar: { client: chrony }
        plc-cellar: { client: chrony, source: { hostname: scada-fuxa, interface: IF0 } }
    # cherrymountain app metadata (apps/cherrymountain_apps/cherrymountain).
    app:
      verify: { timeout: 15 }

  full:
    description: >-
      The whole plant (DESIGN.md §11): 43 VMs with the SOC and vendor remote
      access. Every area, federate, and field device.
    areas: [BH, CEL, PKG, UTL, PWR, FAC]
    federates: &full-federates [weather, brewhouse, cellar, utilities, packaging, power, building]
    hosts:
      - isp-rtr
      - inet-nuke
      - vendor-ws
      - util-rtr
      - utility-derms
      - corp-ws
      - fw-edge
      - dmz-vpn
      - dmz-jump
      - fw-ot
      - scada-fuxa
      - historian
      - ews
      - ot-svc
      - hmi-brewhouse
      - hmi-packaging
      - plc-brewhouse
      - plc-cellar
      - plc-packaging
      - plc-utilities
      - plc-power
      - rio-brewhouse
      - rio-cellar
      - rio-packaging
      - rio-utilities
      - glycol-chiller
      - relay-main
      - pv-inverter
      - bess-pcs
      - gen-ats
      - rtu-der
      - bas-bbmd
      - bas-fuxa
      - bas-rtu-taproom
      - bas-coldroom
      - bas-vent
      - sim-ctl
      - sim-process
      - sim-power
      - sim-building
      - malcolm
      - wazuh
      - soc-analyst
    helics: &full-helics
      broker: { hostname: sim-ctl, interface: mgmt }
      app_block: true
      # One week; the phenix ot-sim app's default 36000 s is too short (§9.2).
      end_time_s: 604800
    ground_truth: true
    # Summer weekday, 04:30 local, ahead of the 05:00 brew start (§9.4).
    clock: &full-clock { start: "2026-07-15T04:30:00-06:00", timezone: America/Denver, speedup: 1 }
    sim: &full-sim
      compression: 48
      noise: true
      seed: 2026
      # Staggered initial state (DESIGN.md §9.4).
      initial_state:
        FV101: { phase: empty, temp_f: 64 }
        FV102: { phase: fermenting, sim_hours: 48, temp_f: 66, spund_sp_psig: 1.0 }
        FV103: { phase: fermenting, sim_hours: 120, temp_f: 68, dry_hop_lb_per_bbl: 2.0, spund_sp_psig: 12.0 }
        FV104: { phase: fermenting, sim_hours: 264, temp_f: 50, spund_sp_psig: 12.0 }
        BBT201: { phase: carbonating, temp_f: 34, level_pct: 90, co2_vol: 1.8 }
        BBT202: { phase: serving, temp_f: 34, level_pct: 70, co2_vol: 2.6 }
    federate_sim: &full-federate-sim
      weather:
        # EPW path on sim-ctl; without it the federate uses its synthetic
        # Denver design-day model.
        epw: /opt/cherrymountain/weather/USA_CO_Golden-NREL.724666_TMY3.epw
        station_elevation_m: 1829
        site_elevation_m: 1585
      brewhouse:
        recipe: fire-of-the-phenix
        auto_start: "05:00"
      utilities:
        seed: 11
      packaging:
        seed: 7
        shift_start: "06:00"
        shift_end: "14:30"
      power:
        demand_target_kw: 250
        bess_min_soc_pct: 50
      building:
        seed: 13
    ntp:
      default_source: { hostname: ot-svc, interface: IF0 }
      hosts:
        ot-svc: { server: chronyd }
        sim-ctl: { server: chronyd }
        inet-nuke: { server: chronyd }
        corp-ws: { client: chrony, source: { hostname: inet-nuke, interface: IF0 } }
        vendor-ws: { client: chrony, source: { hostname: inet-nuke, interface: IF0 } }
        utility-derms: { client: chrony, source: { hostname: inet-nuke, interface: IF0 } }
        isp-rtr: { client: ntp, source: { hostname: inet-nuke, interface: IF0 } }
        util-rtr: { client: ntp, source: { hostname: inet-nuke, interface: IF0 } }
        fw-edge: { client: ntp, source: { hostname: inet-nuke, interface: IF0 } }
        fw-ot: { client: ntp }
      roles: &ntp-roles
        # HELICS-backed devices and the federates follow sim-ctl over MGMT.
        sim: { client: chrony, source: { hostname: sim-ctl, interface: mgmt } }
        rio: { client: chrony, source: { hostname: sim-ctl, interface: mgmt } }
        field: { client: chrony, source: { hostname: sim-ctl, interface: mgmt } }
        bas: { client: chrony, source: { hostname: sim-ctl, interface: mgmt } }
        plc: { client: chrony }
        scada: { client: chrony }
        historian: { client: chrony }
        ews: { client: chrony }
        hmi: { client: chrony }
        bbmd: { client: chrony }
        fep: { client: chrony }
        soc: { client: chrony }
        workstation: { client: chrony }
        vpn: { client: chrony }
        jump: { client: chrony }
    soh: true
    wireguard: true
    scorch: true
    app:
      # The Wazuh agents: exactly the hosts that have a conduit to wazuh on TCP
      # 1514/1515 through fw-ot (DESIGN.md 10.3: OPS, HMI, and bas-fuxa in BAS,
      # and the DMZ hosts) or share its SOC VLAN. Only these get the enrollment
      # password. bas-bbmd has no conduit and runs no agent; netcheck's tests
      # check this list against the conduit matrix.
      wazuh:
        manager: wazuh
        agents: [scada-fuxa, historian, ews, ot-svc, hmi-brewhouse, hmi-packaging, bas-fuxa, dmz-vpn, dmz-jump, malcolm, soc-analyst]

  lite:
    description: >-
      The full plant without the SOC (malcolm, wazuh, soc-analyst) and vendor
      remote access (vendor-ws, dmz-vpn, dmz-jump): 37 VMs (DESIGN.md §11).
    areas: [BH, CEL, PKG, UTL, PWR, FAC]
    federates: *full-federates
    hosts:
      - isp-rtr
      - inet-nuke
      - util-rtr
      - utility-derms
      - corp-ws
      - fw-edge
      - fw-ot
      - scada-fuxa
      - historian
      - ews
      - ot-svc
      - hmi-brewhouse
      - hmi-packaging
      - plc-brewhouse
      - plc-cellar
      - plc-packaging
      - plc-utilities
      - plc-power
      - rio-brewhouse
      - rio-cellar
      - rio-packaging
      - rio-utilities
      - glycol-chiller
      - relay-main
      - pv-inverter
      - bess-pcs
      - gen-ats
      - rtu-der
      - bas-bbmd
      - bas-fuxa
      - bas-rtu-taproom
      - bas-coldroom
      - bas-vent
      - sim-ctl
      - sim-process
      - sim-power
      - sim-building
    helics: *full-helics
    ground_truth: true
    clock: *full-clock
    sim: *full-sim
    federate_sim: *full-federate-sim
    ntp:
      default_source: { hostname: ot-svc, interface: IF0 }
      hosts:
        ot-svc: { server: chronyd }
        sim-ctl: { server: chronyd }
        inet-nuke: { server: chronyd }
        corp-ws: { client: chrony, source: { hostname: inet-nuke, interface: IF0 } }
        utility-derms: { client: chrony, source: { hostname: inet-nuke, interface: IF0 } }
        isp-rtr: { client: ntp, source: { hostname: inet-nuke, interface: IF0 } }
        util-rtr: { client: ntp, source: { hostname: inet-nuke, interface: IF0 } }
        fw-edge: { client: ntp, source: { hostname: inet-nuke, interface: IF0 } }
        fw-ot: { client: ntp }
      roles: *ntp-roles
    soh: true
    wireguard: false
    scorch: true
