<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cellar 2.5D view</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: auto; }
    svg { display: block; width: 100vw; height: 100vh; }
    .tag { font: 600 14px system-ui, sans-serif; fill: #e6e9ed; }
    .sub { font: 12px system-ui, sans-serif; fill: #9aa4ae; }
    .fan.on { animation: spin 0.6s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- The 2.5D baseline: the same frames as the 3D page, drawn as SVG and redrawn only when a frame arrives. -->
  <svg id="plant" viewBox="0 0 1280 720" role="img" aria-label="Cellar schematic driven by live data">
    <rect width="1280" height="720" fill="#1b2026"/>
    <text x="24" y="36" class="tag" style="font-size:18px">CherryMountain cellar: 2.5D view (SVG baseline)</text>
    <text x="24" y="58" class="sub" id="clock">waiting for data</text>
    <rect x="40" y="120" width="1200" height="480" fill="#2a3037" stroke="#3a4149"/>
    <rect id="gas" x="41" y="599" width="1198" height="1" fill="#8fd0ff" opacity="0.1"/>
    <g id="tanks"></g>
    <g id="sensors"></g>
    <g id="fans"></g>
    <circle id="beacon" cx="1180" cy="140" r="10" fill="#555b62"/>
  </svg>
  <footer class="panel status"><span id="status">connecting</span></footer>
  <script>
    'use strict';
    const NS = 'http://www.w3.org/2000/svg';
    const $ = (id) => document.getElementById(id);
    const el = (tag, attrs, parent) => {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      parent.appendChild(e);
      return e;
    };
    const tempColor = (f) => (f < 40 ? '#37a6d9' : f < 58 ? '#9fb36a' : f < 72 ? '#e39a2d' : '#d22f2f');
    const tierColor = (p) => (p >= 30000 ? '#ff2b2b' : p >= 15000 ? '#ff8c1a' : p >= 5000 ? '#ffe04a' : '#4cc38a');
    const bandColor = (p) => (p < 0.5 ? '#7d8790' : p < 12.5 ? '#4cc38a' : p < 14.5 ? '#ffb020' : '#ff3b30');
    const ids = ['FV101', 'FV102', 'FV103', 'FV104', 'BBT201', 'BBT202'];
    const tanks = {};
    ids.forEach((id, i) => {
      const bbt = id.startsWith('BBT');
      const x = 110 + i * 185, w = bbt ? 110 : 130, h = bbt ? 220 : 280, y = 560 - h;
      const g = el('g', {}, $('tanks'));
      el('rect', { x, y, width: w, height: h, rx: 14, fill: '#3b434c', stroke: '#aab4be', 'stroke-width': 2 }, g);
      const liquid = el('rect', { x: x + 4, y: y + h - 4, width: w - 8, height: 0, rx: 10, fill: '#e39a2d' }, g);
      const band = el('rect', { x: x - 3, y: y + 10, width: w + 6, height: 8, fill: '#7d8790' }, g);
      const t1 = el('text', { x, y: y - 26, class: 'tag' }, g);
      const t2 = el('text', { x, y: y - 8, class: 'sub' }, g);
      tanks[id] = { y, h, liquid, band, t1, t2, name: id.replace(/(\D+)(\d+)/, '$1-$2') };
    });
    const sensors = [180, 520, 860, 1000].map((x) => {
      const r = el('rect', { x, y: 576, width: 14, height: 14, fill: '#4cc38a' }, $('sensors'));
      const t = el('text', { x: x - 10, y: 616, class: 'sub' }, $('sensors'));
      return { r, t };
    });
    const fans = [260, 420].map((y) => {
      const g = el('g', { transform: `translate(60 ${y})` }, $('fans'));
      el('circle', { r: 26, fill: 'none', stroke: '#6b737c', 'stroke-width': 5 }, g);
      const rotor = el('g', { class: 'fan' }, g);
      el('rect', { x: -3, y: -22, width: 6, height: 44, fill: '#c0c7ce' }, rotor);
      el('rect', { x: -22, y: -3, width: 44, height: 6, fill: '#c0c7ce' }, rotor);
      return rotor;
    });
    const viz = (window.__viz = { ready: true, frames: 0, msgs: 0, ages: [], stateAges: [], renderer: 'SVG', webgl: 0 });
    function apply(f) {
      $('clock').textContent = `Sim ${f.sim_time.replace('T', ' ').slice(0, 19)} · ×${f.speed} · ${f.source}`;
      for (const v of f.truth.vessels) {
        const t = tanks[v.id];
        const lh = Math.max(0, Math.min(1, v.level_pct / 100)) * (t.h - 8);
        t.liquid.setAttribute('y', t.y + t.h - 4 - lh);
        t.liquid.setAttribute('height', lh);
        t.liquid.setAttribute('fill', tempColor(v.temp_f));
        t.band.setAttribute('fill', bandColor(v.pressure_psig));
        t.t1.textContent = `${t.name}  ${v.temp_f.toFixed(1)} °F`;
        t.t2.textContent = `${Math.max(0, v.pressure_psig).toFixed(1)} psig · ${v.level_pct.toFixed(0)} %` +
          (v.leak_gps > 0 ? ` · LEAK ${v.leak_gps.toFixed(0)} g/s` : '');
      }
      const air = f.truth.air;
      const low = air.co2_sensors_ppm.reduce((a, b) => a + b, 0) / 4;
      const gh = Math.min(1, Math.max(0, (low - 1000) / 39000)) * 300;
      $('gas').setAttribute('y', 599 - gh);
      $('gas').setAttribute('height', gh + 1);
      $('gas').setAttribute('fill', tierColor(low));
      $('gas').setAttribute('opacity', 0.08 + 0.25 * Math.min(1, low / 30000));
      air.co2_sensors_ppm.forEach((p, i) => {
        sensors[i].r.setAttribute('fill', tierColor(p));
        sensors[i].t.textContent = `${Math.round(p).toLocaleString('en-US')} ppm`;
      });
      air.purge_fans_running.forEach((on, i) => fans[i].classList.toggle('on', on));
      $('beacon').setAttribute('fill', air.tiers[1] ? '#ff2b2b' : air.tiers[0] ? '#ffb020' : '#555b62');
      viz.frames += 1;
    }
    function connect() {
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
      ws.onmessage = (ev) => {
        const f = JSON.parse(ev.data);
        const now = Date.now();
        viz.msgs += 1;
        viz.ages.push(now - f.sent_wall_ms);
        viz.stateAges.push(now - f.sampled_wall_ms);
        apply(f);
        $('status').textContent = `SVG · ${viz.msgs} frames received · redrawn on data only`;
      };
      ws.onclose = () => setTimeout(connect, 1000);
    }
    connect();
  </script>
</body>
</html>
