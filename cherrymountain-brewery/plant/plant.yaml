    upstream: [rtu-der]
    interfaces:
      IF0: { vlan: UTIL, ip: 192.0.2.10/24 }
  corp-ws:
    role: workstation
    interfaces:
      IF0: { vlan: CORP, ip: 10.10.10.10/24 }
  fw-edge:
    role: firewall
    vyos: true
    interfaces:
      IF0: { vlan: INET, ip: 203.0.113.2/24 }
