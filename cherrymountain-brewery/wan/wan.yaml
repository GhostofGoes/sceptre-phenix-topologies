  - 10.10.0.0/16
  - 10.20.0.0/16
  - 10.30.0.0/16
  - 10.40.0.0/16
  fc-fw-edge:
  - 10.11.0.0/16
  - 10.21.0.0/16
  ep-fw-edge:
  - 10.12.0.0/16
  - 10.22.0.0/16
  - 10.32.0.0/16
  - 10.42.0.0/16
