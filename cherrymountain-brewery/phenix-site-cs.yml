# Workflow for the site `cs` alone: Colorado Springs: brewery and taproom, bought from another company.
# It has the site's topology file and its scenario, with no internet and no
# other site. Apply it with its own branch, so that it maps to its own
# experiment (DESIGN.md 15.1):
#   docker exec phenix phenix workflow apply \
#     -b cherrymountain-site-cs -c phenix-site-cs.yml \
#     /phenix/topologies/cherrymountain-brewery
# The VLAN IDs are the fleet's (docs/multisite/PLANS.md, section 3): the site
# has the IDs from 401 to 499, and its access links to the ISPs take
# 500 and up. The bridge is the site's own, because phenix lets only one
# stored experiment use a bridge other than `phenix`.
#
# Generated by plantgen from plant/sites.yaml, wan/wan.yaml, and the VLAN IDs
# of phenix.yml. Do not edit: run `python -m plantgen` in tools/plantgen.
apiVersion: phenix.sandia.gov/v0
kind: Workflow
metadata: {}
spec:
  auto:
    create: ${BRANCH_NAME}
    update: true
    restart: true
  topology: cherrymountain-site-cs
  scenario: cherrymountain-site-cs
  vlans:
    CS-FIELD-BH: 409
    CS-FIELD-CEL: 410
    CS-FIELD-PKG: 411
    CS-FIELD-UTL: 412
    CS-BAS: 415
    CS-MGMT: 417
    CS-OFFICE: 420
    CS-PLANT: 421
    WAN-BC-CS: 506
  vlanRange:
    min: 100
    max: 599
  defaultBridge: cherrymtn-cs
