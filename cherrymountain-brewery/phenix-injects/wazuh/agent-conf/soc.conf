<!--
  Shared agent settings for the SOC group (malcolm and soc-analyst), DESIGN.md 14. The
  cherrymountain app enrolls each agent into the group named like its node's zone
  label, and the manager copies this file to /var/ossec/etc/shared/soc/agent.conf.
-->
<!-- Every agent of the group: who signed in and who used sudo (sshd, PAM), which
     Wazuh's own rules read. The agent reads this file and not the journal, which
     holds the same lines: the enrollment hook removes the journald reader the
     agent package configures (80-cm-wazuh-agent.sh). -->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>
