      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/vrouter/cm-vyos-config.sh
    labels:
      zone: inet
    network:
      interfaces:
      - address: 203.0.113.3
        mask: 24
        name: eth0
        proto: static
        type: ethernet
        vlan: INET
      - address: 192.0.2.1
        mask: 24
        name: eth1
        proto: static
        type: ethernet
        vlan: UTIL
      routes:
      - destination: 0.0.0.0/0
