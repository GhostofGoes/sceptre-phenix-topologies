frr defaults traditional
hostname shadecast
log file /var/run/frr/shadecast/frr.log
ip forwarding
!
ip prefix-list OWN seq 5 permit 203.0.113.0/24
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list SITE-NETS seq 5 permit 10.0.0.0/8 ge 16 le 24
ip prefix-list PUBLIC seq 5 deny 10.0.0.0/8 le 32
ip prefix-list PUBLIC seq 10 deny 0.0.0.0/0
ip prefix-list PUBLIC seq 15 permit 0.0.0.0/0 le 24
bgp community-list standard FROM-CUSTOMERS permit 64500:1
!
route-map FROM-CUSTOMER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 200
 set community 64500:1
!
route-map FROM-PEER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 150
 set community 64500:2
!
route-map FROM-PROVIDER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 100
 set community 64500:3
!
route-map TO-UPSTREAM permit 10
 match community FROM-CUSTOMERS
route-map TO-UPSTREAM permit 20
 match ip address prefix-list OWN
!
route-map TO-CUSTOMER permit 10
!
route-map DEFAULT-ONLY permit 10
 match ip address prefix-list DEFAULT
!
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
!
route-map OVERLAY-PRIMARY permit 10
 match ip address prefix-list SITE-NETS
 set local-preference 200
!
route-map OVERLAY-BACKUP permit 10
 match ip address prefix-list SITE-NETS
 set local-preference 100
!
route-map OVERLAY-OUT permit 10
 match ip address prefix-list SITE-NETS
!
ip prefix-list CUST-FR-FW-EDGE seq 5 permit 198.18.105.0/24
route-map FROM-CUST-FR-FW-EDGE permit 10
 match ip address prefix-list CUST-FR-FW-EDGE
 set local-preference 200
 set community 64500:1
!
ip route 203.0.113.0/24 blackhole 250
!
router bgp 64500
 bgp router-id 203.0.113.254
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 198.18.0.5 remote-as 64496
 neighbor 198.18.0.5 description cb-west
 neighbor 198.18.0.5 timers 3 9
 neighbor 198.18.0.5 timers connect 5
 neighbor 198.18.0.18 remote-as 64501
 neighbor 198.18.0.18 description tumbleweed
 neighbor 198.18.0.18 timers 3 9
 neighbor 198.18.0.18 timers connect 5
 neighbor 203.0.113.2 remote-as 64505
 neighbor 203.0.113.2 description fr-fw-edge
 neighbor 203.0.113.2 timers 3 9
 neighbor 203.0.113.2 timers connect 5
 neighbor 203.0.113.2 bfd
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 198.18.0.5 activate
  neighbor 198.18.0.18 activate
  neighbor 203.0.113.2 activate
  neighbor 198.18.0.5 route-map FROM-PROVIDER in
  neighbor 198.18.0.5 route-map TO-UPSTREAM out
  neighbor 198.18.0.5 send-community
  neighbor 198.18.0.18 route-map FROM-PEER in
  neighbor 198.18.0.18 route-map TO-UPSTREAM out
  neighbor 198.18.0.18 send-community
  neighbor 203.0.113.2 default-originate
  neighbor 203.0.113.2 route-map FROM-CUST-FR-FW-EDGE in
  neighbor 203.0.113.2 route-map TO-CUSTOMER out
  neighbor 203.0.113.2 send-community
 exit-address-family
!
bfd
 profile fast
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
 peer 203.0.113.2
  profile fast
 !
!
end
