# cherrymountain-site-ep scenario: the firewall rules of the site `ep`
# and its SoH network tests. Generated by netcheck (tools/netcheck,
# `python -m netcheck --write-sites`) from the conduit matrix
# (netcheck/conduits.py) and plant/sites.yaml. Do not edit.
#
# The rules carry the conduits whose two ends are hosts of this site, and
# nothing else: 82 rules on ep-fw-edge (0) and ep-fw-ot (82).
# This file is not a finished scenario. It does not have these parts yet:
# - The conduits to the internet, the vendor, the utility, and other sites,
#   with the edge's NAT and VPN.
# - The app blocks that plantgen writes for the site
#   (plant/generated/fleet/ep/phenix/), which sync.py does not embed yet.
apiVersion: phenix.sandia.gov/v2
kind: Scenario
