# The CherryMountain Brewery phenix user app and SCORCH component
# (DESIGN.md 16). Both run inside the phenix container, which already ships
# phenix-apps (AppBase, ComponentBase) and its dependencies; the Dockerfile
# next to this file installs this package on top.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cherrymountain-phenix-apps"
version = "0.1.0"
description = "phenix-app-cherrymountain and the plantevent SCORCH component for the CherryMountain Brewery topology"
readme = "README.md"
requires-python = ">=3.12,<4"
license = {text = "GPL-3.0-only"}
# phenix-apps is not on PyPI; the phenix image installs it from
# sandialabs/sceptre-phenix-apps (or the fork, DESIGN.md 16). The rest are
# phenix-apps dependencies, listed for a standalone install.
dependencies = [
    "phenix-apps>=2026.10.30",
    "Mako>=1.3.10",
    # validate_by_alias and validate_by_name (metadata.py) are new in 2.11.
    "pydantic>=2.11",
    "python-box~=7.2",
    "pyyaml~=6.0",
    "requests>=2.32.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-mock>=3.14",
]
dev = [
    "mypy>=1.11",
    "ruff==0.17.3",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
phenix-app-cherrymountain = "cherrymountain_apps.cherrymountain.__main__:main"
phenix-scorch-component-plantevent = "cherrymountain_apps.plantevent.plantevent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cherrymountain_apps*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
cherrymountain_apps = [
    "cherrymountain/templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["cherrymountain_apps"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "A",
    "B",
    "C4",
    "PT",
    "RSE",
    "RET",
    "ARG",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["cherrymountain_apps"]
known-third-party = ["phenix_apps"]

[tool.mypy]
python_version = "3.12"
files = ["cherrymountain_apps"]
warn_unused_ignores = true
check_untyped_defs = true

# phenix-apps ships no py.typed marker, and these have no stubs.
[[tool.mypy.overrides]]
module = ["phenix_apps.*", "box.*", "minimega.*", "mako.*", "plantgen.*"]
ignore_missing_imports = true
