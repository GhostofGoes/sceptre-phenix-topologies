          executor: bash
          testScript: "if ping -c 3 -W 2 10.20.30.11 >/dev/null 2>&1; then\n  echo REACHED\nelse\n  echo UNREACHED\nfi\n"
          testStdout: REACHED
        - name: internet-to-inet
          executor: bash
          testScript: "if ping -c 3 -W 2 198.18.110.11 >/dev/null 2>&1; then\n  echo REACHED\nelse\n  echo UNREACHED\nfi\n"
          testStdout: REACHED
