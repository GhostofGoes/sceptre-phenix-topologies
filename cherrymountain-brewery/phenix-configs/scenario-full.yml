  # sync:end soh
  # SCORCH (DESIGN.md 15.6): the vendor-maintenance run. The vendor's technician brings up
  # the WireGuard tunnel, signs in to Guacamole with TOTP and works in a recorded session on
  # the EWS, and the EWS re-uploads a PLC program (benign: the program the PLC already
  # runs). The baseline detections of DESIGN.md 14 must fire; the two `expect-*` steps check
  # them in Wazuh and Malcolm, which is Roadmap Phase 5's exit criterion. The other runs of
  # 15.6 (baseline-brew-day, utility-outage, ...) are Phase 6 and use plantevent; this one
  # needs no plant event, because nothing in the plant changes.
  #
  # The validators run on the phenix host and read the command's output on stdin; a
  # validator that exits non-zero fails the step. Set PHENIX_SCORCH_HOST_VALIDATORS=0 to
  # skip them. Timing: the program compile on the PLC takes several minutes, so `settle`
  # waits before the status check.
  - name: scorch
    metadata:
      components:
      - name: health-check
        type: soh
        metadata:
          checks:
          - custom-reachability
          - services
          - processes
          - ports
          - docker
          - custom
          failOnError: false
      - name: verify-soc
        type: cc
        metadata:
          vms:
          - hostname: malcolm
            configure:
            - type: exec
              args: /usr/local/sbin/cm-malcolm-health
              wait: true
              validator: grep -q '^HEALTHY'
          - hostname: wazuh
            configure:
            - type: exec
              args: /usr/local/sbin/cm-wazuh-health
              wait: true
              validator: grep -q '^HEALTHY'
      - name: vendor-tunnel
        type: cc
        metadata:
          vms:
          - hostname: vendor-ws
            start:
            - type: exec
              args: systemctl restart wg-quick@wg0 && sleep 8 && wg show wg0 latest-handshakes
              wait: true
              validator: awk '$2 > 0 { found = 1 } END { exit !found }'
      - name: vendor-session
        type: cc
        metadata:
          vms:
          - hostname: vendor-ws
            start:
            - type: exec
              args: python3 -I /usr/local/lib/cm-desktop/cm_vendor_session.py --connection ews-rdp --hold 90
              wait: true
              validator: "! grep -q '\"ok\":false' && grep -q '\"step\":\"sign-out\",\"ok\":true'"
      - name: plc-reupload
        type: cc
        metadata:
          vms:
          - hostname: ews
            start:
            - type: background
              args: python3 -I /usr/local/lib/cm-ews/cm_plc_tool.py upload --plc plc-cellar --host 10.20.10.12 --zip /opt/cherrymountain/ews/programs/plc-cellar.zip > /var/log/cm-plc-reupload.log 2>&1
      - name: settle
        type: pause
        metadata:
          duration: 8m
      - name: plc-status
        type: cc
        metadata:
          vms:
          - hostname: ews
            start:
            - type: exec
              args: python3 -I /usr/local/lib/cm-ews/cm_plc_tool.py status --plc plc-cellar --host 10.20.10.12
              wait: true
              validator: grep -q 'STATUS:RUNNING'
      - name: expect-wazuh
        type: cc
        metadata:
          vms:
          - hostname: wazuh
            start:
            - type: exec
              args: /usr/local/sbin/cm-wazuh-expect --since 30 --export /var/lib/cm-wazuh/vendor-maintenance-alerts.jsonl 100201,100204,100205 100301,100305,100306 100311 100313 100402 100411
              wait: true
              validator: "! grep -q '^FAIL'"
      - name: expect-malcolm
        type: cc
        metadata:
          vms:
          - hostname: malcolm
            start:
            - type: exec
              args: /usr/local/sbin/cm-malcolm-expect --since 30 "CM WireGuard handshake initiation" "CM vendor tunnel address reached the Guacamole login" "CM session from dmz-jump to the EWS" "CM OpenPLC REST session from the EWS" CherryMountain::PLC_REST_From_EWS CherryMountain::PLC_Program_Upload_Suspected
              wait: true
              validator: "! grep -q '^FAIL'"
      - name: analyst-review
        type: break
      - name: collect-evidence
        type: cc
        metadata:
          vms:
          - hostname: vendor-ws
            stop:
            - type: recv
              args: /var/log/cm-vendor-session.jsonl
          - hostname: wazuh
            stop:
            - type: recv
              args: /var/lib/cm-wazuh/vendor-maintenance-alerts.jsonl
      runs:
      - name: vendor-maintenance
        configure:
        - health-check
        - verify-soc
        start:
        - vendor-tunnel
        - vendor-session
        - plc-reupload
        - settle
        - plc-status
        - expect-wazuh
        - expect-malcolm
        - analyst-review
        stop:
        - collect-evidence
