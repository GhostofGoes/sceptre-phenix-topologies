# ot-svc: receive syslog from the routed OT zones on UDP 514 and relay all of
# it, including its own messages, to Wazuh in the SOC (DESIGN.md 10.3). The
# queue keeps messages while Wazuh is down (the lite variant has no Wazuh, so
# the relay just discards them).
module(load="imudp")
input(type="imudp" port="514")

action(
  type="omfwd"
  target="10.40.10.11"
  port="514"
  protocol="udp"
  queue.type="LinkedList"
  queue.size="5000"
  action.resumeRetryCount="-1"
)
