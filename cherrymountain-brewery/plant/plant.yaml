            desc: "BESS enclosure off-gas detector (electrolyte vapor; NFPA 855, UL 9540A)"
            io: bess-pcs.offgas_ppm
            units: ppm
            range: [0, 1000]
            alarms:
              - { kind: high, limit: 50.0, delay: 0s, rationale: bess-offgas }

      - id: GEN
        name: Standby genset (100 kW) and ATS
        model: gen-ats
        rio: gen-ats
        devices:
          - { name: gen-ats, type: gen-ats }
        tags:
          - { id: JT01.PV, desc: Genset output, io: gen-ats.gen_kw, units: kW, range: [0, 150] }
          - { id: JT02.PV, desc: EP-1 emergency panel load, io: gen-ats.ep1_kw, units: kW, range: [0, 150] }
          - { id: LT01.PV, desc: Genset fuel level, io: gen-ats.fuel_pct, units: "%", range: [0, 100] }
          - { id: YS01.PV, desc: Genset running, io: gen-ats.gen_running }
          - id: ZS01.PV
            desc: ATS on the emergency source
            io: gen-ats.on_emergency
            alarms:
              - { kind: state, limit: 1, delay: 0s, rationale: utility-outage, suppress: DMD.XS02.SHED }
          - { id: ZS02.PV, desc: Utility source available at the ATS, io: gen-ats.utility_ok }
          - { id: HS01.CMD, desc: Genset remote start (weekly exercise), io: gen-ats.gen_start }
          # The ATS controller's clock (device type gen-ats). plc-power schedules the
          # on-peak window, the 05:00 reserve, the monthly demand reset, and the
          # weekly exercise from it, and distrusts it when it stops or jumps.
          - { id: KI01.PV, desc: "ATS controller clock, minute of the local day", io: gen-ats.clock_min, units: min, range: [0, 1439] }
          - { id: KI02.PV, desc: "ATS controller clock, local date (days since 1970-01-01)", io: gen-ats.clock_day, units: d, range: [0, 65535] }
          - { id: KI03.PV, desc: "ATS controller clock, calendar month", io: gen-ats.clock_month, units: mo, range: [1, 12] }

      - id: DMD
        name: Demand and tariff logic (SV-SGT)
        model: tariff
        tags:
          - { id: JY01.SP, desc: Monthly demand cap target, type: analog-read-write, units: kW, range: [0, 1000], scaling: 0 }
          - { id: JY02.PV, desc: Month-to-date peak 15-minute demand, type: analog-read, units: kW, range: [0, 1000], scaling: 0 }
          - { id: EY01.SP, desc: BESS minimum state of charge before 05:00 on brew days, type: analog-read-write, units: "%", range: [0, 100], scaling: 0 }
          - { id: XS01.ONPEAK, desc: SV-SGT on-peak window (weekdays 17:00-21:00), type: binary-read }
          - { id: XS02.SHED, desc: Load shed active (large feeders held open), type: binary-read }
          - { id: XS03.BREWDAY, desc: "Brew day scheduled (the next 05:00 starts one; the batch engine or an operator sets it)", type: binary-read-write }
          - { id: XS04.EXERCISE, desc: "Genset exercise in progress (ATS on the genset, utility healthy)", type: binary-read }
          - id: XS05.CLKOK
            desc: "ATS clock trusted (in range, advancing, in step)"
            type: binary-read
            alarms:
              - { kind: state, limit: 0, delay: 5m, rationale: power-clock-untrusted }

