  - name: scorch
    metadata:
      components:
      - name: reach
        type: cc
        metadata:
          vms:
          - hostname: fc-historian
            configure:
            - type: exec
              args: ping -c 5 -i 0.2 -W 2 10.20.30.11
              wait: true
              validator: grep -q ' 0% packet loss'
            - type: exec
              args: ping -c 5 -i 0.2 -W 2 198.18.110.11
              wait: true
              validator: grep -q ' 0% packet loss'
            start:
            - type: exec
              args: ping -c 5 -i 0.2 -W 2 10.20.30.11
              wait: true
              validator: grep -q ' 0% packet loss'
            - type: exec
              args: ping -c 5 -i 0.2 -W 2 198.18.110.11
              wait: true
              validator: grep -q ' 0% packet loss'
            stop:
            - type: exec
              args: ping -c 5 -i 0.2 -W 2 10.20.30.11
              wait: true
