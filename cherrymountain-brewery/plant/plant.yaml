    role: field
    federate: power
    modbus: { interface: IF0, port: 502, unit_id: 1 }
    interfaces:
      IF0: { vlan: FIELD-PWR, ip: 10.20.16.23/24 }
      mgmt: { vlan: MGMT, ip: 172.16.20.24/16 }
  rtu-der:
