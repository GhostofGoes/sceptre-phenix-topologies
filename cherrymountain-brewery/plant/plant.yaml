# CherryMountain Brewery plant tag database (DESIGN.md §12.6).
#
# Single source of truth for tags, I/O, alarms, HELICS keys, and the hosts
# that own them. tools/plantgen reads this file and writes every derived
# artifact under plant/generated/<variant>/. Edit this file, then run
# `python -m plantgen` (see tools/plantgen) and commit both.
#
# Tag names follow ISA-5.1 inside the ISA-88 hierarchy (§6.4):
#   <AREA>.<UNIT>.<LOOP><FUNC><NN>.<ATTR>, for example CEL.FV101.TT01.PV.
#
# Tag `type` uses the phenix ot-sim vocabulary, seen from the PLC:
#   analog-read        AI  (RIO input register, or PLC-computed word)
#   analog-read-write  AO  (RIO holding register, or PLC setpoint word)
#   binary-read        DI  (RIO discrete input, or PLC-computed bit)
#   binary-read-write  DO  (RIO coil, or PLC command bit)
# A tag with `io: <device>.<point>` is wired to a remote I/O point and backed
# by the owning HELICS federate. A tag without `io` lives in PLC memory.
# Each alarm also creates a PLC alarm bit tag named
# <AREA>.<UNIT>.<INSTR>.ALM_<KIND> (for example CEL.FV101.TT01.ALM_DEVIATION).
#
# Analog values are unsigned 16-bit registers holding value x 10^scaling,
# so every range must satisfy 0 <= lo and hi x 10^scaling <= 65535. Points
# marked `signed` are int16 instead (power flows that change direction).
# Pressures are stored as absolute (psia) and displayed as gauge (§6.3).
#
# Building automation points are BACnet objects (`bacnet:` on the point),
# served by the BAS controllers themselves: their tags have no PLC, and their
# alarms are evaluated by FUXA. tools/plantgen/README.md documents the rest of
# the schema (networks, loads, per-unit field hosts, written_by, suppression,
# soh, wireguard, scorch) and every generated file.

schema_version: 1

site:
  name: CherryMountain Brewery
  elevation_ft: 5200
  ambient_psia: 12.1

# VLAN aliases (DESIGN.md §10.2). `gateway` is the router; a network without
# one is an unrouted island. Routed networks reach each other through static
# routes (the firewalls decide what may pass), which the ntp check uses.
networks:
  INET: { subnet: 203.0.113.0/24, gateway: isp-rtr }
  VENDOR: { subnet: 198.51.100.0/24, gateway: isp-rtr }
  UTIL: { subnet: 192.0.2.0/24, gateway: util-rtr }
  CORP: { subnet: 10.10.10.0/24, gateway: fw-edge }
  DMZ: { subnet: 10.10.20.0/24, gateway: fw-edge }
  OPS: { subnet: 10.20.30.0/24, gateway: fw-ot }
  HMI: { subnet: 10.20.20.0/24, gateway: fw-ot }
  CTRL: { subnet: 10.20.10.0/24, gateway: fw-ot }
  FIELD-BH: { subnet: 10.20.11.0/24 }
  FIELD-CEL: { subnet: 10.20.12.0/24 }
  FIELD-PKG: { subnet: 10.20.13.0/24 }
  FIELD-UTL: { subnet: 10.20.14.0/24 }
  DERLINK: { subnet: 10.20.15.0/24, gateway: fw-ot }
  FIELD-PWR: { subnet: 10.20.16.0/24 }
  BAS: { subnet: 10.30.10.0/24, gateway: fw-ot }
  SOC: { subnet: 10.40.10.0/24, gateway: fw-ot }
  MGMT: { subnet: 172.16.0.0/16 }
  MIRROR: { subnet: 172.30.0.0/16 }

# HELICS federates (DESIGN.md §9.2). Keys are <federate>/<device>.<point>;
# writes go to the <federate>/<endpoint> endpoint.
federates:
  cellar:
    host: sim-process
    period_s: 1.0
    endpoint: updates
    # Federate outputs that are not remote I/O points.
    outputs:
      - { key: co2.vent_gps, type: double, units: g/s, desc: CO2 vented into the cellar room (to building) }
      - { key: glycol.load_kw, type: double, units: kW, desc: Jacket heat load on the glycol loop (to utilities) }
      - { key: co2.draw_slpm, type: double, units: L/min, desc: CO2 drawn for BBT carbonation and purges (to utilities), variants: [full, lite] }
      - { key: beer.supply_psia, type: double, units: psia, desc: "Pressure in the beer line to the filler: the head of the bright tank on line, 0 with none (to packaging)", variants: [full, lite] }
    # Inputs from other federates. A subscription is generated only when the
    # source federate is part of the variant; otherwise `default` is used.
    inputs:
      - { key: utilities/glycol.supply_f, type: double, units: degF, default: 28.0 }
      - { key: building/cellar.temp_f, type: double, units: degF, default: 68.0 }
      - { key: weather/pressure.kpa, type: double, units: kPa, default: 83.4 }
      - { key: brewhouse/knockout.gpm, type: double, units: gal/min, default: 0.0, variants: [full, lite] }
      # The bas-vent gas-detection relay (1 = healthy, 0 = tripped). It is
      # de-energize to trip, so it reads open (carbonation inhibited) until the
      # building federate first reports it. The ci variant has neither.
      - { key: building/vent.co2_relay_ok, type: double, default: 0.0, variants: [full, lite] }
      - { key: packaging/beer.draw_gpm, type: double, units: gal/min, default: 0.0, variants: [full, lite] }
    # Per-vessel truth (cellar/<unit>.<key>, unit in lower case): values no
    # transmitter measures, for ground truth and the white cell's 3D view
    # (DESIGN.md §15.10). Fermenters have no level transmitter (§6.3), so their
    # fill is truth only; the bright tanks' level is their LT01 point.
    unit_outputs:
      - { key: level_pct, type: double, units: "%", desc: "Fill, % of the 30 bbl working volume (no transmitter)", models: [fermenter] }
      - { key: spund_gps, type: double, units: g/s, desc: CO2 the spunding valve vents into the room, models: [fermenter] }
      - { key: psv_gps, type: double, units: g/s, desc: CO2 the pressure-relief valve vents into the room, models: [fermenter, bbt] }
      - { key: leak_gps, type: double, units: g/s, desc: "CO2 a scenario release lets out at the vessel (co2-release event)", models: [fermenter, bbt] }
  # Full plant federates (DESIGN.md §9.2). The cellar entry above keeps its
  # ci inputs and outputs; full-plant-only I/O is scoped with `variants`.
  weather:
    host: sim-ctl
    # Weather values change once a minute; the federate steps every second
    # so scenario events from the event API go out within a second.
    period_s: 1.0
    endpoint: updates
    outputs:
      - { key: ambient.temp_f, type: double, units: degF, desc: Outdoor dry-bulb temperature }
      - { key: rh.pct, type: double, units: "%", desc: Outdoor relative humidity }
      - { key: ghi.wm2, type: double, units: W/m2, desc: Global horizontal irradiance }
      - { key: pressure.kpa, type: double, units: kPa, desc: Station pressure corrected to the site elevation }
      - { key: groundwater.temp_f, type: double, units: degF, desc: Seasonal Denver groundwater (city water) temperature }
      - { key: clock.epoch_s, type: double, units: s, desc: "Simulation clock, Unix seconds" }
      - { key: event, type: string, desc: "Last scenario event (JSON), for the ground-truth record" }
  brewhouse:
    host: sim-process
    period_s: 1.0
    endpoint: updates
    outputs:
      - { key: steam.demand_kw, type: double, units: kW, desc: "Steam demand of the HLT, MLT, and kettle jackets (to the boiler)" }
      - { key: glycol.load_kw, type: double, units: kW, desc: Knockout HX stage-2 heat into the glycol loop (to utilities) }
      - { key: drain.gpm, type: double, units: gal/min, desc: Brewhouse drain flow to wastewater }
      - { key: hood.heat_kw, type: double, units: kW, desc: Kettle vapor and heat released into the brewhouse (to building) }
      - { key: knockout.gpm, type: double, units: gal/min, desc: Wort flow to the fermenter at knockout (to cellar) }
      - { key: batch.phase, type: double, desc: Active ISA-88 phase number }
      - { key: batch.completed, type: double, desc: Brews knocked out since the start }
      - { key: batch.active, type: double, desc: Brews in progress }
    inputs:
      - { key: weather/pressure.kpa, type: double, units: kPa, default: 83.4 }
      - { key: weather/groundwater.temp_f, type: double, units: degF, default: 58.0 }
      - { key: weather/ambient.temp_f, type: double, units: degF, default: 75.0 }
      - { key: utilities/steam.psig, type: double, units: psig, default: 15.0 }
      - { key: utilities/glycol.supply_f, type: double, units: degF, default: 28.0 }
  utilities:
    host: sim-process
    period_s: 1.0
    endpoint: updates
    outputs:
      - { key: glycol.supply_f, type: double, units: degF, desc: Glycol supply temperature (to cellar and brewhouse) }
      - { key: steam.psig, type: double, units: psig, desc: Steam header pressure (to brewhouse) }
      - { key: air.psig, type: double, units: psig, desc: Compressed-air header pressure (to packaging) }
      # The CO2 supply header pressure (to cellar and packaging) is the co2
      # device's supply_psig point (UTL.CO2.PT02.PV), published under the same
      # key, utilities/co2.supply_psig; an output too would publish it twice.
      - { key: wastewater.inhibit_events, type: double, desc: "Wastewater discharges inhibited for pH (40 CFR 403.5), for the KPI API" }
      - { key: cip.verified, type: double, desc: "CIP runs that met their verification limits, for the KPI API" }
      - { key: cip.unverified, type: double, desc: "CIP runs logged but not verified, for the KPI API" }
    inputs:
      - { key: weather/ambient.temp_f, type: double, units: degF, default: 75.0 }
      - { key: weather/groundwater.temp_f, type: double, units: degF, default: 58.0 }
      - { key: cellar/glycol.load_kw, type: double, units: kW, default: 5.0 }
      - { key: cellar/co2.draw_slpm, type: double, units: L/min, default: 0.0 }
      - { key: brewhouse/glycol.load_kw, type: double, units: kW, default: 0.0 }
      - { key: brewhouse/steam.demand_kw, type: double, units: kW, default: 0.0 }
      - { key: brewhouse/drain.gpm, type: double, units: gal/min, default: 0.0 }
      - { key: packaging/co2.draw_slpm, type: double, units: L/min, default: 0.0 }
      - { key: packaging/air.demand_scfm, type: double, units: scfm, default: 10.0 }
      # The bas-vent CO2 supply shutoff relay (1 = healthy, 0 = tripped). It is
      # de-energize to trip and wired in series with the valve's solenoid, so
      # the bulk CO2 valve stays closed until the building federate first
      # reports it (DESIGN.md 6.7).
      - { key: building/vent.co2_shutoff_ok, type: double, default: 0.0 }
  packaging:
    host: sim-process
    period_s: 1.0
    endpoint: updates
    outputs:
      - { key: co2.draw_slpm, type: double, units: L/min, desc: CO2 for pre-evacuation and counterpressure (to utilities) }
      - { key: air.demand_scfm, type: double, units: scfm, desc: Compressed-air demand (to utilities) }
      - { key: beer.draw_gpm, type: double, units: gal/min, desc: Beer drawn from BBT-202 by the filler and keg filler (to cellar) }
      - { key: line.state, type: double, desc: Line PackML state (PackTags StateCurrent) }
      - { key: line.bottles, type: double, desc: Bottles filled this shift }
      - { key: bottles.total, type: double, desc: Bottles packaged since the start }
      - { key: kegs.total, type: double, desc: Kegs filled since the start }
      - { key: ttb.bbl, type: double, units: bbl, desc: "Beer packaged in TTB barrels (27 CFR 25.158 cases, 25.156 kegs), for the KPI API" }
      - { key: fill.mean_floz, type: double, units: fl oz, desc: "Mean bottle fill this lot (NIST HB 133), for the KPI API" }
      - { key: fill.under_mav, type: double, desc: "Bottles rejected below the maximum allowable variation, for the KPI API" }
    inputs:
      - { key: cellar/beer.supply_psia, type: double, units: psia, default: 25.0 }
      - { key: utilities/air.psig, type: double, units: psig, default: 100.0 }
      - { key: utilities/co2.supply_psig, type: double, units: psig, default: 60.0 }
  power:
    host: sim-power
    period_s: 1.0
    endpoint: updates
    outputs:
      - { key: grid.kw, type: double, units: kW, desc: Net import at the utility meter (negative for export) }
      - { key: demand.kw, type: double, units: kW, desc: Rolling 15-minute demand }
      - { key: tariff.cost_usd, type: double, units: USD, desc: Month-to-date SV-SGT bill }
      - { key: energy.kwh, type: double, units: kWh, desc: Energy imported since the start }
      - { key: demand.peak_kw, type: double, units: kW, desc: Highest 15-minute demand since the start }
      - { key: tariff.onpeak, type: boolean, desc: "SV-SGT on-peak window (weekdays 17:00-21:00) in effect" }
      - { key: tariff.rate_usd_kwh, type: double, units: USD/kWh, desc: Energy rate now }
      - { key: genset.hours_year, type: double, units: h, desc: "Genset run hours this year, for the KPI API" }
      - { key: genset.test_hours_year, type: double, units: h, desc: "Genset maintenance and test hours this year (40 CFR 60.4211(f) cap), for the KPI API" }
    inputs:
      - { key: weather/ghi.wm2, type: double, units: W/m2, default: 0.0 }
      - { key: weather/ambient.temp_f, type: double, units: degF, default: 75.0 }
      - { key: weather/clock.epoch_s, type: double, units: s, default: 0.0 }
  building:
    host: sim-building
    period_s: 10.0
    endpoint: updates
    outputs:
      - { key: cellar.temp_f, type: double, units: degF, desc: Cellar room temperature (to cellar) }
      - { key: cellar.co2_ppm, type: double, units: ppm, desc: "Cellar room CO2, well mixed" }
      - { key: vent.co2_relay_ok, type: double, desc: "bas-vent gas-detection relay to rio-cellar: 1 below CO2 tier 2 with EP-1 powered, else 0 (to cellar)" }
      - { key: vent.co2_shutoff_ok, type: double, desc: "bas-vent CO2 supply shutoff relay to rio-utilities: 1 while every area is below tier 3 (30,000 ppm) and detection is powered and healthy, else 0 (to utilities)" }
    inputs:
      - { key: weather/ambient.temp_f, type: double, units: degF, default: 75.0 }
      - { key: weather/ghi.wm2, type: double, units: W/m2, default: 0.0 }
      - { key: weather/clock.epoch_s, type: double, units: s, default: 0.0 }
      - { key: cellar/co2.vent_gps, type: double, units: g/s, default: 0.0 }
      - { key: brewhouse/hood.heat_kw, type: double, units: kW, default: 0.0 }
      # CO2 the filler vents into the packaging area, and the supply pressure
      # that drives a leak on the distribution piping (DESIGN.md 6.7).
      - { key: packaging/co2.draw_slpm, type: double, units: L/min, default: 0.0 }
      - { key: utilities/co2.supply_psig, type: double, units: psig, default: 60.0 }

# Electrical loads (DESIGN.md §7.2). Each publisher publishes
# `<federate>/load.<name>.kw` and subscribes to `power/bus.<bus>.energized`;
# the power federate subscribes to every load (default_kw when the publisher
# is not in the variant). Buses: msb (main switchboard), mcc1, boiler, pkg
# (feeders plc-power can hold open), lp1 (T-2 lighting panel), rtu (RTU-1
# breaker on LP-1), ep1 (ATS emergency panel).
loads:
  - { name: boiler, federate: utilities, bus: boiler, rated_kw: 200, desc: Electric steam boiler }
  - { name: chiller, federate: utilities, bus: ep1, rated_kw: 22, default_kw: 12, desc: Glycol chiller (2 stages) and glycol pumps }
  - { name: air, federate: utilities, bus: msb, rated_kw: 12, default_kw: 3, desc: Air compressor (15 hp) }
  - { name: ro, federate: utilities, bus: msb, rated_kw: 4, desc: "RO skid, dosing, misc." }
  - { name: mcc1, federate: brewhouse, bus: mcc1, rated_kw: 15, desc: "Mill, rake, wort and CIP pumps" }
  - { name: line, federate: packaging, bus: pkg, rated_kw: 25, desc: Bottling line and conveyors }
  - { name: kegwasher, federate: packaging, bus: pkg, rated_kw: 12, desc: Keg washer heater }
  - { name: rtu, federate: building, bus: rtu, rated_kw: 12, default_kw: 4, desc: "Taproom RTU-1 (DX cooling, fan)" }
  - { name: coldroom, federate: building, bus: ep1, rated_kw: 3, default_kw: 1.5, desc: Cold room condensing unit }
  - { name: fans, federate: building, bus: ep1, rated_kw: 6, desc: "Kettle exhaust, makeup air, and cellar purge fans" }
  - { name: lighting, federate: building, bus: lp1, rated_kw: 16, default_kw: 5, desc: "Lighting, plugs, office IT" }
  - { name: otracks, federate: building, bus: ep1, rated_kw: 2, default_kw: 2, desc: OT and network racks }

# ot-sim infrastructure device types (`infrastructures: brewery:` in the
# phenix ot-sim app). Point order is register order: the app numbers
# registers in device order, then point order, so do not reorder casually.
device_types:
  fv-zone:
    temp_f: { type: analog-read, scaling: 2 }
    valve: { type: binary-read-write }
  fv-vessel:
    pressure_psia: { type: analog-read, scaling: 2 }
    gravity_plato: { type: analog-read, scaling: 2 }
    spund_sp_psia: { type: analog-read-write, scaling: 2 }
    spund_open: { type: binary-read }
  sim-clock:
    sim_hours: { type: analog-read, scaling: 1 }
  # -- brewhouse (rio-brewhouse) ----------------------------------------------
  mill:
    silo_level_pct: { type: analog-read, scaling: 1 }
    speed_hz: { type: analog-read, scaling: 1 }
    running: { type: binary-read }
    run: { type: binary-read-write }
    auger_run: { type: binary-read-write }
    speed_sp_hz: { type: analog-read-write, scaling: 1 }
  liquor-tank:
    level_pct: { type: analog-read, scaling: 1 }
    temp_f: { type: analog-read, scaling: 1 }
    high_level: { type: binary-read }
    fill_valve: { type: binary-read-write }
  hot-liquor-tank:
    level_pct: { type: analog-read, scaling: 1 }
    temp_f: { type: analog-read, scaling: 1 }
    low_level: { type: binary-read }
    fill_valve: { type: binary-read-write }
    steam_valve_pct: { type: analog-read-write, scaling: 1 }
  mash-tun:
    temp_f: { type: analog-read, scaling: 1 }
    level_pct: { type: analog-read, scaling: 1 }
    bed_dp_psi: { type: analog-read, scaling: 2 }
    runoff_gpm: { type: analog-read, scaling: 1 }
    sparge_gpm: { type: analog-read, scaling: 1 }
    rake_height_in: { type: analog-read, scaling: 1 }
    rake_running: { type: binary-read }
    strike_valve: { type: binary-read-write }
    rake_run: { type: binary-read-write }
    steam_valve_pct: { type: analog-read-write, scaling: 1 }
    runoff_valve_pct: { type: analog-read-write, scaling: 1 }
    sparge_valve_pct: { type: analog-read-write, scaling: 1 }
    rake_speed_pct: { type: analog-read-write, scaling: 1 }
  kettle:
    temp_f: { type: analog-read, scaling: 1 }
    level_pct: { type: analog-read, scaling: 1 }
    ambient_psia: { type: analog-read, scaling: 2 }
    high_level: { type: binary-read }
    whirlpool_valve: { type: binary-read-write }
    hop_doser: { type: binary-read-write }
    steam_valve_pct: { type: analog-read-write, scaling: 1 }
  knockout:
    wort_gpm: { type: analog-read, scaling: 1 }
    stage1_out_f: { type: analog-read, scaling: 1 }
    wort_out_f: { type: analog-read, scaling: 1 }
    o2_slpm: { type: analog-read, scaling: 2 }
    do_ppm: { type: analog-read, scaling: 2 }
    pump_running: { type: binary-read }
    pump_run: { type: binary-read-write }
    to_fv_valve: { type: binary-read-write }
    pump_speed_pct: { type: analog-read-write, scaling: 1 }
    glycol_valve_pct: { type: analog-read-write, scaling: 1 }
    o2_sp_slpm: { type: analog-read-write, scaling: 2 }
  # The brewhouse panel's batch-request handshake with the FUXA batch engine
  # (DESIGN.md 12.2). requests counts the brews asked for at the panel (the
  # brew-day schedule and the start-batch event press it); accepted echoes the
  # count the engine has taken into its queue. Both are 16-bit counters that
  # wrap, so a lost update repeats nothing and a late engine misses nothing.
  batch-panel:
    requests: { type: analog-read, scaling: 0 }
    accepted: { type: analog-read-write, scaling: 0 }

  # -- cellar conditioning and shared equipment (rio-cellar) ------------------
  bbt:
    temp_f: { type: analog-read, scaling: 2 }
    pressure_psia: { type: analog-read, scaling: 2 }
    level_pct: { type: analog-read, scaling: 1 }
    co2_vol: { type: analog-read, scaling: 2 }
    co2_slpm: { type: analog-read, scaling: 1 }
    valve: { type: binary-read-write }
    outlet_valve: { type: binary-read-write }
    co2_valve_pct: { type: analog-read-write, scaling: 1 }
  hop-doser:
    port_closed: { type: binary-read }
    purge_valve: { type: binary-read-write }
    dose_valve: { type: binary-read-write }
  transfer-panel:
    route_ok: { type: binary-read }
    pump_running: { type: binary-read }
    flow_gpm: { type: analog-read, scaling: 1 }
    pump_run: { type: binary-read-write }
  # The gas-detection relay contact from bas-vent, hardwired into rio-cellar
  # (DESIGN.md §6.6 #6): energized (TRUE) while the cellar is below CO2 tier 2
  # and the detection panel has power. De-energize to trip.
  gas-relay:
    co2_ok: { type: binary-read }
  # The lift switch on a vessel's pressure-relief valve (PSV, set at the 15 psig
  # MAWP, DESIGN.md §6.3): TRUE while the valve is lifted.
  psv:
    lifted: { type: binary-read }

  # -- packaging (rio-packaging) -----------------------------------------------
  # Machine PackTags as the OEM controllers expose them (DESIGN.md §6.3).
  # state is PackTags StateCurrent (2 Stopped, 4 Idle, 6 Execute, 11 Held,
  # ...); cmd is CntrlCmd (1 Reset, 2 Start, 3 Stop, 4 Hold, 5 Unhold,
  # 6 Suspend, 7 Unsuspend, 8 Abort, 9 Clear); mode is UnitModeCurrent
  # (1 Production, 2 Maintenance, 3 Manual). Counts are 16-bit and wrap.
  packml-machine:
    state: { type: analog-read, scaling: 0 }
    mode: { type: analog-read, scaling: 0 }
    speed_bpm: { type: analog-read, scaling: 1 }
    processed: { type: analog-read, scaling: 0 }
    defective: { type: analog-read, scaling: 0 }
    stop_reason: { type: analog-read, scaling: 0 }
    jammed: { type: binary-read }
    cmd: { type: analog-read-write, scaling: 0 }
    mode_cmd: { type: analog-read-write, scaling: 0 }
    speed_sp_bpm: { type: analog-read-write, scaling: 1 }
  filler:
    state: { type: analog-read, scaling: 0 }
    mode: { type: analog-read, scaling: 0 }
    speed_bpm: { type: analog-read, scaling: 1 }
    processed: { type: analog-read, scaling: 0 }
    defective: { type: analog-read, scaling: 0 }
    stop_reason: { type: analog-read, scaling: 0 }
    bowl_psia: { type: analog-read, scaling: 2 }
    jammed: { type: binary-read }
    low_bowl: { type: binary-read }
    product_valve: { type: binary-read-write }
    cmd: { type: analog-read-write, scaling: 0 }
    mode_cmd: { type: analog-read-write, scaling: 0 }
    speed_sp_bpm: { type: analog-read-write, scaling: 1 }
  # The line's operator panel at the filler (DESIGN.md §6.3): the PackML command
  # of the button being pressed (CntrlCmd), 0 while none is. plc-packaging takes
  # a press as one line command. The line operator of the packaging federate
  # starts the shift here, stops it, and starts a stopped line again.
  line-panel:
    cmd: { type: analog-read, scaling: 0 }
  keg-machine:
    state: { type: analog-read, scaling: 0 }
    mode: { type: analog-read, scaling: 0 }
    processed: { type: analog-read, scaling: 0 }
    defective: { type: analog-read, scaling: 0 }
    stop_reason: { type: analog-read, scaling: 0 }
    wash_temp_f: { type: analog-read, scaling: 1 }
    jammed: { type: binary-read }
    heater: { type: binary-read-write }
    cmd: { type: analog-read-write, scaling: 0 }
    mode_cmd: { type: analog-read-write, scaling: 0 }
  conveyor:
    accum_eye: { type: binary-read }
    jam_eye: { type: binary-read }
    run: { type: binary-read-write }

  # -- utilities (rio-utilities and glycol-chiller) ----------------------------
  chiller:
    supply_f: { type: analog-read, scaling: 1 }
    return_f: { type: analog-read, scaling: 1 }
    power_kw: { type: analog-read, scaling: 1 }
    stage1_on: { type: binary-read }
    stage2_on: { type: binary-read }
    fault: { type: binary-read }
    enable: { type: binary-read-write }
    supply_sp_f: { type: analog-read-write, scaling: 1 }
    # Refrigerant detector at the chiller (ASHRAE 15; R-410A, alarm at the
    # 1,000 ppm occupational exposure limit).
    refrig_ppm: { type: analog-read, scaling: 0 }
  glycol-loop:
    reservoir_pct: { type: analog-read, scaling: 1 }
    pump_psig: { type: analog-read, scaling: 1 }
    pump_running: { type: binary-read }
    pump_run: { type: binary-read-write }
    pump_speed_pct: { type: analog-read-write, scaling: 1 }
  boiler:
    pressure_psig: { type: analog-read, scaling: 1 }
    power_kw: { type: analog-read, scaling: 1 }
    running: { type: binary-read }
    low_water: { type: binary-read }
    enable: { type: binary-read-write }
    pressure_sp_psig: { type: analog-read-write, scaling: 1 }
  air-compressor:
    header_psig: { type: analog-read, scaling: 1 }
    running: { type: binary-read }
    dryer_fault: { type: binary-read }
    enable: { type: binary-read-write }
  co2-supply:
    tank_psig: { type: analog-read, scaling: 1 }
    tank_level_pct: { type: analog-read, scaling: 1 }
    supply_psig: { type: analog-read, scaling: 1 }
    main_valve: { type: binary-read-write }
    # The main valve's open limit switch. The valve's solenoid is wired through
    # the bas-vent shutoff relay, so it reads closed whatever the PLC commands
    # while the relay is tripped (DESIGN.md 6.7).
    valve_open: { type: binary-read }
  ro-skid:
    permeate_gpm: { type: analog-read, scaling: 1 }
    conductivity_us: { type: analog-read, scaling: 0 }
    running: { type: binary-read }
    run: { type: binary-read-write }
  wastewater:
    level_pct: { type: analog-read, scaling: 1 }
    ph: { type: analog-read, scaling: 2 }
    high_level: { type: binary-read }
    caustic_pump: { type: binary-read-write }
    acid_pump: { type: binary-read-write }
    discharge_valve: { type: binary-read-write }
  cip-skid:
    supply_f: { type: analog-read, scaling: 1 }
    return_cond_ms: { type: analog-read, scaling: 2 }
    return_gpm: { type: analog-read, scaling: 1 }
    caustic_level_pct: { type: analog-read, scaling: 1 }
    acid_level_pct: { type: analog-read, scaling: 1 }
    return_flow: { type: binary-read }
    supply_pump: { type: binary-read-write }
    return_pump: { type: binary-read-write }
    caustic_dose: { type: binary-read-write }
    acid_dose: { type: binary-read-write }
    steam_valve_pct: { type: analog-read-write, scaling: 1 }
  cip-panel:
    route_bh: { type: binary-read }
    route_fv101: { type: binary-read }
    route_fv102: { type: binary-read }
    route_fv103: { type: binary-read }
    route_fv104: { type: binary-read }
    route_bbt201: { type: binary-read }
    route_bbt202: { type: binary-read }

  # -- electrical (FIELD-PWR) ---------------------------------------------------
  # Signed points are int16 registers. Power is positive into the plant
  # (import) at the relay and positive out of the battery (discharge).
  relay-meter:
    p_kw: { type: analog-read, scaling: 1, signed: true }
    q_kvar: { type: analog-read, scaling: 1, signed: true }
    v_ll: { type: analog-read, scaling: 1 }
    i_a: { type: analog-read, scaling: 1 }
    freq_hz: { type: analog-read, scaling: 2 }
    demand_kw: { type: analog-read, scaling: 1 }
    breaker_closed: { type: binary-read }
    tripped: { type: binary-read }
    close: { type: binary-read-write }
  msb-feeders:
    boiler_closed: { type: binary-read }
    pkg_closed: { type: binary-read }
    rtu_closed: { type: binary-read }
    boiler_close: { type: binary-read-write }
    pkg_close: { type: binary-read-write }
    rtu_close: { type: binary-read-write }
  pv-inverter:
    p_kw: { type: analog-read, scaling: 1 }
    limit_pct: { type: analog-read, scaling: 1 }
    connected: { type: binary-read }
    enable: { type: binary-read-write }
    site_limit_pct: { type: analog-read-write, scaling: 1 }
    utility_limit_pct: { type: analog-read-write, scaling: 1, written_by: rtu-der }
  bess-pcs:
    p_kw: { type: analog-read, scaling: 1, signed: true }
    soc_pct: { type: analog-read, scaling: 1 }
    connected: { type: binary-read }
    fault: { type: binary-read }
    enable: { type: binary-read-write }
    p_sp_kw: { type: analog-read-write, scaling: 1, signed: true }
    utility_p_sp_kw: { type: analog-read-write, scaling: 1, signed: true, written_by: rtu-der }
    # Battery management (NFPA 855, UL 9540A): the hottest cell temperature and
    # the enclosure's off-gas (electrolyte vapor) detector, the first sign of a
    # cell venting ahead of thermal runaway.
    cell_temp_f: { type: analog-read, scaling: 1 }
    offgas_ppm: { type: analog-read, scaling: 0 }
  gen-ats:
    gen_kw: { type: analog-read, scaling: 1 }
    ep1_kw: { type: analog-read, scaling: 1 }
    fuel_pct: { type: analog-read, scaling: 1 }
    gen_running: { type: binary-read }
    on_emergency: { type: binary-read }
    utility_ok: { type: binary-read }
    gen_start: { type: binary-read-write }
    # The ATS controller's real-time clock: the simulation clock's local civil
    # date and time, the calendar SV-SGT bills by (DESIGN.md 7.3, 9.4). Three
    # 16-bit registers (no scaling): the minute of the day, the date as days
    # since 1970-01-01 (monotonic, so a reader can tell a stopped or jumping
    # clock from a running one; weekday is (day + 4) mod 7, 0 = Sunday), and the
    # calendar month (the billing month rolls over with it). They are appended
    # after the existing points, so no existing register moves.
    clock_min: { type: analog-read, scaling: 0 }
    clock_day: { type: analog-read, scaling: 0 }
    clock_month: { type: analog-read, scaling: 0 }

  # -- building automation (BACnet objects, DESIGN.md §8.1) -------------------
  # Units are BACnet engineering-unit names. Outputs are commandable.
  rtu-1:
    zone_temp_f: { type: analog-read, bacnet: { object_type: analog-input, units: degreesFahrenheit } }
    zone_co2_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    supply_air_f: { type: analog-read, bacnet: { object_type: analog-input, units: degreesFahrenheit } }
    power_kw: { type: analog-read, bacnet: { object_type: analog-input, units: kilowatts } }
    econ_pct: { type: analog-read-write, bacnet: { object_type: analog-output, units: percent } }
    cool_sp_f: { type: analog-read-write, bacnet: { object_type: analog-value, units: degreesFahrenheit } }
    heat_sp_f: { type: analog-read-write, bacnet: { object_type: analog-value, units: degreesFahrenheit } }
    supply_fan: { type: binary-read-write, bacnet: { object_type: binary-output } }
    cool_stage1: { type: binary-read-write, bacnet: { object_type: binary-output } }
    cool_stage2: { type: binary-read-write, bacnet: { object_type: binary-output } }
    heat: { type: binary-read-write, bacnet: { object_type: binary-output } }
    occ_mode: { type: analog-read-write, bacnet: { object_type: multi-state-value, states: [occupied, unoccupied, standby] } }
  coldroom:
    room_temp_f: { type: analog-read, bacnet: { object_type: analog-input, units: degreesFahrenheit } }
    door_open_min: { type: analog-read, bacnet: { object_type: analog-value, units: minutes } }
    setpoint_f: { type: analog-read-write, bacnet: { object_type: analog-value, units: degreesFahrenheit } }
    door: { type: binary-read, bacnet: { object_type: binary-input } }
    compressor: { type: binary-read-write, bacnet: { object_type: binary-output } }
    defrost: { type: binary-read-write, bacnet: { object_type: binary-output } }
  vent:
    co2_1_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    co2_2_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    co2_3_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    co2_4_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    mua_discharge_f: { type: analog-read, bacnet: { object_type: analog-input, units: degreesFahrenheit } }
    exhaust_pct: { type: analog-read-write, bacnet: { object_type: analog-output, units: percent } }
    purge_fan_1_status: { type: binary-read, bacnet: { object_type: binary-input } }
    purge_fan_2_status: { type: binary-read, bacnet: { object_type: binary-input } }
    co2_tier_1: { type: binary-read, bacnet: { object_type: binary-value } }
    co2_tier_2: { type: binary-read, bacnet: { object_type: binary-value } }
    co2_tier_3: { type: binary-read, bacnet: { object_type: binary-value } }
    purge_fan_1: { type: binary-read-write, bacnet: { object_type: binary-output } }
    purge_fan_2: { type: binary-read-write, bacnet: { object_type: binary-output } }
    mua_enable: { type: binary-read-write, bacnet: { object_type: binary-output } }
    # CO2 detection beyond the cellar (Denver IFC 5307: every point of use and
    # the supply tank area; DESIGN.md 6.7, 8.1): one low-mounted sensor each at
    # the bulk tank and vaporizer, the filler, and the cold room and draft
    # system; the area tier-1 flag; the CO2 supply shutoff relay to
    # rio-utilities; the horns and strobes; and the area exhaust fans.
    co2_5_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    co2_6_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    co2_7_ppm: { type: analog-read, bacnet: { object_type: analog-input, units: partsPerMillion } }
    co2_area_tier_1: { type: binary-read, bacnet: { object_type: binary-value } }
    co2_shutoff_ok: { type: binary-read, bacnet: { object_type: binary-value } }
    horn_strobe: { type: binary-read-write, bacnet: { object_type: binary-output } }
    area_exhaust: { type: binary-read-write, bacnet: { object_type: binary-output } }

# Hosts that own tags or appear in generated app blocks. Interface names
# and addresses follow DESIGN.md §10.2 (IF0, IF1, ... in zone order; the
# MGMT NIC is `mgmt`). Variants may override interfaces.
hosts:
  sim-ctl:
    role: sim
    app: { type: sim-ctl }
    interfaces:
      mgmt: { vlan: MGMT, ip: 172.16.10.1/16 }
  sim-process:
    role: sim
    interfaces:
      mgmt: { vlan: MGMT, ip: 172.16.10.2/16 }
  rio-cellar:
    role: rio
    federate: cellar
    modbus: { interface: IF0, port: 502, unit_id: 1 }
    interfaces:
      IF0: { vlan: FIELD-CEL, ip: 10.20.12.10/24 }
      mgmt: { vlan: MGMT, ip: 172.16.20.12/16 }
  plc-cellar:
    role: plc
    modbus: { interface: IF0, port: 502, unit_id: 1 }
    poll_ms: 100
    interfaces:
      IF0: { vlan: CTRL, ip: 10.20.10.12/24 }
      IF1: { vlan: FIELD-CEL, ip: 10.20.12.1/24 }
  scada-fuxa:
    role: scada
    # The PLCs, plus the cellar CO2 objects of bas-vent through the BBMDs
    # (DESIGN.md §6.6 #6). Hosts outside a variant are skipped.
    fuxa:
      - { host: plc-brewhouse }
      - { host: plc-cellar }
      - { host: plc-packaging }
      - { host: plc-utilities }
      - { host: plc-power }
      - { host: bas-vent, tags: ["FAC.VENT.AT0*", "FAC.VENT.AY0*", "FAC.VENT.FAN0*.PV", "FAC.VENT.XS01.*", "FAC.VENT.XA01.*"] }
    interfaces:
      IF0: { vlan: OPS, ip: 10.20.30.10/24 }
  ot-svc:
    role: service
    app: { type: bbmd }
    interfaces:
      IF0: { vlan: OPS, ip: 10.20.30.13/24 }
  # -- the rest of the full plant (DESIGN.md §10.2, §11) ----------------------
