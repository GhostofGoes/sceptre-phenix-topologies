# cherrymountain-full scenario (DESIGN.md 15.2 to 15.4): the network and
# infrastructure apps of the whole plant.
#
# Hand-written here: startup, vrouter (the section 10.3 conduit matrix as
# stateful default-deny rulesets, NAT, IPsec, netem), protonuke, mirror, and
# the soh checks. Generated by plantgen and embedded by sync.py (between the
# sync:begin and sync:end markers; do not edit): ot-sim, cherrymountain, helics,
# the ntp host list, and wireguard (range-only throwaway keys). plantgen's soh
# block is merged into the soh app below (see sync.py). App order matters: ot-sim,
# then cherrymountain (which annotates the sim-* federate nodes), then helics,
# which counts federates from those annotations.
#
# vrouter notes (tools/netcheck checks all of them against the plan):
#  * `acl.egress` maps an interface to the ruleset phenix applies to packets
#    coming IN on that interface (the app's naming is from the VLAN's point of
#    view), so each FROM-<zone> ruleset holds what that zone may initiate. The
#    rules match after DNAT, and replies pass on the stateful rule.
#  * The vrouter templates render only the `forward` filter: traffic to a
#    router's own address (IKE, the routers' own syslog and NTP) is not
#    filtered, and rules cannot log. cm-vyos-config.sh (injected by the
#    topology) turns on drop logging and the Wazuh syslog target.
#  * IPsec uses the app's default IKE group; the script adds ikev2.
#  * netem `loss` is an integer percent, so 1 is the smallest value (the design
#    asks for about 0.1 percent).
