# Autotunnel fixture: one VM that serves HTTP on 3000, 8080, and 9200 stand-ins
# (see serve_stubs.sh) with the DESIGN §15.3 annotation style. The VM image
# must run miniccc: phenix only creates non-VNC tunnels when the C2 client is
# already active at PostStart.
# Image: cm-spike (miniccc, python3), built by the workflow; any image with both works.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: spike-autotunnel
spec:
  nodes:
    - type: VirtualMachine
      general: {hostname: sim-ctl}
      annotations:
        phenix/startup-autotunnel: ["13001:3000", "18080:8080", "19200:9200"]
      hardware:
        os_type: linux
        drives: [{image: cm-spike.qc2, inject_partition: 1}]
        memory: 1024
        vcpus: 1
      network:
        interfaces:
          - {name: IF0, vlan: MGMT, address: 172.16.10.10, mask: 16, proto: static, type: ethernet}
    - type: VirtualMachine
      general: {hostname: scada-fuxa}
      annotations:
        phenix/startup-autotunnel: ["11881:1881"]
      hardware:
        os_type: linux
        drives: [{image: cm-spike.qc2, inject_partition: 1}]
        memory: 1024
        vcpus: 1
      network:
        interfaces:
          - {name: IF0, vlan: MGMT, address: 172.16.10.11, mask: 16, proto: static, type: ethernet}
    # Started, then paused before its C2 client registers, to learn what a VM
    # that boots after phenix gave up on its tunnel gets (ci.py).
    - type: VirtualMachine
      general: {hostname: late-vm}
      annotations:
        phenix/startup-autotunnel: ["14001:8080"]
      hardware:
        os_type: linux
        drives: [{image: cm-spike.qc2, inject_partition: 1}]
        memory: 1024
        vcpus: 1
      network:
        interfaces:
          - {name: IF0, vlan: MGMT, address: 172.16.10.12, mask: 16, proto: static, type: ethernet}
