          - name: OWN
            rules:
            - rule: 10
              action: permit
              prefix: 198.18.0.0/24
            - rule: 20
              action: permit
              prefix: 198.18.110.0/24
          communityLists:
          - name: FROM-CUSTOMERS
            rules:
            - rule: 10
              action: permit
              regex: _64496:1_
          routeMaps:
          - name: TO-UPSTREAM
            rules:
            - rule: 10
              action: permit
