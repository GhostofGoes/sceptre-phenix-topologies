# cherrymountain-ci scenario (DESIGN.md 15.2 to 15.4), the cellar slice.
# App order matters: ot-sim annotates rio-cellar with helics/federate, and the
# helics app counts federates from those annotations (sim-process carries its
# own annotation in the topology), so ot-sim runs first and helics second.
# The ot-sim and ntp blocks are plantgen output (plant/generated/ci/phenix/)
# embedded verbatim; sync_ci.py --check fails if they drift. The soh block is
# the DESIGN.md 15.4 sketch trimmed to the five ci hosts.
apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: cherrymountain-ci
  annotations:
    topology: cherrymountain-ci
spec:
  apps:
  # Generated by plantgen from plant/plant.yaml (variant ci). Do not edit.
  - name: ot-sim
    metadata:
      infrastructure: brewery
      infrastructures:
        brewery:
          sim-clock:
            sim_hours:
              type: analog-read
              modbus:
                data-type: uint16
                scaling: 1
          fv-zone:
            temp_f:
              type: analog-read
              modbus:
                data-type: uint16
                scaling: 2
            valve:
              type: binary-read-write
          fv-vessel:
            pressure_psia:
              type: analog-read
              modbus:
                data-type: uint16
                scaling: 2
            gravity_plato:
              type: analog-read
              modbus:
                data-type: uint16
                scaling: 2
            spund_sp_psia:
              type: analog-read-write
              modbus:
                data-type: uint16
                scaling: 2
            spund_open:
              type: binary-read
      helics:
        broker:
          hostname: sim-ctl|mgmt
        federate: cellar
        endpoint: updates
        end-time: 86400
      cpu-module:
        api-endpoint: 127.0.0.1:9101
    hosts:
    - hostname: rio-cellar
      metadata:
        type: fd-server
        modbus:
          interface: IF0:502
          devices:
          - name: cellar/clock
            type: sim-clock
          - name: cellar/fv101-side
            type: fv-zone
          - name: cellar/fv101-cone
            type: fv-zone
          - name: cellar/fv101
            type: fv-vessel
          - name: cellar/fv102-side
            type: fv-zone
          - name: cellar/fv102-cone
            type: fv-zone
          - name: cellar/fv102
            type: fv-vessel
          - name: cellar/fv103-side
            type: fv-zone
          - name: cellar/fv103-cone
            type: fv-zone
          - name: cellar/fv103
            type: fv-vessel
          - name: cellar/fv104-side
            type: fv-zone
          - name: cellar/fv104-cone
            type: fv-zone
          - name: cellar/fv104
            type: fv-vessel
  - name: helics
    metadata:
      broker:
        root: sim-ctl|mgmt
        log-level: summary
        log-dir: /var/log
  # Generated by plantgen from plant/plant.yaml (variant ci). Do not edit.
  - name: ntp
    metadata:
      defaultSource:
        hostname: sim-ctl
        interface: mgmt
    hosts:
    - hostname: sim-ctl
      metadata:
        server: chronyd
    - hostname: sim-process
      metadata:
        client: chrony
    - hostname: rio-cellar
      metadata:
        client: chrony
    - hostname: plc-cellar
      metadata:
        client: chrony
        source:
          hostname: scada-fuxa
          interface: IF0
    - hostname: scada-fuxa
      metadata:
        server: chronyd
  - name: soh
    metadata:
      startupDelay: 10m
      c2Timeout: 15m
      testReachability: "off"
      testCustomReachability:
      - src: plc-cellar
        dst: rio-cellar|IF0
        proto: tcp
        port: 502
        wait: 5m
      - src: scada-fuxa
        dst: plc-cellar|IF0
        proto: tcp
        port: 502
        wait: 5m
      hostProcesses:
        rio-cellar:
        - ot-sim-cpu-module
        - ot-sim-modbus-module
        scada-fuxa:
        - /opt/fuxa/server/main.js
        sim-ctl:
        - helics_broker
        sim-process:
        - cherrymountain_sim
      hostListeners:
        plc-cellar:
        - ":502"
        rio-cellar:
        - ":502"
        scada-fuxa:
        - ":1881"
        sim-ctl:
        - ":23404"
      hostCustomTests:
        plc-cellar:
        - name: openplc-program-running
          executor: bash
          testScript: |
            test -f /var/lib/cm-openplc/provisioned && echo provisioned
          testStdout: provisioned
        scada-fuxa:
        - name: fuxa-project-imported
          executor: bash
          testScript: |
            systemctl is-active cm-fuxa-provision.service
          testStdout: active
