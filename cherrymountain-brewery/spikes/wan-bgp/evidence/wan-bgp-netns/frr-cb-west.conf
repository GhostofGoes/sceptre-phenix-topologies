frr defaults traditional
hostname cb-west
log file /var/run/frr/cb-west/frr.log
ip forwarding
!
ip prefix-list OWN seq 5 permit 198.18.0.0/24
ip prefix-list OWN seq 10 permit 198.18.110.0/24
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list SITE-FR seq 5 permit 10.10.0.0/16 le 24
ip prefix-list SITE-NETS seq 5 permit 10.10.0.0/16 le 24
ip prefix-list SITE-FR seq 10 permit 10.20.0.0/16 le 24
ip prefix-list SITE-NETS seq 10 permit 10.20.0.0/16 le 24
ip prefix-list SITE-FR seq 15 permit 10.30.0.0/16 le 24
ip prefix-list SITE-NETS seq 15 permit 10.30.0.0/16 le 24
ip prefix-list SITE-FR seq 20 permit 10.40.0.0/16 le 24
ip prefix-list SITE-NETS seq 20 permit 10.40.0.0/16 le 24
ip prefix-list SITE-HC seq 5 permit 10.11.0.0/16 le 24
ip prefix-list SITE-NETS seq 25 permit 10.11.0.0/16 le 24
ip prefix-list SITE-HC seq 10 permit 10.21.0.0/16 le 24
ip prefix-list SITE-NETS seq 30 permit 10.21.0.0/16 le 24
ip prefix-list SITE-WS seq 5 permit 10.12.0.0/16 le 24
ip prefix-list SITE-NETS seq 35 permit 10.12.0.0/16 le 24
ip prefix-list SITE-WS seq 10 permit 10.22.0.0/16 le 24
ip prefix-list SITE-NETS seq 40 permit 10.22.0.0/16 le 24
ip prefix-list SITE-WS seq 15 permit 10.32.0.0/16 le 24
ip prefix-list SITE-NETS seq 45 permit 10.32.0.0/16 le 24
ip prefix-list SITE-WS seq 20 permit 10.42.0.0/16 le 24
ip prefix-list SITE-NETS seq 50 permit 10.42.0.0/16 le 24
ip prefix-list SITE-GC seq 5 permit 192.168.10.0/24
ip prefix-list SITE-NETS seq 55 permit 192.168.10.0/24
ip prefix-list SITE-GC seq 10 permit 192.168.20.0/24
ip prefix-list SITE-NETS seq 60 permit 192.168.20.0/24
ip prefix-list SITE-GC seq 15 permit 192.168.30.0/24
ip prefix-list SITE-NETS seq 65 permit 192.168.30.0/24
ip prefix-list PUBLIC seq 1 deny 10.0.0.0/8 le 32
ip prefix-list PUBLIC seq 2 deny 172.16.0.0/12 le 32
ip prefix-list PUBLIC seq 3 deny 192.168.0.0/16 le 32
ip prefix-list PUBLIC seq 10 deny 0.0.0.0/0
ip prefix-list PUBLIC seq 15 permit 0.0.0.0/0 le 24
bgp community-list standard FROM-CUSTOMERS permit 64496:1
!
route-map FROM-CUSTOMER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 200
 set community 64496:1
!
route-map FROM-PEER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 150
 set community 64496:2
!
route-map FROM-PROVIDER permit 10
 match ip address prefix-list PUBLIC
 set local-preference 100
 set community 64496:3
!
route-map TO-UPSTREAM permit 10
 match community FROM-CUSTOMERS
route-map TO-UPSTREAM permit 20
 match ip address prefix-list OWN
!
route-map TO-CUSTOMER permit 10
!
route-map DEFAULT-ONLY permit 10
 match ip address prefix-list DEFAULT
!
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
!
route-map OVERLAY-OUT permit 10
 match ip address prefix-list SITE-NETS
!
ip route 198.18.0.0/24 blackhole 250
ip route 198.18.110.0/24 blackhole 250
!
router bgp 64496
 bgp router-id 198.18.0.251
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor 198.18.0.2 remote-as 64496
 neighbor 198.18.0.2 description cb-south
 neighbor 198.18.0.2 timers 3 9
 neighbor 198.18.0.2 timers connect 5
 neighbor 198.18.0.6 remote-as 64500
 neighbor 198.18.0.6 description shadecast
 neighbor 198.18.0.6 timers 3 9
 neighbor 198.18.0.6 timers connect 5
 neighbor 198.18.0.10 remote-as 64501
 neighbor 198.18.0.10 description tumbleweed
 neighbor 198.18.0.10 timers 3 9
 neighbor 198.18.0.10 timers connect 5
 address-family ipv4 unicast
  network 198.18.0.0/24
  network 198.18.110.0/24
  neighbor 198.18.0.2 activate
  neighbor 198.18.0.6 activate
  neighbor 198.18.0.10 activate
  neighbor 198.18.0.2 next-hop-self
  neighbor 198.18.0.2 send-community
  neighbor 198.18.0.6 route-map FROM-CUSTOMER in
  neighbor 198.18.0.6 route-map TO-CUSTOMER out
  neighbor 198.18.0.6 send-community
  neighbor 198.18.0.10 route-map FROM-CUSTOMER in
  neighbor 198.18.0.10 route-map TO-CUSTOMER out
  neighbor 198.18.0.10 send-community
 exit-address-family
!
end
