        args: -logfile /var/log/protonuke.log -level info -http -serve
    - hostname: ws-ot
      metadata:
        args: -logfile C:\minimega\protonuke.log -level info -http 192.168.100.1,192.168.100.2,192.168.100.3,192.168.100.4,192.168.100.5
    - hostname: ws-owop
      metadata:
        args: -logfile C:\minimega\protonuke.log -level info -http 192.168.100.1,192.168.100.2,192.168.100.3,192.168.100.4,192.168.100.5
    - hostname: ws-grid
