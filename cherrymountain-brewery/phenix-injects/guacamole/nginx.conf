# TLS front end of the Guacamole jump host (DESIGN.md 13). The topology injects this
# as /opt/cherrymountain/guacamole/nginx.conf; the compose file mounts it as the
# default server of the nginx container. Only 443 is published, because the
# conduit matrix lets the vendor's tunnel address reach dmz-jump on TCP 443 only.
#
# The proxy passes the client's address to Guacamole in X-Forwarded-For (replacing
# whatever the client sent, so it cannot be forged), and the web application's
# RemoteIpValve trusts it from the container network. Guacamole's login events then
# show the vendor's tunnel address, 10.99.0.2.
server {
    listen 443 ssl;
    server_name dmz-jump.cherrymountain.test;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:tls:2m;

    # Session recordings are streamed to the browser; screens are sent as they change.
    proxy_buffering off;
    proxy_read_timeout 1h;

    location / {
        proxy_pass http://guacamole:8080/guacamole/;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_cookie_path /guacamole/ /;
        access_log off;
    }
}
