  hub_endpoint: 198.18.105.1
  port: 51823
  net: 10.255.0.4/31
  primary: true
- name: ep-b
  site: ep-fw-edge
  hub: fr-fw-edge
  via: shadecast
  hub_endpoint: 198.18.105.2
  port: 51824
  net: 10.255.0.6/31
  primary: false
- name: cs-a
  site: cs-fw-edge
  hub: fr-fw-edge
  via: bristlecone
  hub_endpoint: 198.18.105.1
  port: 51825
  net: 10.255.0.8/31
  primary: true
site_blocks:
