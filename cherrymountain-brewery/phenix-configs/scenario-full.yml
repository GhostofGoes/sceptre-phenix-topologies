  # TODO(mirror): two requirements of the capture spike (DESIGN.md 14) are not met by the
  # app yet. (1) options:df_default=false on the cluster host's GRE port; the app should
  # set it, there is no way to do it from here. (2) the OpenFlow capture flow in malcolm
  # (in_port=sniffer,actions=output:phenix); this topology injects it for malcolm
  # (phenix-injects/malcolm: 99-zz-capture-flow.sh starts cm-malcolm-capture.service, which
  # also brings the port up) until the app does it. The sohProfile of malcolm is checked
  # by SoH next to the app's own probes: the processes, the web UI listener, and
  # cm-malcolm-health (containers of the profile running, Zeek records in the last 15 minutes).
  - name: mirror
    metadata:
      version: v1
      mirrorNet: 172.30.0.0/16
      mirrorVLAN: MIRROR
      mirrorBridge: cherrymtn
    hosts:
    - hostname: malcolm
      metadata:
        interface: mirror
        setupOVS: true
        vlans:
        - OPS
        - HMI
        - CTRL
        - FIELD-BH
        - FIELD-CEL
        - FIELD-PKG
        - FIELD-UTL
        - FIELD-PWR
        - DERLINK
        - BAS
        - DMZ
        sohProfile:
          processes:
          - dockerd
          - ovs-vswitchd
          listeners:
          - :443
          customTests:
          - name: malcolm-health
