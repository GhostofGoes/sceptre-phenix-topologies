# Variants (DESIGN.md §11, §15.3). Each variant lists the areas, federates,
# and hosts it contains; plantgen emits per-variant outputs.
variants:
  ci:
    description: >-
      Cellar slice for e2e CI: sim-ctl, sim-process, rio-cellar, plc-cellar,
      scada-fuxa. scada-fuxa and plc-cellar share one flat CTRL VLAN with no
      firewall; there is no ot-svc, weather, utilities, or building federate.
    areas: [CEL]
    federates: [cellar]
    hosts: [sim-ctl, sim-process, rio-cellar, plc-cellar, scada-fuxa]
    host_overrides:
      scada-fuxa:
        interfaces:
          IF0: { vlan: CTRL, ip: 10.20.10.10/24 }
    helics:
      broker: { hostname: sim-ctl, interface: mgmt }
      end_time_s: 86400
    ground_truth: false
    # Cellar federate settings (DESIGN.md §9.4). FV-101 starts mid-
    # fermentation here, rather than empty as in the full plant, so its
    # temperature and gravity move during a short CI run.
    sim:
      compression: 48
      noise: true
      seed: 101
      initial_state:
        FV101: { phase: fermenting, sim_hours: 20, temp_f: 66, spund_sp_psig: 1.0 }
        FV102: { phase: fermenting, sim_hours: 48, temp_f: 66, spund_sp_psig: 1.0 }
        FV103: { phase: fermenting, sim_hours: 120, temp_f: 68, dry_hop_lb_per_bbl: 2.0, spund_sp_psig: 12.0 }
        FV104: { phase: fermenting, sim_hours: 264, temp_f: 50, spund_sp_psig: 12.0 }
    # ntp app in app mode, every host listed (DESIGN.md §15.2). ci has no
    # ot-svc, so sim-ctl serves MGMT and scada-fuxa serves the CTRL VLAN.
    ntp:
      default_source: { hostname: sim-ctl, interface: mgmt }
      hosts:
        sim-ctl: { server: chronyd }
        scada-fuxa: { server: chronyd }
        sim-process: { client: chrony }
        rio-cellar: { client: chrony }
        plc-cellar: { client: chrony, source: { hostname: scada-fuxa, interface: IF0 } }
