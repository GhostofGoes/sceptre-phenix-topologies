            desc: Bottling line PackML state (StateCurrent)
            type: analog-read
            range: [0, 17]
            scaling: 0
            alarms:
              - { kind: state, limit: 11, delay: 10m, rationale: line-held }
          - { id: PACKML.MODE, desc: Bottling line PackML mode (UnitModeCurrent), type: analog-read, range: [0, 3], scaling: 0 }
          - { id: PACKML.CMD, desc: Bottling line PackML command (CntrlCmd), type: analog-read-write, range: [0, 9], scaling: 0 }
          - { id: PACKML.MODE_CMD, desc: Bottling line mode command, type: analog-read-write, range: [0, 3], scaling: 0 }
          - { id: PACKML.SPEED_SP, desc: Bottling line speed setpoint (MachSpeed), type: analog-read-write, units: bottles/min, range: [0, 60], scaling: 1 }
          - { id: PACKML.PROCESSED, desc: Bottles filled this shift (wraps at 65535), type: analog-read, range: [0, 65535], scaling: 0 }
          - { id: PACKML.DEFECTIVE, desc: Bottles rejected this shift (wraps at 65535), type: analog-read, range: [0, 65535], scaling: 0 }
          - { id: PACKML.STOP_REASON, desc: Line stop reason (first-out machine), type: analog-read, range: [0, 99], scaling: 0 }
          - { id: KQ01.OEE, desc: Shift OEE, type: analog-read, units: "%", range: [0, 100], scaling: 1 }
          - { id: XS01.RUN, desc: Line not Stopped or Aborted (alarm suppression), type: binary-read }

      - id: FILLER
        name: Monoblock filler/crowner with fill-level inspection
        model: filler
        devices:
