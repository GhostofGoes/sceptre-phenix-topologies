name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # cherrymountain-brewery/**/*.zip is in Git LFS, and sync.py --check
          # reads the committed OpenPLC program ZIP.
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install prek
        # Keep this in step with minimum_prek_version in prek.toml.
        run: pip install 'prek==0.5.10'
      - name: Install system tools for the prek hooks
        # systemd-analyze verifies systemd units and desktop-file-validate checks
        # .desktop files. Docker, for the hadolint hook, is on the runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends systemd desktop-file-utils
      - name: Validate prek config
        run: prek validate-config prek.toml
      - name: Run prek
        # The branch check protects local protected branches, but must not fail
        # after code lands on the upstream main branch.
        env:
          PREK_SKIP: ${{ (github.ref == 'refs/heads/main') && 'no-commit-to-branch' || '' }}
        run: prek run --all-files --show-diff-on-failure
