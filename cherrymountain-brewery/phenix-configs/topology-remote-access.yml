# cherrymountain-remote-access: the vendor remote-access module (DESIGN.md 13
# and 15.3): dmz-vpn (WireGuard gateway), dmz-jump (Guacamole), and vendor-ws.
# Included by cherrymountain-full; the lite variant leaves it out.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: cherrymountain-remote-access
spec:
  nodes:
  - general:
      description: WireGuard gateway (DNAT target of fw-edge)
      hostname: dmz-vpn
    hardware:
      drives:
      - image: cm-wireguard.qc2
        inject_partition: 1
      memory: 1024
      os_type: linux
      vcpus: 1
    injections:
    - description: 'forward policy: the vendor peer may reach dmz-jump on TCP 443 only'
      dst: /etc/cherrymountain/nftables-wireguard.nft
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/wireguard/nftables-wireguard.nft
    - description: WireGuard peer watcher (events for Wazuh)
      dst: /usr/local/lib/cm-wireguard/cm_wg_watch.py
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/wireguard/cm_wg_watch.py
    - description: WireGuard peer watcher unit
      dst: /etc/systemd/system/cm-wg-watch.service
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/wireguard/cm-wg-watch.service
    - description: rotation of the WireGuard peer event log
      dst: /etc/logrotate.d/cm-wireguard
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/wireguard/cm-wireguard.logrotate
    - description: load the forward policy, start the watcher
      dst: /etc/phenix/startup/70-wireguard.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/wireguard/70-wireguard.sh
    labels:
      zone: dmz
    network:
      interfaces:
      - address: 10.10.20.10
        dns:
        - 10.20.30.13
        gateway: 10.10.20.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: DMZ
      routes:
      - destination: 10.20.0.0/16
        next: 10.10.20.2
      - destination: 10.30.10.0/24
        next: 10.10.20.2
      - destination: 10.40.10.0/24
        next: 10.10.20.2
    type: VirtualMachine
  - delay:
      c2:
      - hostname: dmz-vpn
        useUUID: false
    general:
      description: Guacamole jump host (TOTP, session recording)
      hostname: dmz-jump
    hardware:
      drives:
      - image: cm-guacamole.qc2
        inject_partition: 1
      memory: 3072
      os_type: linux
      vcpus: 2
    injections:
    - description: 'Guacamole stack: guacd, web application, PostgreSQL, TLS proxy'
      dst: /opt/cherrymountain/guacamole/docker-compose.yml
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/docker-compose.yml
    - description: the brewery's branding of the Guacamole sign-in page (an extension; sync.py builds it)
      dst: /opt/cherrymountain/guacamole/cherrymountain-brand.jar
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/cherrymountain-brand.jar
    - description: TLS front end of the Guacamole stack
      dst: /opt/cherrymountain/guacamole/nginx.conf
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/nginx.conf
    - description: SQL for the vendor account with TOTP
      dst: /usr/local/lib/cm-guacamole/cm_vendor_sql.py
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/cm_vendor_sql.py
    - description: range-only vendor persona (Guacamole account, TOTP seed, EWS account)
      dst: /etc/cherrymountain/ridgeline.env
      permissions: '0600'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/ridgeline.env
    - description: start the Guacamole stack
      dst: /usr/local/sbin/cm-guacamole-start
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/cm-guacamole-start
    - description: load the pre-pulled container images into Docker
      dst: /usr/local/sbin/cm-load-images
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/docker/cm-load-images
    - description: image loading unit
      dst: /etc/systemd/system/cm-load-images.service
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/docker/cm-load-images.service
    - description: Guacamole stack unit
      dst: /etc/systemd/system/cm-guacamole.service
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/cm-guacamole.service
    - description: container logs of the Guacamole stack into one file for Wazuh
      dst: /etc/rsyslog.d/30-cm-guacamole.conf
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/30-cm-guacamole.conf
    - description: load the images and start the Guacamole stack
      dst: /etc/phenix/startup/70-guacamole.sh
      permissions: '0755'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/70-guacamole.sh
    labels:
      zone: dmz
    network:
      interfaces:
      - address: 10.10.20.11
        dns:
        - 10.20.30.13
        gateway: 10.10.20.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: DMZ
      routes:
      - destination: 10.20.0.0/16
        next: 10.10.20.2
      - destination: 10.30.10.0/24
        next: 10.10.20.2
      - destination: 10.40.10.0/24
        next: 10.10.20.2
      - destination: 10.99.0.0/24
        next: 10.10.20.10
    type: VirtualMachine
  - delay:
      c2:
      - hostname: dmz-vpn
        useUUID: false
    general:
      description: Ridgeline Process Controls technician laptop (WireGuard client, browser)
      hostname: vendor-ws
    hardware:
      drives:
      - image: cm-desktop.qc2
        inject_partition: 1
      memory: 3072
      os_type: linux
      vcpus: 2
    injections:
    - description: range-only vendor persona (Guacamole account, TOTP seed)
      dst: /etc/cherrymountain/ridgeline.env
      permissions: '0600'
      src: /phenix/injects/${BRANCH_NAME}/guacamole/ridgeline.env
    - description: the technician's scripted Guacamole session
      dst: /usr/local/lib/cm-desktop/cm_vendor_session.py
      permissions: '0644'
      src: /phenix/injects/${BRANCH_NAME}/desktop/cm_vendor_session.py
    labels:
      zone: vendor
    network:
      interfaces:
      - address: 198.51.100.10
        dns:
        - 203.0.113.10
        gateway: 198.51.100.1
        mask: 24
        name: IF0
        proto: static
        type: ethernet
        vlan: VENDOR
    type: VirtualMachine
