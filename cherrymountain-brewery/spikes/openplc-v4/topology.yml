# Single-VM fixture: one OpenPLC v4 runtime plus an ews-like client.
# TODO(verify): replace image paths with the images you built for the spike.
apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
  name: spike-openplc
spec:
  nodes:
    - type: VirtualMachine
      general: {hostname: plc-test}
      hardware:
        os_type: linux
        drives: [{image: openplc-v4.qc2, inject_partition: 1}]
        memory: 1024
        vcpus: 1
      network:
        interfaces:
          - {name: IF0, vlan: CTRL, address: 10.20.40.10, mask: 24, proto: static, type: ethernet}
    - type: VirtualMachine
      general: {hostname: client}
      hardware:
        os_type: linux
        drives: [{image: ubuntu-noble.qc2, inject_partition: 1}]
        memory: 1024
        vcpus: 1
      network:
        interfaces:
          - {name: IF0, vlan: CTRL, address: 10.20.40.20, mask: 24, proto: static, type: ethernet}
